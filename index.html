<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Distopia: Layers of Truth | A Free Narrative Adventure Game</title>
<meta name="description" content="A free Telltale-style narrative adventure based on the dystopian novel Dystopia: Layers of Truth by Matthew Culwell. Timed choices, four endings, plays in your browser.">
<meta property="og:title" content="The Distopia: Layers of Truth | Free Narrative Adventure">
<meta property="og:description" content="Play the free choice-driven game based on the novel Dystopia: Layers of Truth by Matthew Culwell.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A0D14'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23C0503C' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23C0503C'/%3E%3C/svg%3E">
<style>
  /* ============ PURPOSE ENGINE MONITORING OVERLAY ============
     Single committed theme: dark cinematic (letterboxed game screen).
     Ground #0A0D14 · panel #121826 · paper #E9E4D8
     system-cyan #6FBFCF · human-amber #D9A441 · glitch-red #C0503C */
  :root{
    --ground:#0A0D14; --panel:#121826; --panel2:#0E1420;
    --paper:#E9E4D8; --dim:#8B8B93; --faint:#4A4F5E;
    --cyan:#6FBFCF; --amber:#D9A441; --red:#C0503C; --green:#7FA36B;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, Menlo, monospace;
    --sans: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--ground); color:var(--paper);
    font-family:var(--serif); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{position:relative;height:100%;display:flex;flex-direction:column}

  /* letterbox bars */
  .bar{flex:0 0 34px;background:#000;z-index:30;position:relative}

  /* stage */
  #stage{
    position:relative;flex:1;display:flex;flex-direction:column;
    justify-content:flex-end;overflow:hidden;
    transition:background 1.2s ease;
  }
  /* environment washes — radial light per location */
  #stage.bg-apartment {background:radial-gradient(120% 90% at 78% 8%, #2A3348 0%, #141B2B 45%, #0A0D14 100%)}
  #stage.bg-street    {background:radial-gradient(130% 100% at 50% 0%, #2E3040 0%, #171A26 50%, #0A0D14 100%)}
  #stage.bg-office    {background:radial-gradient(120% 90% at 50% 12%, #26313A 0%, #131A22 52%, #0A0D14 100%)}
  #stage.bg-cafe      {background:radial-gradient(120% 90% at 30% 15%, #3A3226 0%, #1C1712 52%, #0A0D14 100%)}
  #stage.bg-diner     {background:radial-gradient(120% 90% at 68% 10%, #3B3122 0%, #1D1610 52%, #0A0D14 100%)}
  #stage.bg-dream     {background:radial-gradient(90% 90% at 50% 50%, #232A44 0%, #10121F 55%, #06070C 100%)}
  #stage.bg-tunnels   {background:radial-gradient(110% 80% at 50% 100%, #33291B 0%, #171208 55%, #0A0D14 100%)}
  #stage.bg-stairwell {background:radial-gradient(80% 70% at 50% 20%, #262B24 0%, #121510 55%, #07080A 100%)}
  #stage.bg-conf      {background:radial-gradient(120% 90% at 50% 0%, #1E2B33 0%, #101A20 55%, #0A0D14 100%)}
  #stage.bg-lab       {background:radial-gradient(120% 90% at 50% 10%, #1B3038 0%, #0F1B21 55%, #0A0D14 100%)}
  #stage.bg-void      {background:radial-gradient(80% 80% at 50% 50%, #14161E 0%, #08090D 70%, #000 100%)}

  /* scanlines + vignette */
  #stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px);
  }
  #stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    box-shadow:inset 0 0 140px 30px rgba(0,0,0,0.5);
  }

  /* viewfinder corner brackets */
  .corner{position:absolute;width:26px;height:26px;z-index:2;opacity:.35;pointer-events:none}
  .corner b{position:absolute;background:var(--cyan)}
  .corner .h{width:100%;height:1px}.corner .v{width:1px;height:100%}
  .c-tl{top:14px;left:16px}.c-tr{top:14px;right:16px}.c-bl{bottom:14px;left:16px}.c-br{bottom:14px;right:16px}
  .c-tr .h,.c-br .h{right:0}.c-bl .v,.c-br .v{bottom:0}
  .c-tr .v{right:0}.c-br .v{right:0}.c-bl .h{bottom:0}.c-br .h{bottom:0}

  /* HUD */
  #hud{
    position:absolute;top:12px;left:0;right:0;z-index:20;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:0 52px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    color:var(--dim);text-transform:uppercase;pointer-events:none;
  }
  #hud .rec{display:flex;align-items:center;gap:7px;color:var(--dim)}
  #hud .dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
  #anomCount{color:var(--red);opacity:0;transition:opacity .5s}
  #anomCount.on{opacity:.9}

  /* narrative area */
  #scene{
    position:relative;z-index:10;width:min(66ch,92%);margin:0 auto;
    padding:0 0 22px;
  }
  /* translucent panel behind dialogue and choices so text never sits on a busy set */
  #scene.panel{padding:16px 22px 18px;margin-bottom:14px;
    background:linear-gradient(180deg, rgba(7,9,14,.62), rgba(7,9,14,.8));
    border:1px solid rgba(160,180,210,.08);border-radius:3px;
    -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
  @media (max-width:640px){ #scene.panel{padding:12px 14px 12px;margin-bottom:10px} #scene.panel #text{min-height:3.6em} #scene.panel #more{margin-top:8px} }
  #speaker{
    font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    margin-bottom:10px;color:var(--amber);min-height:15px;
  }
  #speaker.vera{color:var(--cyan)} #speaker.sarah{color:var(--green)}
  #speaker.system{color:var(--red)} #speaker.narr{color:var(--dim)}
  #text{
    font-size:clamp(16px,2.1vmin,19px);line-height:1.72;color:var(--paper);
    min-height:5.2em;text-shadow:0 2px 12px rgba(0,0,0,.8);
  }
  #text p{animation:rise .45s ease both}
  #text p + p{margin-top:.8em}
  #text em{color:#F3EDDE}
  #text .mark{font-family:var(--mono);font-size:.85em;color:var(--cyan);letter-spacing:.06em}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  #more{
    margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;
    color:var(--dim);cursor:pointer;user-select:none;animation:pulse 2.2s infinite;
    text-transform:uppercase;
  }
  @keyframes pulse{0%,100%{opacity:.85}50%{opacity:.3}}

  /* choices */
  #choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .choice{
    font-family:var(--sans);font-size:15px;text-align:left;color:var(--paper);
    background:linear-gradient(90deg, rgba(18,24,38,.92), rgba(18,24,38,.55));
    border:1px solid #2A3247;border-left:3px solid var(--faint);
    padding:11px 16px;cursor:pointer;transition:all .15s ease;
    animation:rise .35s ease both;
  }
  .choice:nth-child(2){animation-delay:.06s}.choice:nth-child(3){animation-delay:.12s}
  .choice:nth-child(4){animation-delay:.18s}.choice:nth-child(5){animation-delay:.24s}
  .choice:hover,.choice:focus-visible{
    border-left-color:var(--amber);background:linear-gradient(90deg,#1B2438,#141B2C);
    color:#FFF6E3;outline:none;transform:translateX(4px);
  }
  .choice.silent{color:var(--dim);font-style:italic}
  .choice.silent:hover,.choice.silent:focus-visible{color:#BDBDC4;border-left-color:var(--cyan)}
  .choice kbd{
    font-family:var(--mono);font-size:10px;color:var(--dim);margin-right:10px;
    border:1px solid var(--dim);padding:1px 5px;border-radius:2px;
  }

  /* timer */
  #timerWrap{height:3px;background:#1A2030;margin-top:12px;display:none}
  #timerBar{height:100%;width:100%;background:linear-gradient(90deg,var(--amber),var(--red));transition:width .1s linear}

  /* toasts — "X will remember that." */
  #toasts{position:absolute;top:52px;left:52px;z-index:40;display:flex;flex-direction:column;gap:8px;max-width:340px}
  .toast{
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;
    background:rgba(10,13,20,.92);border-left:3px solid var(--amber);
    padding:10px 14px;color:var(--paper);animation:toastIn .4s ease both;
    box-shadow:0 4px 24px rgba(0,0,0,.6);
  }
  .toast.vera{border-left-color:var(--cyan)} .toast.sarah{border-left-color:var(--green)}
  .toast.system{border-left-color:var(--red);color:#E8B9AE}
  .toast.anom{border-left-color:var(--red);color:var(--red)}
  .toast.fade{animation:toastOut .6s ease both}
  @keyframes toastIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateX(-14px)}}

  /* glitch */
  .glitching #text{animation:glitch .5s steps(2) 3}
  @keyframes glitch{
    0%{transform:translateX(0)}
    25%{transform:translateX(-3px);text-shadow:3px 0 var(--red),-3px 0 var(--cyan)}
    50%{transform:translateX(3px);text-shadow:-3px 0 var(--red),3px 0 var(--cyan)}
    75%{transform:translateX(-1px);text-shadow:2px 0 var(--cyan)}
    100%{transform:none}
  }

  /* title / chapter cards */
  .card{
    position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(80% 80% at 50% 45%, #10141F 0%, #060810 75%, #000 100%);
    padding:24px;
  }
  .card .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.5em;color:var(--cyan);text-transform:uppercase;margin-bottom:22px}
  .card h1{
    font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vmin,54px);
    letter-spacing:.04em;color:var(--paper);text-wrap:balance;max-width:16ch;
  }
  .card h1 .thin{display:block;font-size:.42em;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-top:14px}
  .card .sub{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.18em;margin-top:26px;text-transform:uppercase}
  .card .menu{display:flex;flex-direction:column;gap:10px;margin-top:38px;width:min(320px,84%)}
  .mbtn{
    font-family:var(--mono);font-size:13px;letter-spacing:.24em;text-transform:uppercase;
    background:none;border:1px solid #2A3247;color:var(--paper);padding:13px 18px;
    cursor:pointer;transition:all .15s;
  }
  .mbtn:hover,.mbtn:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
  .mbtn[disabled]{opacity:.3;cursor:default}
  .mbtn[disabled]:hover{border-color:#2A3247;color:var(--paper)}
  .card .credit{position:absolute;bottom:56px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.14em}
  .card .credit a{color:var(--dim)}

  /* episode stats screen */
  .stats{
    position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:radial-gradient(80% 80% at 50% 40%, #0E1620 0%, #060A10 80%, #000 100%);
    padding:28px;overflow-y:auto;
  }
  .stats .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.4em;color:var(--red);text-transform:uppercase}
  .stats h2{font-family:var(--serif);font-weight:400;font-size:clamp(22px,4vmin,34px);margin:14px 0 6px;text-wrap:balance;text-align:center}
  .stats .note{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.14em;margin-bottom:28px;text-transform:uppercase}
  .statrows{width:min(560px,94%);display:flex;flex-direction:column;gap:16px}
  .srow{font-family:var(--sans)}
  .srow .lbl{font-size:14px;color:var(--paper);margin-bottom:6px}
  .srow .track{height:4px;background:#1A2233;position:relative}
  .srow .fill{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
  .srow .pct{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-top:5px;letter-spacing:.1em}
  .stats .mbtn{margin-top:36px}

  /* QTE */
  #qte{margin-top:18px;display:none;text-align:center}
  #qte .prompt{font-family:var(--mono);font-size:13px;letter-spacing:.24em;color:var(--amber);text-transform:uppercase;animation:pulse 0.7s infinite}
  #qteTrack{height:10px;background:#1A2233;margin-top:12px;border:1px solid #2A3247}
  #qteFill{height:100%;width:0;background:var(--amber);transition:width .08s}

  /* prediction readout */
  .predbox{
    font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--cyan);
    border:1px solid #21455052;background:rgba(15,27,33,.6);padding:10px 14px;margin-top:14px;
  }
  .predbox .acc{color:var(--amber)}

  /* ---- cinematic layers: scene canvas, cast, namecards, hotspots ---- */
  #bgc{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  #fadeveil{position:absolute;inset:0;background:#05070B;z-index:2;pointer-events:none;opacity:0}
  /* letterbox bars: slide in during story nodes, out on menus */
  #lbTop,#lbBot{position:absolute;left:0;right:0;height:0;background:#020304;z-index:3;
    pointer-events:none;transition:height .55s cubic-bezier(.4,0,.2,1)}
  #lbTop{top:0}#lbBot{bottom:0}
  #stage.cine #lbTop{height:5.5vh}#stage.cine #lbBot{height:7vh}
  #cast{position:absolute;inset:0;z-index:4;pointer-events:none}
  .actor{position:absolute;bottom:23%;width:clamp(150px,27vmin,250px);
    transition:opacity .5s, filter .5s, width .8s cubic-bezier(.2,.7,.3,1), bottom .8s cubic-bezier(.2,.7,.3,1),
      left .8s cubic-bezier(.2,.7,.3,1), right .8s cubic-bezier(.2,.7,.3,1), transform .65s ease}
  .actor svg{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 26px rgba(0,0,0,.65))}
  .actor.posL{left:9%}.actor.posR{right:9%}.actor.posC{left:50%;margin-left:calc(clamp(150px,27vmin,250px) / -2)}
  .actor.dim{opacity:.42;filter:brightness(.5) saturate(.6)}
  .actor .breather{animation:breathe 5.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  .actor.enterL{animation:enterL .85s cubic-bezier(.2,.7,.3,1) both}
  .actor.enterR{animation:enterR .85s cubic-bezier(.2,.7,.3,1) both}
  .actor.enterC{animation:enterC .85s cubic-bezier(.2,.7,.3,1) both}
  @keyframes enterL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
  @keyframes enterR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
  @keyframes enterC{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .actor.exit{opacity:0 !important;transform:translateX(var(--exd,40px)) translateY(12px)}
  .actor.closeup{width:clamp(260px,46vmin,430px);bottom:4%;z-index:6}
  .actor.closeup.posL{left:6%}.actor.closeup.posR{right:6%}
  .actor.closeup svg{filter:drop-shadow(0 22px 40px rgba(0,0,0,.8))}
  #lowerShade{position:absolute;left:0;right:0;bottom:0;height:48%;z-index:5;pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(5,7,11,.5) 32%, rgba(5,7,11,.93))}
  #namecard{position:absolute;left:52px;top:15%;z-index:25;opacity:0;transition:opacity .6s;pointer-events:none}
  #namecard.show{opacity:1}
  #namecard .nc-name{font-family:var(--mono);font-size:clamp(19px,3.2vmin,28px);letter-spacing:.32em;color:var(--paper);text-shadow:0 2px 14px rgba(0,0,0,.9)}
  #namecard .nc-role{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--cyan);margin-top:7px;text-transform:uppercase}
  #namecard .nc-rule{height:2px;width:130px;background:var(--amber);margin-top:9px}
  #hotzone{position:absolute;inset:0;z-index:12;pointer-events:none}
  #hotzone .hot{pointer-events:auto}
  .hot{position:absolute;transform:translate(-50%,-50%);background:none;border:none;cursor:pointer;
    color:var(--paper);display:flex;flex-direction:column;align-items:center;gap:6px}
  .hot .ring{width:34px;height:34px;border:1px solid var(--amber);border-radius:50%;position:relative;animation:hotPulse 1.7s infinite}
  .hot .ring::after{content:"";position:absolute;inset:12px;background:var(--amber);border-radius:50%}
  .hot .hlabel{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    background:rgba(6,8,12,.75);padding:3px 9px;white-space:nowrap}
  .hot:hover .ring,.hot:focus-visible .ring{border-color:#FFF6E3;border-width:2px}
  @keyframes hotPulse{0%{box-shadow:0 0 0 0 rgba(217,164,65,.55)}70%{box-shadow:0 0 0 15px rgba(217,164,65,0)}100%{box-shadow:0 0 0 0 rgba(217,164,65,0)}}
  #sqte{display:none;margin-top:16px;text-align:center}
  #sqte .key{font-family:var(--mono);font-size:52px;line-height:1;color:var(--amber);text-shadow:0 0 26px rgba(217,164,65,.55)}
  #sqte .key.hit{color:var(--cyan);text-shadow:0 0 26px rgba(111,191,207,.6)}
  #sqte .key.miss{color:var(--red);text-shadow:0 0 26px rgba(192,80,60,.6)}
  #sqte .sub{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--dim);margin-top:10px;text-transform:uppercase}
  #audioBtn{pointer-events:auto;background:none;border:1px solid #2A3247;color:var(--dim);
    font-family:var(--mono);font-size:10px;letter-spacing:.15em;padding:4px 9px;cursor:pointer;margin-left:16px}
  #audioBtn:hover{color:var(--amber);border-color:var(--amber)}
  /* SYSTEM ATTENTION meter */
  #attWrap{display:inline-flex;align-items:center;gap:8px;margin-right:22px}
  .attLbl{font-size:9px;letter-spacing:.22em;color:var(--dim)}
  #attTrack{display:inline-block;width:90px;height:5px;background:#141A28;border:1px solid #263048;overflow:hidden}
  #attFill{display:block;height:100%;width:12%;background:var(--cyan);transition:width .7s ease, background .7s}
  #attFill.warm{background:var(--amber)}
  #attFill.hot{background:var(--red);animation:attPulse 1s infinite}
  @keyframes attPulse{50%{opacity:.5}}
  .toast.attup{border-left-color:var(--red);color:#E8B0A0}
  .toast.attdown{border-left-color:var(--cyan);color:#A8CFDA}
  /* correction alarm */
  #stage.alarm::after{box-shadow:inset 0 0 200px rgba(192,60,40,.5) !important;animation:alarmPulse 1.3s infinite}
  @keyframes alarmPulse{50%{box-shadow:inset 0 0 260px rgba(192,60,40,.75)}}
  /* hold-still QTE */
  #holdp{display:none;margin-top:16px;text-align:center}
  #holdp .hicon{font-size:56px;line-height:1;color:var(--red);animation:holdPulse 1s infinite}
  #holdp .hsub{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--red);margin-top:10px}
  @keyframes holdPulse{50%{opacity:.35}}
  @media (max-width:640px){
    .actor{width:clamp(120px,34vmin,180px);bottom:30%}
    .actor.posL{left:3%}.actor.posR{right:3%}
    .actor.closeup{width:clamp(190px,58vmin,290px);bottom:16%}
    .actor.closeup.posL{left:2%}.actor.closeup.posR{right:2%}
    #namecard{left:20px;top:12%;bottom:auto}
  }


  /* ============ PLAYABILITY LAYER (menu, settings, history, help, links) ============ */
  #more{display:none;background:none;border:none;padding:10px 0 4px;min-height:40px;text-align:left;width:100%}
  #more:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
  #topCtl{position:absolute;top:8px;right:10px;z-index:58;display:flex;gap:8px}
  #topCtl button{pointer-events:auto;background:rgba(10,13,20,.85);border:1px solid #2A3247;color:var(--paper);
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;padding:0 14px;min-height:44px;min-width:44px;cursor:pointer;text-transform:uppercase}
  #topCtl button:hover,#topCtl button:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
  #topCtl.hidden{display:none}
  #hud{padding-right:220px}
  #menuLayer{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(3,5,9,.86);backdrop-filter:blur(3px);padding:20px}
  #menuLayer.open{display:flex}
  .panel{width:min(520px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid #2A3247;
    padding:26px 24px;font-family:var(--sans);color:var(--paper)}

<script>
"use strict";
/* ============================================================
   THE DISTOPIA: LAYERS OF TRUTH — a Telltale-style adventure
   Based on the novel by Matthew Culwell.
   ============================================================ */

// ---------- state ----------
const DEFAULT_STATE = () => ({
  anomalies: 0, sarah: 0, vera: 0,
  defiance: 0, compliance: 0, integrity: 0, silence: 0,
  trust: 0, attention: 12,
  flags: {}, log: [], unlocked: [1], predAcc: 62, predPicks: []
});
let S = DEFAULT_STATE();
// ---------- player settings (persisted separately from the story save) ----------
const SETTINGS_KEY = "lot_settings";
const SET = Object.assign({ textSpeed:"normal", timer:"normal", sound:true, seenHelp:false, gfx:"auto" },
  (()=>{ try{ return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }catch(e){ return {}; } })());
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(SET)); }catch(e){} }
let PAUSED = false;          // true while the menu is open: timed choices stop draining
const HIST = [];             // dialogue backlog for the History panel
function histPush(item){ HIST.push(item); if (HIST.length > 80) HIST.shift(); }
let cur = null, page = 0, timerId = null, qteId = null;

const $ = id => document.getElementById(id);
const stage = $("stage"), textEl = $("text"), speakerEl = $("speaker"),
      choicesEl = $("choices"), moreEl = $("more"), overlay = $("overlay"),
      timerWrap = $("timerWrap"), timerBar = $("timerBar");

// ---------- helpers ----------
function att(d){ // SYSTEM ATTENTION — visible, immediate
  S.attention = Math.max(0, Math.min(100, S.attention + d));
  updateAtt();
  if (d >= 3) toast("▲ SYSTEM ATTENTION RISING", "attup");
  else if (d <= -3) toast("▼ SYSTEM ATTENTION FALLING", "attdown");
}
function updateAtt(){
  const f = $("attFill"); if (!f) return;
  f.style.width = S.attention + "%";
  f.className = S.attention >= 65 ? "hot" : S.attention >= 35 ? "warm" : "";
}
function fx(o){ // stat effects
  for (const k in o){
    if (k === "flag") S.flags[o.flag] = true;
    else if (k === "att") att(o.att);
    else S[k] = (S[k]||0) + o[k];
  }
}
function toast(msg, cls){
  const t = document.createElement("div");
  t.className = "toast " + (cls||"");
  t.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(()=>{ t.classList.add("fade"); setTimeout(()=>t.remove(), 650); }, 3400);
}
function remember(who){
  const names = {vera:"Vera will remember that.", sarah:"Sarah will remember that.",
                 system:"The Purpose Engine has logged your response. It logs everything.",
                 david:"David will not remember that."};
  toast(names[who] || who, "rem " + who);
  AU.sfx("sting");
}
function anomaly(label){
  S.anomalies++;
  AU.sfx("anom");
  glitchUntil = performance.now()+450;
  const c = $("anomCount");
  c.textContent = "ANOMALY №" + S.anomalies + (label ? " · " + label : "");
  c.classList.add("on");
  toast("+ ANOMALY LOGGED №" + S.anomalies + (label ? ": " + label : ""), "anom");
  setTimeout(()=>c.classList.remove("on"), 4000);
}
function logChoice(ep, label, said){ S.log.push({ep, label, node:cur, said: said ? String(said).replace(/<[^>]+>/g,"") : ""}); }

function save(){
  if (cur === "title") return; // never clobber a real save with the title screen
  const n = STORY[cur];
  try{
    if (n && n.ending){
      // finished: remember the ending, clear the resume point so Continue never reopens a finished run
      const seen = loadEndings(); if (!seen.includes(cur)) seen.push(cur);
      localStorage.setItem("lot_endings", JSON.stringify(seen));
      localStorage.removeItem("lot_save2");
      return;
    }
    localStorage.setItem("lot_save2", JSON.stringify({cur, S}));
  }catch(e){}
}
function loadEndings(){ try{ return JSON.parse(localStorage.getItem("lot_endings")) || []; }catch(e){ return []; } }
function loadEpSnaps(){ try{ return JSON.parse(localStorage.getItem("lot_eps")) || {}; }catch(e){ return {}; } }
function snapEpisode(epn){
  // state at the start of an episode, so it can be replayed or restarted from the menu
  S.curEp = epn;
  const snaps = loadEpSnaps(); snaps[epn] = JSON.parse(JSON.stringify(S));
  try{ localStorage.setItem("lot_eps", JSON.stringify(snaps)); }catch(e){}
}
function loadSave(){
  try{ return JSON.parse(localStorage.getItem("lot_save2")); }catch(e){ return null; }
}

// ============================================================
//  AUDIO — synthesized ambience + UI sounds (WebAudio, no assets)
// ============================================================
const AU = {
  ctx:null, master:null, ambNodes:[], ambGain:null, on:true,
  ensure(){
    if (this.ctx || !this.on) return;
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
    }catch(e){ this.ctx = null; }
  },

const LOT_D2R=Math.PI/180;
function easeSm(t){ return t*t*(3-2*t); }
function makeAnim(bones){
  return {
    bones, cur:"idle", nxt:null, t:Math.random()*4, nt:0, fade:0, fadeDur:0.25,
    play(name,fade){
      if(!LOT_CLIPS[name]) return;
      if(name===this.cur&&!this.nxt) return;
      this.nxt=name; this.nt=0; this.fade=0; this.fadeDur=fade||0.25;
    },
    pose(clipName,t,out){
      const clip=LOT_CLIPS[clipName]; if(!clip) return;
      let ct = clip.loop ? t%clip.dur : Math.min(t,clip.dur-0.0001);
      for(const bn in clip.tracks){
        const keys=clip.tracks[bn];
        let a=keys[0], b=keys[keys.length-1];
        for(let i=0;i<keys.length-1;i++){
          if(ct>=keys[i][0]&&ct<=keys[i+1][0]){ a=keys[i]; b=keys[i+1]; break; }
        }
        const span=Math.max(0.0001,b[0]-a[0]);
        const k=easeSm(Math.max(0,Math.min(1,(ct-a[0])/span)));
        if(!out[bn]) out[bn]=[0,0,0];
        out[bn][0]+=(a[1]+(b[1]-a[1])*k)*LOT_D2R;
        out[bn][1]+=(a[2]+(b[2]-a[2])*k)*LOT_D2R;
        out[bn][2]+=(a[3]+(b[3]-a[3])*k)*LOT_D2R;
      }
    },
    update(dt){
      this.t+=dt;
      const poseA={}; this.pose(this.cur,this.t,poseA);
      let mix=poseA;
      if(this.nxt){
        this.nt+=dt; this.fade=Math.min(1,this.fade+dt/this.fadeDur);
        const poseB={}; this.pose(this.nxt,this.nt,poseB);
        mix={};
        const names={}; for(const n in poseA)names[n]=1; for(const n in poseB)names[n]=1;
        const f=easeSm(this.fade);
        for(const n in names){
          const a=poseA[n]||[0,0,0], b=poseB[n]||[0,0,0];
          mix[n]=[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
        }
        if(this.fade>=1){ this.cur=this.nxt; this.t=this.nt; this.nxt=null; }
      } else {
        const cc=LOT_CLIPS[this.cur];
        if(cc&&!cc.loop&&!cc.clamp&&this.t>=cc.dur) this.play("idle",0.35);
      }
      for(const bn in this.bones) this.bones[bn].rotation.set(0,0,0);
      for(const bn in mix){ const b=this.bones[bn]; if(b) b.rotation.set(mix[bn][0],mix[bn][1],mix[bn][2]); }
    }
  };
}

//  CHARACTER MODELS: procedural stylized low-poly meshes (authored in code, no external assets)
//  Each character is one skinned body mesh (legs, pelvis, torso, neck, sleeves, hands with fingers,
//  shoes) bound to the existing bone rig, so every clip, breathing and head-turn hook still drives it.
//  The head is one sculpted mesh (brow ridge, eye sockets, nose, cheekbones, mouth, jaw, chin) with
//  the face painted into its own UV map, so there is no separate face card and no edge.
//  Clothing is painted with vertex colours.

let BLOB = null;

// --- mesh builder: tubes through rings, each ring carrying bone weights, merged into one geometry ---
// average each vertex normal with its mesh neighbours: removes the faceted light patches that the
// sparse tube rings produce under toon shading, without adding geometry
function smoothNormals(g, passes){
  const n = g.attributes.normal, ix = g.index.array, cnt = n.count;

    const yaw = Math.atan2(nx, nz), pitch = Math.asin(Math.max(-1,Math.min(1,ny))), th = Math.acos(Math.max(-1,Math.min(1,ny)));

    d += .009 * Math.exp(-(((pitch-.17)/.06)**2)) * Math.exp(-((yaw/.42)**4));           // brow ridge
    d -= .011 * (G(yaw,pitch,.27,-.035,.11,.08) + G(yaw,pitch,-.27,-.035,.11,.08));   // eye sockets
    d += .005 * (G(yaw,pitch,.27,-.045,.06,.045) + G(yaw,pitch,-.27,-.045,.06,.045)); // eyeballs under the lids

    d -= .004 * (G(yaw,pitch,.42,-.46,.12,.1) + G(yaw,pitch,-.42,-.46,.12,.1));       // cheek hollows

    d += .003 * G(yaw,pitch,0,-.49,.11,.03);                                          // lower lip

    if (ny < 0){ const k = Math.pow(-ny, 1.5); x *= 1 - .34*k; z *= 1 - .1*k; }          // jaw taper toward a V

  // light/shadow line is one clean curve instead of breaking up over the nose and cheek bumps
  // shade with the normal of the ellipsoid through each final vertex: the silhouette keeps the sculpted
  // nose, brow and jaw, while the light falls in one clean soft shape (any share of the sculpted
  // normals brought back a bright strip down the nose under the toon steps)

    nr.setXYZ(i, v.x, v.y, v.z);
  }

}

  };

// --- art direction: one palette and lighting rig shared by every set ---
// sky: [top, horizon] painted backdrop; amb: scale on the set's own ambient light;
// key / fill / rim: [color, intensity]. Cool key, warm fill, cool rim, sodium-amber practicals.
const PAL = {
  void:     {sky:["#04050A","#0E1424"], amb:.6,  key:["#B8C8E0",.55], fill:["#E0A070",.22], rim:["#6FBFCF",.55]},
  apartment:{sky:["#080B14","#171D2C"], amb:.55, key:["#C4D0E4",.62], fill:["#E6A866",.30], rim:["#86B4D6",.55]},
  street:   {sky:["#05070F","#232A40"], amb:.5,  key:["#B4C4DE",.6],  fill:["#E6A452",.32], rim:["#94BCE4",.6]},
  office:   {sky:["#080C12","#1C2430"], amb:.5,  key:["#D0DCE8",.62], fill:["#E6AC6C",.26], rim:["#6FBFCF",.5]},
  cafe:     {sky:["#0E0A06","#2A2014"], amb:.55, key:["#F0CC96",.5],  fill:["#E09A4C",.26], rim:["#80A8CC",.55]},
  diner:    {sky:["#0B0805","#2A1F12"], amb:.55, key:["#ECC690",.5],  fill:["#DC8E44",.26], rim:["#809FD2",.6]},
  dream:    {sky:["#05060E","#141A30"], amb:.6,  key:["#AECCEA",.5],  fill:["#CC9C7C",.22], rim:["#6FBFCF",.65]},
  tunnels:  {sky:["#080603","#21180C"], amb:.6,  key:["#ECBC74",.42], fill:["#CC8C4C",.22], rim:["#7494B4",.55]},
  stairwell:{sky:["#070805","#1B1E12"], amb:.7,  key:["#D4DCB4",.42], fill:["#CCA474",.2],  rim:["#8498A4",.5]},
  conf:     {sky:["#060A10","#18222C"], amb:.5,  key:["#CCDEEA",.6],  fill:["#E6AC6C",.24], rim:["#6FBFCF",.55]},
  lab:      {sky:["#050A0E","#13212A"], amb:.5,  key:["#BCE2EE",.56], fill:["#DCA474",.24], rim:["#6FBFCF",.62]}
};
function skyTex(top, hor){ return canvasTex(16,256,(c,w,h)=>{
  const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,top); g.addColorStop(.62,hor); g.addColorStop(1,top);
  c.fillStyle=g; c.fillRect(0,0,w,h); }); }
let GRIME = null;
function grimeTex(){ if (GRIME) return GRIME;
  GRIME = canvasTex(256,256,(c,w,h)=>{
    c.fillStyle="#fff"; c.fillRect(0,0,w,h);
    for(let i=0;i<900;i++){ const x=R(i)*w, y=R(i*3+1)*h, r=2+R(i*7)*18;           // soft blotches
      c.fillStyle="rgba(40,36,30,"+(0.025+R(i*11)*0.05)+")"; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); }
    for(let i=0;i<60;i++){ const x=R(i*13)*w, len=30+R(i*17)*140;                    // water streaks
      c.fillStyle="rgba(30,28,24,"+(0.03+R(i*19)*0.05)+")"; c.fillRect(x,R(i*23)*h*.4,1+R(i*29)*3,len); }
    const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(0,0,0,.22)");
    c.fillStyle=g; c.fillRect(0,0,w,h);
  });
  GRIME.wrapS = GRIME.wrapT = THREE.RepeatWrapping; return GRIME; }
function artDirect(name, w){
  const P = PAL[name] || PAL.void, sc = w.scene;
  sc.background = skyTex(P.sky[0], P.sky[1]);
  if (sc.fog) sc.fog.color.set(P.sky[1]);
  sc.traverse(o=>{
    if (o.isAmbientLight) o.intensity *= P.amb * .5;   // low ambient: the rig below does the modelling
    if (o.isMesh && o.material && o.material.isMeshStandardMaterial && !o.material.map){
      const gp = o.geometry.parameters || {};
      const big = Math.max(gp.width||0, gp.height||0, gp.depth||0) > 1.4 || (gp.radiusTop||0) > 1;
      if (big && !o.material.userData.grimed){ o.material.userData.grimed = true;
        o.material.map = grimeTex(); o.material.color.multiplyScalar(1.15); o.material.needsUpdate = true; }
      if (o.geometry.type === "PlaneGeometry" || o.geometry.type === "BoxGeometry") o.receiveShadow = true;
    }
  });
  const C = w.anchors.C;
  const key = new THREE.DirectionalLight(P.key[0], P.key[1] * 1.7);
  key.position.set(C.x+4.2, 4.4, C.z+2.0); key.target.position.set(C.x, .9, C.z);
  key.castShadow = true; setShadowRes(key);
  const sc2 = key.shadow.camera; sc2.left=-4.5; sc2.right=4.5; sc2.top=4; sc2.bottom=-2; sc2.near=.5; sc2.far=14;
  key.shadow.bias = -0.0008; key.shadow.normalBias = 0.045;   // no acne on the cel bands
  const fill = new THREE.DirectionalLight(P.fill[0], P.fill[1] * 1.2);
  fill.position.set(C.x-3.2, 1.8, C.z+2.6); fill.target.position.set(C.x, 1.2, C.z);
  const rim = new THREE.DirectionalLight(P.rim[0], P.rim[1] * 1.2);
  rim.position.set(C.x-1.2, 3.6, C.z-4.5); rim.target.position.set(C.x, 1.3, C.z);
  sc.add(key, key.target, fill, fill.target, rim, rim.target);
  toonify(sc);
  w.key = key;
  return w;
}
function setWorld(bg){
  bg = BUILDERS[bg] ? bg : "void";
  if (curBg === bg && world) return;
  // location change is a hard cut: nobody walks between sets
  Object.keys(castMap).forEach(removeRec);
  curBg = bg;
  world = WORLDS[bg] || (WORLDS[bg] = artDirect(bg, BUILDERS[bg]()));
  renderPassP.scene = world.scene; bokehPass.scene = world.scene;
  camera.position.copy(world.cam.pos); camLook.copy(world.cam.look);
  snapCam = true;
  const veil = $("fadeveil");
  veil.style.transition = "none"; veil.style.opacity = "1";
  void veil.offsetWidth;
  veil.style.transition = "opacity .9s ease"; veil.style.opacity = "0";
}

// keep roughly the horizontal framing of the 16:9 design when the screen is taller than it is wide
function portraitFov(fov){
  const a = camera.aspect || 1.6;
  if (a >= 1.2) return fov;
  const widen = Math.min(GFX_PORTRAIT_FOV_CAP, 1.2 / a);
  return 2 * Math.atan(Math.tan(fov * Math.PI / 360) * widen) * 180 / Math.PI;
}
let lastFrameMs = 0;
function renderLoop(nowMs){
  requestAnimationFrame(renderLoop);
  if (!world) return;
  const dt = lastFrameMs ? Math.min(0.1, (nowMs-lastFrameMs)/1000) : 0.016;
  lastFrameMs = nowMs;
  const t = RM ? 0 : nowMs/1000;
  if (world.update) world.update(t);
  updateCast3d(t, dt);
  updateShoulder(t, dt);
  // director camera: hard cut on shot change, slow push-in within a shot
  curShot.time += dt;
  const sg = shotGoal();
  _goalPos.copy(sg.pos); _goalLook.copy(sg.look);
  const drift = Math.min(curShot.time*0.05, 0.3);
  const fwd = _goalLook.clone().sub(_goalPos).normalize();
  _goalPos.addScaledVector(fwd, drift);
  goalFov = sg.fov;
  if (!RM){ _goalPos.x += Math.sin(t*.3)*.06; _goalPos.y += Math.sin(t*.23)*.03; }
  if (nowMs < glitchUntil){ _goalPos.x += (Math.random()-.5)*.12; _goalPos.y += (Math.random()-.5)*.08; }
  const k = snapCam ? 1 : 1 - Math.pow(0.955, dt*60);
  camera.position.lerp(_goalPos, k); camLook.lerp(_goalLook, k);
  const fovT = portraitFov(goalFov);
  if (snapCam) camera.fov = fovT; else camera.fov += (fovT - camera.fov) * k;
  camera.updateProjectionMatrix();
  snapCam = false;
  camera.lookAt(camLook);
  // rack focus to the current subject; open the aperture during close-ups
  bokehPass.uniforms["focus"].value = camera.position.distanceTo(camLook);
  const apGoal = curShot.name === "cu" ? 0.00022 : curShot.name === "osh" ? 0.00016 : 0.00008;
  bokehPass.uniforms["aperture"].value += (apGoal - bokehPass.uniforms["aperture"].value) * 0.06;
  gradePass.uniforms.uTime.value = RM ? 0 : nowMs/1000;
  composer.render();
}

function updateCast3d(t, dt){
  const now = performance.now();
  const fMove = 1 - Math.pow(0.94, (dt||0.016)*60);
  const fFade = 1 - Math.pow(0.93, (dt||0.016)*60);
  Object.keys(castMap).forEach(id=>{
    const rec = castMap[id], ch = rec.ch, g = ch.group;
    const a = (world && world.anchors[rec.pos]) || V3(0,0,.6);
    if (rec.snap){ g.position.set(a.x, 0, a.z); rec.alpha = 1; rec.snap = false; }
    const tx = rec.exiting ? a.x + (rec.pos==="L" ? -2.2 : 2.2) : a.x;
    g.position.x += (tx - g.position.x) * fMove;
    g.position.z += (a.z - g.position.z) * fMove;
    rec.alpha += ((rec.exiting ? 0 : 1) - rec.alpha) * fFade;
    ch.setAlpha(!rec.exiting && rec.alpha > .97 ? 1 : rec.alpha);
    if (rec.exiting && rec.alpha < 0.03){ removeRec(id); return; }
    g.rotation.y = Math.atan2(camera.position.x - g.position.x, camera.position.z - g.position.z);
    const ph = id.charCodeAt(0);
    g.position.y = Math.sin(t*1.1 + ph) * 0.012;
    // keyframe layer: current clip pose with crossfade
    ch.anim.update(dt);
    // procedural life layer, always on
    ch.bones.chest.rotation.x += Math.sin(t*1.8+ph)*0.022 + 0.012;   // breathing
    ch.bones.spine.rotation.x += Math.sin(t*1.8+ph)*0.010;
    let faceDirty = false;
    if (ch.blinkT >= 0){                                             // blink in progress
      ch.blinkT += dt; faceDirty = true;
      if (ch.blinkT > 0.13){ ch.blinkT = -1; ch.blinkNext = 2 + Math.random()*4; }
    } else {
      ch.blinkNext -= dt;
      if (ch.blinkNext <= 0){ ch.blinkT = 0; faceDirty = true; }
    }
    ch.sacT -= dt;                                                   // eye saccades
    if (ch.sacT <= 0){
      ch.sacT = 0.7 + Math.random()*1.8;
      ch.sacX = (Math.random()*2-1)*3.2; ch.sacY = (Math.random()*2-1)*1.5;
      faceDirty = true;
    }
    // damped head look-at toward the active speaker (or the camera)
    let wy = 0, wp = 0, w = 0;
    const tp = ch.lookTarget ? ch.lookTarget() : null;
    if (tp){
      const dx = tp.x - g.position.x, dz = tp.z - g.position.z;
      let ny = Math.atan2(dx, dz) - g.rotation.y;
      while (ny > Math.PI) ny -= Math.PI*2; while (ny < -Math.PI) ny += Math.PI*2;
      wy = Math.max(-0.6, Math.min(0.6, ny));
      wp = Math.max(-0.3, Math.min(0.25, -Math.atan2((tp.y||1.5)-1.5, Math.hypot(dx,dz))));
      w = 1;
    }
    ch.lookW += (w - ch.lookW) * Math.min(1, dt*3);
    ch.lookYaw += (wy - ch.lookYaw) * Math.min(1, dt*4.5);
    ch.lookPitch += (wp - ch.lookPitch) * Math.min(1, dt*4.5);
    ch.bones.head.rotation.y += ch.lookYaw * ch.lookW;
    ch.bones.head.rotation.x += ch.lookPitch * ch.lookW;
    ch.bones.neck.rotation.y += ch.lookYaw * ch.lookW * 0.35;
    // lip flap while a line is active, duration from text length
    const talking = rec.talkUntil && now < rec.talkUntil && !rec.exiting;
    if (talking){
      const open = Math.floor(now/135) % 3 !== 0 && Math.sin(now/70+ph) > -0.6;
      if (open !== ch._open){ ch._open = open; faceDirty = true; }
    } else if (ch._open){ ch._open = false; faceDirty = true; }
    if (faceDirty) ch.refreshFace();
  });
}

  if (o.silent || timedOut) return {mood:"concern", clip:null};
  if (f.defiance) return {mood:"surprised", clip:"surprised"};
  if (f.compliance >= 2) return {mood:"smirk", clip:"nod"};
  return null;
}
function applyDirection(nodeId, pageIdx, spk){
  let d = DIR[nodeId];
  if (Array.isArray(d)) d = d[Math.min(pageIdx, d.length-1)];
  const spkA = speakerActor(spk);
  const n = STORY[nodeId], text = n && n.text ? String(n.text[pageIdx]||"") : "";
  const newLoc = lastDirBg !== curBg; lastDirBg = curBg;
  sceneLine = newLoc ? 0 : sceneLine + 1;
  const tone = spkA ? lineTone(text) : narrTone(text);
  let shot = d && d.shot, actor = (d && d.actor) || null;
  if (!shot){
    const pages = n && n.text ? n.text.length : 1;
    if (newLoc) shot = "wide";                                              // establishing shot on arrival
    else if (CLOSEUPS[nodeId]) shot = (pages > 1 && pageIdx === 0) ? "osh" : "cu";
    else if (spkA){
      if (tone === "angry" || tone === "surprised" || tone === "afraid") shot = "cu";
      else shot = (castOrder.length > 1 ? ["osh","two","cu","osh"] : ["osh","cu","two"])[sceneLine % (castOrder.length > 1 ? 4 : 3)];
    } else if (castOrder.length) shot = tone ? "cu" : (sceneLine % 2 ? "two" : "wide");
    else shot = "wide";
  }
  if (!actor) actor = spkA || castOrder[0] || null;
  setShot(shot, actor);
  // faces: explicit direction first, then the line's own tone, then the reaction to your last choice
  const who = spkA || (tone ? castOrder[0] : null);
  if (d && d.emotion && spkA && castMap[spkA]) castMap[spkA].ch.setMood(d.emotion);
  else if (tone && who && castMap[who]) castMap[who].ch.setMood(tone);
  if (pageIdx === 0 && pendingReact && castOrder[0] && castMap[castOrder[0]]){
    const r = pendingReact, rec = castMap[castOrder[0]];
    if (!(d && d.emotion) && !tone) rec.ch.setMood(r.mood);
    if (r.clip && !(d && d.clip) && rec.id !== spkA) setTimeout(()=>{ if (castMap[rec.id] === rec) rec.ch.anim.play(r.clip, .25); }, 250);
    else if (r.clip && !(d && d.clip) && rec.id === spkA) d = Object.assign({}, d||{}, {clip:r.clip});
  }
  pendingReact = null;
  if (tone && !(d && d.clip) && spkA && TONE_CLIP[tone]) d = Object.assign({}, d||{}, {clip:TONE_CLIP[tone]});
  return d;
}

function highlightCast(spk){
  const s = (spk||"").toLowerCase();
  let any = false;
  Object.values(castMap).forEach(rec=>{
    const keys = NAME_KEYS[rec.id] || [];
    if (s && keys.some(k=>s.includes(k))) any = true;
  });
  Object.values(castMap).forEach(rec=>{
    const keys = NAME_KEYS[rec.id] || [];
    const match = s && keys.some(k=>s.includes(k));
    rec.ch.setDim(any && !match && rec.id !== curShot.actor && !rec.exiting);
  });
}

// ---------- renderer ----------
function go(id){
  clearTimer();
  const n = STORY[id];
  if (!n){ console.error("missing node", id); return; }
  cur = id; page = 0;
  $("scene").classList.toggle("panel", !(n.card || n.stats || n.ending) && id !== "title");
  const em = /^e([1-5])card$/.exec(id); if (em) snapEpisode(+em[1]);
  if (id === "co1") S.curEp = 0;
  if (n.card)   { renderCard(n); save(); return; }
  if (n.stats)  { renderStats(n); save(); return; }
  if (n.ending) { renderEnding(n); save(); return; }
  overlay.innerHTML = "";
  stage.className = "bg-" + (n.bg || "void") + " cine";
  $("hudEp").textContent = n.ep || "";
  setWorld(n.bg || "void");
  AU.ambient(curBg);
  renderCast(id);
  $("hotzone").innerHTML = "";
  stage.classList.toggle("alarm", !!n.alarm);
  updateAtt();
  if (n.namecard && !S.flags["nc_"+id]){ S.flags["nc_"+id] = true; showNamecard(n.namecard); }
  exploreDone = new Set(); exploreExitShown = false;
  if (n.enter) n.enter(S);
  if (n.anom) anomaly(n.anom);
  if (n.glitch){ stage.classList.add("glitching"); glitchUntil = performance.now()+1500;
    setTimeout(()=>stage.classList.remove("glitching"), 1600); }
  renderPage();
  save();
}
function renderPage(){
  const n = STORY[cur];
  const spk = (typeof n.speaker === "function") ? n.speaker(S, page) : (Array.isArray(n.speaker) ? n.speaker[page] : n.speaker);
  speakerEl.textContent = spk ? spk.toUpperCase() : "";
  speakerEl.className = spk ? (spk.toLowerCase().includes("vera") ? "vera" :
                         spk.toLowerCase().includes("sarah") ? "sarah" :
                         spk.toLowerCase().includes("engine")||spk.toLowerCase().includes("system") ? "system" : "named") : "narr";
  highlightCast(spk);
  stage.classList.remove("choosing");
  $("scene").classList.toggle("narr", !spk);
  const chunk = n.text[page];
  const plain = chunk.replace(/<[^>]+>/g,"");
  histPush({spk: spk || "", txt: plain});
  const d = applyDirection(cur, page, spk);
  setTalking(spk, plain, d && d.clip);
  choicesEl.innerHTML = "";
  timerWrap.style.display = "none";
  $("qte").style.display = "none";
  $("sqte").style.display = "none";
  $("hotzone").innerHTML = "";
  moreEl.style.display = "none";
  const last = page >= n.text.length - 1;
  beginType(chunk, plain, ()=>{
    if (!last){ moreEl.style.display = "block"; return; }
    if (n.qte){ runQTE(n); return; }
    if (n.sqte){ runSeq(n); return; }
    if (n.hold){ runHold(n); return; }
    if (n.explore){ renderExplore(n); return; }
    if (n.choices){ renderChoices(n); }
    else if (n.next){ moreEl.style.display = "block"; }
  });
}
// ---------- typewriter: tap to complete the line, tap again to advance ----------
let typeState = null;
function clearType(){ if (typeState && typeState.timer) clearInterval(typeState.timer); typeState = null; }
function beginType(full, plain, onDone){
  clearType();
  const paras = plain.split("\n");
  const total = plain.length;
  const esc = s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const st = { done:false, shown:0, timer:null };
  st.finish = ()=>{
    if (st.done) return;
    st.done = true;
    if (st.timer) clearInterval(st.timer);
    textEl.innerHTML = full.split("\n").map(p=>"<p>"+p+"</p>").join("");
    onDone && onDone();
  };
  typeState = st;
  const SPEED = {slow:1, normal:2, fast:4}[SET.textSpeed];
  if (RM || total < 4 || SET.textSpeed === "instant" || !SPEED){ st.finish(); return; }
  const renderPartial = ()=>{
    let left = st.shown, html = "";
    for (const p of paras){
      if (left <= 0) break;
      html += "<p>"+esc(p.slice(0, left))+"</p>";
      left -= p.length + 1;
    }
    textEl.innerHTML = html || "<p></p>";
  };
  renderPartial();
  st.timer = setInterval(()=>{
    st.shown = Math.min(total, st.shown + SPEED);
    renderPartial();
    if (st.shown >= total) st.finish();
  }, 24);
}
function nx(v){ return typeof v === "function" ? v(S) : v; }
function advance(){
  const n = STORY[cur];
  if (!n || n.card || n.stats || n.ending || holdActive) return;
  if (typeState && !typeState.done){ typeState.finish(); return; }
  if (page < n.text.length - 1){ page++; renderPage(); }
  else if (!n.choices && !n.qte && !n.hold && !n.explore && n.next){ go(nx(n.next)); }
}
// ---------- explore mode: walkable scenes with examine spots ----------
let exploreDone = new Set(), exploreExitShown = false;
function renderExplore(n){
  const e = n.explore, hz = $("hotzone");
  e.spots.forEach((sp, i)=>{
    if (exploreDone.has(i)) return;
    const m = document.createElement("button");

    m.innerHTML = '<span class="ring"></span><span class="hlabel">'+sp.label+'</span>';

      ev.stopPropagation();

}
function maybeExploreExit(n){

  const b = document.createElement("button");

// ---------- hold-still QTE: any input is failure ----------
let holdActive = false;
function runHold(n){
  const box = $("holdp");
  box.style.display = "block";
  holdActive = true;
  let settled = false, beatId = null;
  const beat = ()=>{ AU.blip(72, 60, 0.18, "sine", 0.1); };
  beat(); beatId = setInterval(beat, 750);
  function finish(moved){
    if (settled) return; settled = true;
    holdActive = false; clearInterval(beatId);
    document.removeEventListener("keydown", onIn, true);
    document.removeEventListener("pointerdown", onIn, true);
    box.style.display = "none";
    if (moved){ S.flags.moved = true; att(n.hold.att || 8); AU.sfx("miss");
      go(nx(n.hold.failNext || n.hold.next)); }
    else { AU.sfx("hit"); go(nx(n.hold.next)); }
  }
  function onIn(ev){ ev.stopPropagation(); ev.preventDefault(); finish(true); }
  setTimeout(()=>{
    document.addEventListener("keydown", onIn, true);
    document.addEventListener("pointerdown", onIn, true);
  }, 250); // grace so the click that advanced the page doesn't count
  setTimeout(()=>finish(false), n.hold.dur || 4500);
}
function renderChoices(n){
  const opts = (typeof n.choices === "function") ? n.choices(S) : n.choices;
  let btnIdx = 0;
  opts.forEach((o)=>{
    // investigation hotspots: options tied to a location render as markers in the scene
    if (n.hot && o.fx && o.fx.flag && HOTPOS[o.fx.flag]){
      const p = HOTPOS[o.fx.flag];
      const m = document.createElement("button");
      m.className = "hot"; m.style.left = p.x+"%"; m.style.top = p.y+"%";
      m.innerHTML = '<span class="ring"></span><span class="hlabel">'+p.label+'</span>';
      m.onclick = (ev)=>{ ev.stopPropagation(); pick(o, n); };
      $("hotzone").appendChild(m);
      return;
    }
    const b = document.createElement("button");
    b.className = "choice" + (o.silent ? " silent" : "");
    b.innerHTML = "<kbd>" + (++btnIdx) + "</kbd>" + choiceLabel(o);
    b.onclick = ()=>pick(o, n, false, b);
    choicesEl.appendChild(b);
  });
  if (choicesEl.children.length) stage.classList.add("choosing");
  if (n.timer && SET.timer !== "off"){
    timerWrap.style.display = "block";
    const secs = n.timer * (SET.timer === "relaxed" ? 2 : 1);
    const total = secs * 1000;
    let elapsed = 0, tPrev = performance.now();
    timerBar.style.width = "100%";
    let lastSec = secs;
    timerId = setInterval(()=>{
      const tNow = performance.now(); if (!PAUSED) elapsed += tNow - tPrev; tPrev = tNow;
      const left = Math.max(0, 1 - elapsed/total);
      timerBar.style.width = (left*100) + "%";
      timerBar.classList.toggle("low", left < .3);
      const sec = Math.ceil(left*secs);
      if (sec !== lastSec){ lastSec = sec; if (sec <= 5 && sec > 0) AU.sfx("tick"); }
      if (left <= 0){
        clearTimer();
        const silent = opts.find(o=>o.silent) || opts[opts.length-1];
        pick(silent, n, true);
      }
    }, 90);
  }
}
// Telltale shows "say nothing" as an ellipsis; the original line stays underneath as a hint
const SILENCE_RE = /^\[(Silence\.|Say nothing|Some admissions deserve silence|Let him talk to the wind)/;
function choiceLabel(o){
  const t = String(o.t);
  if (o.silent && SILENCE_RE.test(t)){
    const plain = /^\[(Silence\.|Say nothing at all\.)\]$/.test(t);
    return '<span class="dots" aria-label="Say nothing">...</span>' + (plain ? '' : '<small>' + t + '</small>');
  }
  return t;
}
// relationship feedback, derived only from what the choice already changes
function rememberFor(o){
  if (o.remember) return [o.remember];
  const f = o.fx || {}, out = [];
  if (f.trust && S.flags.met_sarah) out.push("sarah");
  if (f.vera && S.flags.met_vera) out.push("vera");
  if (f.flag === "davidExposed" || f.flag === "chenTaken" || f.flag === "reportedSarah") out.push("system");
  return out;
}
let picking = false;
function pick(o, n, timedOut, btn){
  if (picking) return;
  if (btn && !timedOut && !RM){
    // a short beat on the selected option before the scene answers, like the Telltale choice flash
    picking = true; clearTimer();
    btn.classList.add("picked"); choicesEl.classList.add("locked");
    setTimeout(()=>{ picking = false; choicesEl.classList.remove("locked"); commitPick(o, n, false); }, 380);
    return;
  }
  commitPick(o, n, timedOut);
}
function commitPick(o, n, timedOut){
  clearTimer();
  histPush({pick: timedOut ? "(You stayed silent.)" : String(o.t).replace(/<[^>]+>/g,"")});
  AU.sfx("click");
  if (o.silent || timedOut){ S.silence++; }
  pendingReact = reactionFor(o, timedOut);
  if (o.fx) fx(o.fx);
  if (o.anom) anomaly(o.anom);
  rememberFor(o).forEach((w, i)=>setTimeout(()=>remember(w), 250 + i*500));
  if (o.log) logChoice(o.log[0], o.log[1], o.t);
  if (o.after){ o.after(S); }
  go(nx(o.next));
}
function clearTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } timerWrap.style.display="none"; }

// ---------- QTE ----------
function runQTE(n){
  const q = $("qte"); q.style.display = "block";
  q.querySelector(".prompt").textContent = n.qte.prompt || "PRESS ANY KEY / TAP RAPIDLY";
  let power = 0; const fill = $("qteFill");
  const bump = ()=>{ power = Math.min(100, power + 9); fill.style.width = power + "%"; };
  window.__qteBump = bump;
  document.addEventListener("keydown", bump);
  stage.addEventListener("pointerdown", bump);
  const t0 = performance.now();
  qteId = setInterval(()=>{
    power = Math.max(0, power - 1.6); fill.style.width = power + "%";
    const elapsed = performance.now() - t0;
    if (power >= 100 || elapsed > 9000){
      clearInterval(qteId); qteId = null;
      document.removeEventListener("keydown", bump);
      stage.removeEventListener("pointerdown", bump);
      const success = power >= 100;
      S.flags.qteWin = success;
      go(nx(success ? n.qte.win : (n.qte.lose || n.qte.win)));
    }
  }, 120);
}

// ---------- sequence QTE (the run) ----------
function runSeq(n){
  const box = $("sqte"), keyEl = box.querySelector(".key"), subEl = box.querySelector(".sub");
  box.style.display = "block";
  const ALLKEYS = [["ArrowLeft","◀"],["ArrowUp","▲"],["ArrowRight","▶"],["ArrowUp","▲"],["ArrowLeft","◀"]];
  const KEYS = ALLKEYS.slice(0, n.sqte.keys || 5);
  let step = 0, hits = 0, windowT = null, answered = false;
  function onEvt(e){
    if (answered || step >= KEYS.length) return;
    if (e.type === "keydown" && !e.key.startsWith("Arrow")) return;
    const ok = (e.type === "pointerdown") || e.key === KEYS[step][0];
    answered = true; clearTimeout(windowT);
    keyEl.className = "key " + (ok ? "hit" : "miss");
    AU.sfx(ok ? "hit" : "miss");
    if (ok) hits++;
    step++; setTimeout(nextStep, 320);
  }
  function cleanup(){
    document.removeEventListener("keydown", onEvt);
    stage.removeEventListener("pointerdown", onEvt);
    clearTimeout(windowT);
  }
  function nextStep(){
    if (step >= KEYS.length){
      cleanup(); S.flags.runHits = hits;
      keyEl.textContent = "";
      const need = n.sqte.pass || Math.max(1, KEYS.length - 1);
      const ok = hits >= need;
      subEl.textContent = n.sqte.passText && ok ? n.sqte.passText :
        n.sqte.failText && !ok ? n.sqte.failText :
        ok ? "CLEAR" : "TOO SLOW";
      setTimeout(()=>go(nx(ok ? n.sqte.next : (n.sqte.failNext || n.sqte.next))), 1100);
      return;
    }
    keyEl.textContent = KEYS[step][1]; keyEl.className = "key";
    subEl.textContent = "RUN: PRESS THE ARROW / TAP  ·  " + (step+1) + " OF " + KEYS.length;
    answered = false;
    windowT = setTimeout(()=>{
      if (answered) return;
      answered = true; keyEl.className = "key miss"; AU.sfx("miss");
      step++; setTimeout(nextStep, 320);
    }, 1500);
  }
  document.addEventListener("keydown", onEvt);
  stage.addEventListener("pointerdown", onEvt);
  nextStep();
}

// ---------- episode intro: Telltale disclaimer, then "Previously on" built from your own choices ----------
const EP_WORDS = ["","One","Two","Three","Four","Five"];
let introToken = 0;
function episodeIntro(ep, done){
  const tok = ++introToken, here = cur;
  const alive = ()=> tok === introToken && cur === here;
  const steps = [];
  if (!(ep === 1 && S.flags.discShown)) steps.push(disclaimerStep);
  const rec = S.log.filter(l=>l.ep >= 1 && l.ep < ep).slice(-4);
  if (rec.length) steps.push(cb=>recapStep(rec, cb, alive));
  let i = 0;
  const next = ()=>{ if (!alive()) return; if (i < steps.length) steps[i++](next, alive); else done(); };
  next();
}
function disclaimerStep(cb, alive){

}
function recapStep(entries, cb, alive){
  overlay.innerHTML = "";

  let i = 0, gone = false, tm = null;

    castClear(); if (alive()) cb(); };
  box.querySelector(".mbtn").onclick = end;
  const slide = ()=>{
    if (gone || !alive()) return;
    if (i >= entries.length){ end(); return; }
    const e = entries[i++], node = e.node && STORY[e.node];
    if (node && node.bg){

//  MENU: resume, settings, history, how to play, episodes, restart, links
// ============================================================
const BOOK_URL = "https://www.amazon.com/dp/B0H2WK88X3";
const AUTHOR_URL = "https://matthew-culwell-author-page.vercel.app";
const BOOKLINKS = '<div class="booklinks"><a href="'+BOOK_URL+'" target="_blank" rel="noopener">Read the novel on Amazon</a>'+
  '<a class="quiet" href="'+AUTHOR_URL+'" target="_blank" rel="noopener">More from Matthew Culwell</a></div>';
const EP_NAMES = {1:"Surface Tension", 2:"The Weight of Watchers", 3:"Breadcrumbs and Broken Code", 4:"The Freedom Paradox", 5:"The Last Layer"};
let menuAfter = null, menuReturnFocus = null;
function menuOpen(){ return $("menuLayer").classList.contains("open"); }
function openMenu(view, after){
  if (!menuOpen()) menuReturnFocus = document.activeElement;
  if (after !== undefined) menuAfter = after;
  PAUSED = true;
  $("menuLayer").classList.add("open");
  renderMenu(view || "main");
}
function closeMenu(){
  $("menuLayer").classList.remove("open");
  PAUSED = false;
  const f = menuAfter; menuAfter = null;
  const rf = menuReturnFocus; menuReturnFocus = null;
  if (f) f();
  else if (rf && rf.focus && !rf.closest("#topCtl") && document.contains(rf)) try{ rf.focus(); }catch(e){}
  else if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function segRow(label, key, opts){
  return '<div class="setrow"><div class="lbl">'+label+'</div><div class="seg" data-key="'+key+'">'+
    opts.map(o=>'<button type="button" data-val="'+o[0]+'" aria-pressed="'+(String(SET[key])===String(o[0]))+'">'+o[1]+'</button>').join("")+'</div></div>';
}
function inStory(){ const n = STORY[cur]; return !!(n && cur !== "title" && !n.ending); }
function renderMenu(view){
  const p = $("menuPanel"); let h = "";
  const back = '<button class="mbtn" data-m="'+(inStory() ? "main" : "__close")+'">Back</button>';
  if (view === "main"){
    const snaps = loadEpSnaps(), ep = S.curEp;
    h = '<h2>Paused</h2>'+
      '<button class="mbtn" data-m="__close">Resume</button>'+
      '<button class="mbtn" data-m="settings">Settings</button>'+
      '<button class="mbtn" data-m="history">History</button>'+
      '<button class="mbtn" data-m="help">How to Play</button>'+
      (inStory() && ep && snaps[ep] ? '<button class="mbtn" data-m="__restartEp">Restart Episode '+ep+'</button>' : '')+
      '<button class="mbtn" data-m="episodes">Episodes</button>'+
      '<button class="mbtn" data-m="__title">Quit to Title (progress is saved)</button>'+ BOOKLINKS;
  } else if (view === "settings"){
    h = '<h2>Settings</h2>'+
      segRow("Text speed", "textSpeed", [["slow","Slow"],["normal","Normal"],["fast","Fast"],["instant","Instant"]])+
      segRow("Timed choices", "timer", [["normal","Normal"],["relaxed","Relaxed (2x time)"],["off","Off (no timer)"]])+
      segRow("Sound", "sound", [[true,"On"],[false,"Off"]])+
      segRow("Graphics", "gfx", [["auto","Auto"],["high","High"],["light","Light (phones)"]])+
      '<p class="muted">Turning the timer off lets you take as long as you like. Silence is still always an option.</p>'+ back;
  } else if (view === "history"){
    const items = HIST.slice(-40).map(x=> x.pick ? '<div class="h-pick">&rsaquo; '+x.pick+'</div>' :
      '<div>'+(x.spk ? '<div class="h-spk">'+x.spk+'</div>' : '')+'<div class="h-txt">'+x.txt.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</div></div>').join("");
    h = '<h2>History</h2><div class="hist">'+(items || '<p class="muted">Nothing yet.</p>')+'</div>'+ back;
  } else if (view === "help"){
    h = '<h2>How to Play</h2><ul>'+
      '<li><b>Advance:</b> click or tap anywhere, or press <kbd>Space</kbd> / <kbd>Enter</kbd>. The first press finishes the line, the next one continues.</li>'+
      '<li><b>Choose:</b> click a choice or press <kbd>1</kbd> to <kbd>4</kbd>. When the bar above the choices drains, the choice is timed. If time runs out, Marcus stays silent. <b>...</b> means saying nothing. Silence is a choice and it counts.</li>'+
      '<li><b>Remember:</b> when a choice changes how someone sees you, a note appears in the top left. At the end of each episode you can review the choices you made.</li>'+
      '<li><b>Explore:</b> glowing rings in a scene are things you can examine. Tap them.</li>'+
      '<li><b>Action moments:</b> follow the prompt. Some ask you to tap rapidly, some to press the arrow shown, and some ask you to do nothing at all.</li>'+
      '<li><b>Attention:</b> the meter at the top shows how closely the system is watching you.</li>'+
      '<li><b>Menu:</b> press <kbd>Esc</kbd> or the MENU button to pause, change text speed or the timer, read the history, or restart an episode.</li>'+
      '<li>Progress saves automatically. Use Continue on the title screen to pick up where you left off.</li></ul>'+
      '<button class="mbtn" data-m="__close">'+(menuAfter ? "Begin" : "Got it")+'</button>'+
      (menuAfter ? '' : '<button class="mbtn" data-m="settings">Settings</button>');
  } else if (view === "episodes"){
    const snaps = loadEpSnaps();
    let rows = "";
    for (let e=1; e<=5; e++){
      const ok = !!snaps[e];
      rows += '<button class="mbtn" data-ep="'+e+'"'+(ok ? '' : ' disabled')+'>Episode '+e+': '+EP_NAMES[e]+
        '<small>'+(ok ? 'Play from the start of this episode' : 'Locked. Reach it in a playthrough to unlock')+'</small></button>';
    }
    const seen = loadEndings();
    h = '<h2>Episodes</h2><div class="epi-list">'+rows+'</div>'+
      '<p class="muted" style="margin-top:14px">Starting an episode uses the choices you had made when you first reached it. Endings found: '+seen.length+' of 4.</p>'+ back;
  }
  p.innerHTML = h;
  p.querySelectorAll("[data-m]").forEach(b=>b.onclick = ()=>{
    const m = b.getAttribute("data-m");
    if (m === "__close") closeMenu();
    else if (m === "__title"){ menuAfter = null; closeMenu(); go("title"); }
    else if (m === "__restartEp"){ const sn = loadEpSnaps()[S.curEp]; if (sn){ menuAfter = null; closeMenu(); S = JSON.parse(JSON.stringify(sn)); HIST.length = 0; go("e"+S.curEp+"card"); } }
    else renderMenu(m);
  });
  p.querySelectorAll("[data-ep]").forEach(b=>b.onclick = ()=>{
    const e = +b.getAttribute("data-ep"), sn = loadEpSnaps()[e]; if (!sn) return;
    menuAfter = null; closeMenu(); S = JSON.parse(JSON.stringify(sn)); HIST.length = 0; go("e"+e+"card");
  });
  p.querySelectorAll(".seg").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick = ()=>{
    const k = g.getAttribute("data-key"); let v = b.getAttribute("data-val");
    if (k === "sound"){ v = (v === "true"); if (v !== AU.on) AU.toggle(); }
    SET[k] = v; saveSettings(); if (k === "gfx") applyGfx(); renderMenu(view);
    const nb = $("menuPanel").querySelector('.seg[data-key="'+k+'"] button[data-val="'+String(v)+'"]'); if (nb) nb.focus();
  }));
  const first = p.querySelector("button:not([disabled]), a"); if (first) first.focus();
}
$("menuLayer").addEventListener("click", (e)=>{ if (e.target.id === "menuLayer") closeMenu(); });
// focus trap inside the menu
$("menuLayer").addEventListener("keydown", (e)=>{
  if (e.key !== "Tab") return;
  const f = [...$("menuPanel").querySelectorAll("button:not([disabled]), a")]; if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length-1].focus(); }
  else if (!e.shiftKey && i === f.length-1){ e.preventDefault(); f[0].focus(); }
});
// apply saved sound preference
if (!SET.sound){ AU.on = false; $("audioBtn").textContent = "SOUND: OFF"; }
