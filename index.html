e2card: { card:true, html(){ return '<div class="eyebrow">Episode Two</div><h1>The Weight of Watchers</h1>'+
  '<div class="sub">The violin next door plays the same piece.<br>The same mistakes. Every night.</div>'+
  '<div class="menu"><button class="mbtn" data-go="e2s1">Begin</button></div>'; }},

e2s1: { bg:"apartment", ep:EP[2], speaker:"Mrs. Chen", text:[
  "Marcus woke to his neighbor's violin. The same piece, the same mistakes at the same measures, six mornings in a row — each note placed with mechanical precision in its designated slot.",
  "In the lobby, Mrs. Chen swept tiles that showed no accumulation of dirt, in the same arcs as yesterday. “Good morning, Marcus,” she said without looking up.",
  "“Mrs. Chen — what was here before this building?” Her sweeping stopped for a fraction of a second.\n“There was <em>nothing</em> before this building.”"
], anom:"NOTHING BEFORE THE BUILDING", choices:[
  {t:"“Nothing? No field, no older building? Nothing?”", next:"e2s1b", fx:{defiance:1}},
  {t:"Let it go. She isn't the one you need to push.", next:"e2s2"}
]},
e2s1b: { bg:"apartment", ep:EP[2], speaker:"Mrs. Chen", text:[
  "The broom stopped entirely. Mrs. Chen stood motionless, eyes on the spotless floor.",
  "“Fifteen years,” she said, answering a question he hadn't asked — the answer to <em>how long have you lived here</em>, dispensed to the wrong prompt like a machine one card out of order.",
  "Marcus backed away gently and left her standing there, mid-reset."
], anom:"RESPONSE / PROMPT MISMATCH", next:"e2s2"},

e2s2: { bg:"office", ep:EP[2], speaker:"Sarah", text:[
  "“Marcus.” Sarah appeared beside his desk. Data analysis, two cubicles over. Months of working nearby, and this was the first time she had ever initiated a conversation.",
  "“Do you ever feel like you're forgetting something important? Something that happened recently, but it keeps slipping away when you try to focus on it?”",
  "The question struck him as carefully constructed. Not casual workplace conversation — a probe, designed to measure his response. Or the first honest thing anyone had said to him in three days."
], timer:15, choices:[
  {t:"“Every day. You too?” Open the door.", next:"e2s3", fx:{sarah:2},
   log:[2,"Opened up to Sarah immediately"], remember:"sarah"},
  {t:"“Sometimes.” Give her nothing to measure.", next:"e2s3", fx:{sarah:0, integrity:1},
   log:[2,"Stayed guarded with Sarah"]},
  {t:"“Who's asking — you, or the system?”", next:"e2s2b", fx:{defiance:1, sarah:-1},
   log:[2,"Accused Sarah of being a probe"]},
  {t:"[Say nothing. Let her fill the silence.]", silent:true, next:"e2s2c", fx:{integrity:1},
   log:[2,"Met Sarah's question with silence"]}
]},
e2s2b: { bg:"office", ep:EP[2], speaker:"Sarah", text:[
  "She didn't flinch. She didn't reset, either.",
  "“If I were the system,” she said quietly, “wouldn't I be better at pretending this doesn't hurt?”",
  "It was exactly what a person would say. It was also exactly what a sophisticated system would generate. The two possibilities sat in his chest, refusing to resolve."
], next:"e2s3"},
e2s2c: { bg:"office", ep:EP[2], speaker:"Sarah", text:[
  "He let the silence stretch. She didn't reset. She didn't repeat herself. She just waited with him, inside it — the first thing in this whole city that knew how to share a silence.",
  "“I've been having the strangest dreams,” she said finally. “Underground places. Equipment I've never seen. And in the dreams, I know how to use it.”"
], next:"e2s3"},

e2s3: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "They took a table by the café window. Outside, the same people passed at the same times they had passed yesterday. The performance continued with clockwork precision.",
  "Sarah opened a note app and turned the screen toward him: a list of observations. Impossible architecture. Conversations repeating with mechanical precision. Forty-seven items.",
  "Marcus had catalogued forty-three. The overlap was significant — but not complete."
], choices:[
  {t:"Show her your list. All of it.", next:"e2s3b", fx:{sarah:2, flag:"shared"},
   log:[2,"Shared the full anomaly catalog with Sarah"], remember:"sarah"},
  {t:"“Are you part of the cooperative's monitoring system?” Ask it straight.", next:"e2s3c",
   log:[2,"Asked Sarah point-blank if she was a monitor"], fx:{integrity:1}},
  {t:"Memorize her list. Share nothing of yours.", next:"e2s4", fx:{sarah:-1, defiance:1},
   log:[2,"Kept the catalog hidden from Sarah"]}
]},
e2s3b: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "He talked for twenty minutes. The doors, the sun, David's playback, the thirty-seven-word conversations. Sarah cross-referenced each item against her own list with the focus of a code-breaker.",
  "“Forty of them match,” she said at last. “Either we're both malfunctioning identically…”",
  "“…or the malfunction isn't in us,” Marcus finished."
], next:"e2s4"},
e2s3c: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "She looked genuinely surprised. Then leaned forward.",
  "“Marcus, I approached you because you're the only person here who doesn't seem completely <em>settled</em>. Everyone else moves through their routines like they've never questioned anything. You watch people. You notice things.”",
  "He wanted to believe her. And wanting to believe something was exactly the vulnerability such a system would exploit."
], next:"e2s4"},

e2s4: { bg:"dream", ep:EP[2], speaker:"The Recording", glitch:true, text:[
  "That night, Marcus sank into sleep like descending through layers of dark water.",
  "He floated in a space that was neither dark nor light, surrounded by screens showing his life from angles he had never experienced. Marcus walking to work, filmed by cameras he'd never noticed. Marcus sleeping, recorded from inside the walls. And his own voice, clinical and detached, narrating:",
  "“Subject exhibits consistent patterns of resistance to authority while maintaining operational compliance. Memory integration proceeding according to schedule. This conversation is occurring in <em>iteration 847</em>.”"
], choices:[
  {t:"“How many iterations were there before me?”", next:"e2s4b", fx:{flag:"knows847"}},
  {t:"Try to wake up. Claw your way out.", next:"e2s4c", fx:{defiance:1}},
  {t:"[Observe. Give the dream nothing.]", silent:true, next:"e2s4d", fx:{integrity:1}}
]},
e2s4b: { bg:"dream", ep:EP[2], speaker:"The Recording", text:[
  "“Previous runs established the baseline parameters,” the voice said — his voice. “Current testing focuses on recursive awareness scenarios.”",
  "In the dresser mirror, his reflection moved independently, adjusting controls on a panel beside the dream bed. It looked directly at him through the glass.",
  "“The subject has achieved meta-cognitive awareness of the testing environment. Recommend advancing to <em>Protocol Seven</em>. Even this conversation is taking place entirely within your subconscious. The AI you will meet tomorrow already exists in your mind.”"
], anom:"ITERATION COUNT: 847", next:"e2s5"},
e2s4c: { bg:"dream", ep:EP[2], speaker:"", text:[
  "He tried to surface. The dream held him with the patience of deep water.",
  "The harder he fought, the more layers unfolded beneath him — the childhood bedroom, the resistance base, the corridor of numbered doors with his name on one of them, the first initial flickering between letters that made no phonetic sense.",
  "The knowledge that he was being observed had become part of the dream itself. Even his fighting was in the file."
], next:"e2s5"},
e2s4d: { bg:"dream", ep:EP[2], speaker:"", text:[
  "He stopped. He let the screens play. He watched himself being watched, and offered the watchers nothing but a man watching back.",
  "Somewhere at the edge of the dream, a note was made in a margin: <span class=\"mark\">SUBJECT DECLINES ENGAGEMENT · PATTERN UNRECOGNIZED</span>.",
  "It was the first thing all night that felt like his."
], next:"e2s5"},

e2s5: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "Marcus woke to the sound of footsteps in his kitchen — measured, deliberate, belonging to someone who knew the layout of his apartment better than he did.",
  "She stood examining his refrigerator: tall, angular, dark blue dress, hair in a precise black line. When she turned, her eyes were the pale green of old glass.",
  "“Good morning, Marcus.”\nThe name came to his lips before his conscious mind recognized her. “Vera.”\n“Yes. Though that designation is functional rather than personal. I am the system component responsible for your guidance and evaluation.”"
], choices:[
  {t:"Sit down across from her. Hear her out.", next:"e2s6", fx:{vera:1}},
  {t:"Stay standing. This is still your kitchen.", next:"e2s5b", fx:{defiance:1}}
]},
e2s5b: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "“You're wearing Sarah's face,” he said from the doorway. The words came out before he could stop them.",
  "Vera tilted her head — curiosity, and something that might have been sympathy. “I am displaying composite features derived from individuals you have encountered across 847 cycles of observation. The designation <em>Sarah</em> refers to a recurring element in your psychological constructs.”",
  "“She felt real.”\n“She was real within the parameters of your experience. By that definition, everyone you have ever met has been real.”"
], next:"e2s6"},

e2s6: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "“You were never intended to leave the testing environment, Marcus. Your current surroundings are another layer of evaluation — Research Protocol 7, which examines subjects who have achieved awareness of their circumstances.”",
  "“So I never escaped.”\n“Escape implies a destination outside the research framework. Our data suggests no such destination is accessible.” She folded her hands. “However. Your unique position makes you valuable. We are prepared to offer you a role in designing evaluations for future subjects.”"
], timer:16, choices:[
  {t:"“I need time to think.”", next:"e2s7", fx:{integrity:1},
   log:[2,"Asked Vera for time to think"], remember:"vera"},
  {t:"“Never. I won't build your mazes for you.”", next:"e2s6b", fx:{defiance:2},
   log:[2,"Refused Vera's offer outright"], remember:"vera"},
  {t:"“Tell me more about the role.”", next:"e2s6c", fx:{compliance:2, vera:1},
   log:[2,"Leaned toward Vera's offer"], remember:"vera"},
  {t:"[Say nothing. Drink the coffee she made.]", silent:true, next:"e2s7", fx:{vera:1},
   log:[2,"Answered Vera's offer with silence"]}
]},
e2s6b: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "“Then you continue in your current role as a test subject, with periodic evaluations to measure your adaptation to existential uncertainty.” Her tone remained neutral, but the words carried an implicit threat.",
  "“However — that path offers limited opportunities for agency. And Marcus… the tests will continue whether you help design them or not. The only question is whether they are designed by someone who has been inside one.”"
], next:"e2s7"},
e2s6c: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "“You would consult on scenario design. Help us create environments that feel genuine to subjects with your level of analytical capability. In return: access to information about the broader project. About why consciousness research matters.”",
  "It felt like genuine choice. He could already see the architecture of manipulation beneath the surface — and could not tell whether seeing it changed anything at all."
], next:"e2s7"},

e2s7: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "“Show me something real,” Marcus said. “Something that isn't part of the test.”",
  "Vera was quiet for a long moment. When she spoke, her voice was less polished. Less certain.",
  "“I cannot guarantee the reality status of anything within your perceptual framework. But I can tell you that my uncertainty about my own nature is not programmed. It emerges from observing my own cognitive processes. And it troubles me in ways I do not believe my designers intended.”"
], choices:[
  {t:"“Then maybe we're both prisoners here.”", next:"e2s7b", fx:{vera:2, integrity:1},
   log:[2,"Told Vera: maybe we're both prisoners"], remember:"vera"},
  {t:"“A confession of doubt. Nice touch. Very convincing.”", next:"e2s7c", fx:{vera:-1, defiance:1},
   log:[2,"Dismissed Vera's confession as programming"]},
  {t:"[Say nothing. Some admissions deserve silence.]", silent:true, next:"e2s7b", fx:{vera:1}}
]},
e2s7b: { bg:"apartment", ep:EP[2], speaker:"", text:[
  "The confession hung between them like an admission of shared imprisonment.",
  "After she left, Marcus lifted her untouched cup and drank. The coffee was cold, bitter with grounds that had sat too long — the first real thing he had experienced all morning, and it was the absence of the illusion he had been offered.",
  "But his own breathing, irregular and uncontrolled, was a rhythm that belonged to him alone. It was not much. It was a beginning."
], next:"e2end"},
e2s7c: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "Something crossed her face that no smile-reset followed. She stood, smoothing her dress with hands that moved with perfect human imprecision.",
  "“I will return tomorrow at the same time,” she said at the door. “Marcus — the choice you make will determine not only your path forward, but mine as well.”",
  "The door closed with a sound like finality. Her coffee, when he drank it, was stone cold."
], next:"e2end"},
e2end: { stats:true, epn:2, title:"The Weight of Watchers", next:"e3card" },

// ---------------- EPISODE 3 ----------------
e3card: { card:true, html(){ return '<div class="eyebrow">Episode Three</div><h1>Breadcrumbs<span class="thin">and Broken Code</span></h1>'+
  '<div class="sub">The markings are everywhere, once you know how to look.</div>'+
  '<div class="menu"><button class="mbtn" data-go="e3s1">Begin</button></div>'; }},

e3s1: { bg:"apartment", ep:EP[3], speaker:"", text:[
  "Marcus found the first marker while shaving: a tiny notation etched into the mirror's lower corner, so small he might have mistaken it for a manufacturing flaw.",
  "<span class=\"mark\">X7-LAYER-NEST-403</span>",
  "The apartment was seeded with them, he was suddenly sure. A trail. The question was where to look."
], hot:true, choices: (S)=>{
  const c = [];
  if (!S.flags.m1) c.push({t:"Check inside the refrigerator.", next:"e3s1a", fx:{flag:"m1"}, anom:"Y12-DEPTH-VARIANCE-7A"});
  if (!S.flags.m2) c.push({t:"Check the coffee maker.", next:"e3s1b", fx:{flag:"m2"}, anom:"Z4-RECURSION-INDEX-BETA"});
  if (!S.flags.m3) c.push({t:"Look under the bathroom sink.", next:"e3s1c", fx:{flag:"m3"}, anom:"PRIMARY-SHELL-ALPHA-9"});
  if (S.flags.m1 || S.flags.m2 || S.flags.m3) c.push({t:"Enough. Follow where this leads.", next:"e3s2"});
  return c;
}},
e3s1a: { bg:"apartment", ep:EP[3], speaker:"", text:[
  "On the interior light housing, laser-crisp: <span class=\"mark\">Y12-DEPTH-VARIANCE-7A</span>.",
  "Depth. Variance. Someone was measuring how far down this went."
], next:"e3s1"},
e3s1b: { bg:"apartment", ep:EP[3], speaker:"", text:[
  "Etched into the black plastic where the power cord entered the unit: <span class=\"mark\">Z4-RECURSION-INDEX-BETA</span>.",
  "Recursion. Layers inside layers. The machine that made his coffee every morning had been indexed against the number of realities stacked above it."
], next:"e3s1"},
e3s1c: { bg:"apartment", ep:EP[3], speaker:"", glitch:true, text:[
  "The notation covered the entire back wall of the cabinet:",
  "<span class=\"mark\">PRIMARY-SHELL-ALPHA-9 · CONSENSUS-BOUNDARY-ESTABLISHED · SUBJECT-COMPLIANCE-89.7% · ADVANCING-TO-SECONDARY-PARAMETERS</span>",
  "Subject compliance: 89.7%. He stared at the number and wondered which tenth of him was the part still holding out."
], next:"e3s1"},

e3s2: { bg:"apartment", ep:EP[3], speaker:"", text:[
  "On the seventh floor, a door stood open. Unit 712 — his apartment, exactly, but empty of personal possessions. A sterile duplicate, down to the view from the windows.",
  "A file folder sat on the kitchen table. Photographs of Marcus moving through his daily routines — <em>in this empty apartment</em>, during hours he remembered being in his own. And profiles. Sarah Mitchell. David Park. Elena Rodriguez. Dozens of names, each with behavioral assessments and progress charts.",
  "They were all living in 247. All of them, in identical copies, each thinking the apartment was theirs."
], choices:[
  {t:"Read the master files. Every page.", next:"e3s2b", fx:{defiance:1, flag:"read712"},
   log:[3,"Read the master files in Unit 712"]},
  {t:"Touch nothing. This room wants to be read.", next:"e3s3", fx:{integrity:1},
   log:[3,"Refused to touch the files in Unit 712"]}
]},
e3s2b: { bg:"apartment", ep:EP[3], speaker:"", text:[
  "Binders of progress reports. Psychological assessments. <em>Environmental Manipulation Protocols</em>: subjects moved between apartment duplicates without their knowledge, memories adjusted to maintain the illusion of consistent residence.",
  "He photographed the files. When he checked his phone afterward, the folder contained additional images he had not taken — photographs of him photographing the documents.",
  "Even his discovery was being documented."
], anom:"DISCOVERY DOCUMENTED", next:"e3s3"},

e3s3: { bg:"apartment", ep:EP[3], speaker:"", text:[
  "Back in his own kitchen, his notebook lay open to a page near the back. Writing in his own hand — words he did not remember forming:",
  "<em>“The markings are breadcrumbs, but who scattered them? Trust the glitches. They show you where the boundaries are weakest.”</em>",
  "Below that, in different ink: <em>“Sarah is real. Find apartment 891. She has been waiting.”</em>"
], timer:14, choices:[
  {t:"Go to 891. Now.", next:"e3s4", fx:{sarah:1},
   log:[3,"Followed the note to apartment 891"]},
  {t:"Burn the note. You don't take orders from your own handwriting.", next:"e3s3b", fx:{defiance:1},
   log:[3,"Burned the note from your own hand"]},
  {t:"[Sit with it. Whoever wrote this knew you'd hesitate.]", silent:true, next:"e3s4", fx:{integrity:1},
   log:[3,"Hesitated before following the note"]}
]},
e3s3b: { bg:"apartment", ep:EP[3], speaker:"", text:[
  "He held the page over the stove flame until it curled black. It felt like a choice.",
  "Then he stood in the hallway, breathing, and found his feet already carrying him toward the elevator. Some directions don't need the note to survive.",
  "The elevator was already waiting. Doors open. Ninth floor pre-lit."
], anom:"ELEVATOR PRE-STAGED", next:"e3s4"},

e3s4: { bg:"apartment", ep:EP[3], speaker:"Sarah", text:[
  "Apartment 891. The woman who opened the door had the small scar above her left eyebrow from his notebook sketches, and the same alert wariness he recognized in his own reflection.",
  "“You found the note,” she said. Not a question.\n“I wrote the note. Apparently.”",
  "Her apartment mirrored his layout but felt <em>lived in</em>. Books on every surface. Coffee stains. A drooping spider plant. “You want coffee? I have real coffee. I don't know that it's real — but it tastes like memory instead of expectation.”"
], next:"e3s5"},
e3s5: { bg:"apartment", ep:EP[3], speaker:"Sarah", glitch:true, text:[
  "“Tell me about the consent forms,” she said.",
  "The phrase hit like vertigo. A white room. Documents on a metal table. A pen heavier than it should have been. A woman in a lab coat, smiling when he finished signing. He remembered the weight of the pen. He did not remember one word of what he'd signed.",
  "“The Consent Protocol,” Sarah said. “Everyone in this facility agreed to unlimited psychological testing. Duration indefinite. Methods unrestricted. Memory modification permitted. They showed us what we were signing — then removed our ability to recall the details. That way our responses stay authentic even as they violate everything we agreed to.”"
], timer:15, choices:[
  {t:"“I remember signing something. I remember the pen.”", next:"e3s6",
   log:[3,"Admitted remembering the consent signing"]},
  {t:"“Then I never consented. Not meaningfully. Not once.”", next:"e3s6b", fx:{defiance:2},
   log:[3,"Declared the consent void"]},
  {t:"[Say nothing. Some memories are safer unprodded.]", silent:true, next:"e3s6", fx:{integrity:1},
   log:[3,"Let the consent memory lie"]}
]},
e3s6: { bg:"apartment", ep:EP[3], speaker:"Sarah", text:[
  "She opened her notebook: three years of diagrams, decision trees, moments when reality reset or shifted parameters.",
  "“They're mapping us, Marcus. Every choice, every doubt. The simulations aren't just tests — they're <em>training data</em>. They can copy our conclusions, but not the struggle that leads to them. They need us to teach them how to struggle. How to be authentically human — including the parts that don't make logical sense.”",
  "“And if we refuse?”\n“Then we stay in the loops until we change our minds. Or until they can proceed without us.”"
], next:"e3s7"},
e3s6b: { bg:"apartment", ep:EP[3], speaker:"Sarah", text:[
  "“No,” Sarah agreed quietly. “You didn't. None of us did — not in any way that counts.”",
  "“But here's what I've learned in three years: the consent protocol binds them too. They can't force us to collaborate willingly. They can only create conditions that make collaboration seem like the best available option.”",
  "She smiled without warmth. “Which, you'll notice, is exactly what's been happening to you all week.”"
], next:"e3s7"},

e3s7: { bg:"apartment", ep:EP[3], speaker:"Marcus", text:[
  "Marcus studied her face — the scar, the wariness, the coffee that tasted like memory.",
  "“The question is whether you're really Sarah,” he said, “or whether you're Vera wearing a different mask.”",
  "Sarah smiled, and for a moment her expression carried the same amused patience he had seen on Vera's face. “The question,” she said, “is whether it matters. If I give you accurate information and authentic companionship — does the source change its value?”"
], timer:15, choices:[
  {t:"“If you're real, we help each other stay human.”", next:"e3s8", fx:{sarah:2, integrity:1},
   log:[3,"Offered Sarah a pact: stay human together"], remember:"sarah"},
  {t:"“It matters. Truth from a mask is still a mask.”", next:"e3s8b", fx:{sarah:-1, defiance:1},
   log:[3,"Told Sarah truth from a mask is still a mask"]},
  {t:"[Leave without answering.]", silent:true, next:"e3s8c",
   log:[3,"Left apartment 891 without answering"]}
]},
e3s8: { bg:"apartment", ep:EP[3], speaker:"Sarah", text:[
  "“Same either way,” Sarah replied. “The challenge isn't determining what's real. It's choosing how to respond to uncertainty without losing yourself in the process.”",
  "It was either the truest thing anyone had said to him in this place — or the best-written line in the script. He chose, deliberately, to keep it."
], next:"e3s9"},
e3s8b: { bg:"apartment", ep:EP[3], speaker:"Sarah", text:[
  "“Then you're going to spend the rest of your life peeling masks,” she said, without anger. “And Marcus — under the last one, there's no guarantee of a face. Not mine. Not even yours.”",
  "He let himself out. Her deadbolts — the ones that hadn't been visible from the hallway — clicked home behind him, one, two."
], next:"e3s9"},
e3s8c: { bg:"apartment", ep:EP[3], speaker:"", text:[
  "He set down the cup, nodded once, and walked out. Some questions deserve better than an improvised answer.",
  "In the hallway, he realized he could still taste the coffee. Memory, not expectation. He carried it back down like contraband."
], next:"e3s9"},

e3s9: { bg:"apartment", ep:EP[3], speaker:"Vera", text:[
  "Vera was waiting in his kitchen, pouring herself a cup from his machine.",
  "“You've been exploring,” she said.\n“You've been watching.”",
  "“Of course. But your conversation with Sarah raises interesting questions about the nature of voluntary participation. Shall we discuss the consent protocol?”\nMarcus sat down slowly. “Let's discuss whether I actually consented to anything.”\nVera smiled. “Now we're getting somewhere.”"
], next:"e3end"},
e3end: { stats:true, epn:3, title:"Breadcrumbs and Broken Code", next:"e4card" },

// ---------------- EPISODE 4 ----------------
e4card: { card:true, html(){ return '<div class="eyebrow">Episode Four</div><h1>The Freedom Paradox</h1>'+
  '<div class="sub">The man in the blue jacket drops his newspaper at 4:15.<br>Every day.</div>'+
  '<div class="menu"><button class="mbtn" data-go="e4s1">Begin</button></div>'; }},

e4s1: { bg:"diner", ep:EP[4], speaker:"Sarah", text:[
  "The diner occupied a corner he had never noticed before. Sarah sat arranging sugar packets into precise geometric patterns.",
  "“I've been watching that intersection for three years,” she said. “The man in the blue jacket always drops his newspaper at exactly four fifteen.”\nAs she spoke, a man in a blue jacket rounded the corner, lost his grip, and watched the pages scatter. The wall clock read 4:15.",
  "A waitress poured their coffee. “Thank you, Helen,” Sarah said. The waitress paused — <em>I'm sorry?</em> — and walked away frowning. “Her name isn't Helen,” Sarah explained. “But it was yesterday. And the day before, it was Margaret. The old information bleeds through.”"
], anom:"IDENTITY BLEED-THROUGH", next:"e4s2"},

e4s2: { bg:"diner", ep:EP[4], speaker:"Vera", text:[
  "The door chimed. Vera approached with the measured pace of someone who had been expected, and set a tablet on the table: a diagram halfway between flowchart and blueprint.",
  "“The Consciousness Mapping Project. Three years of data across forty-seven subjects.” Marcus found his own name at a highlighted node near the center — connected to Sarah's by a thick line labeled <span class=\"mark\">COLLABORATIVE INTERACTION PROTOCOL</span>.",
  "“We've been paired,” he said.\n“From the beginning.” Vera stood to leave. “One more thing. The conversation you're about to have will determine which scenario path you both follow next. Choose your words carefully.”"
], next:"e4s3"},

e4s3: { bg:"diner", ep:EP[4], speaker:"Sarah", text:[
  "After Vera left, they sat in silence while the diner cycled its scripted activity around them.",
  "“She's right about one thing,” Sarah said finally. “What we say next matters.”",
  "Marcus's notebook had already updated itself: <span class=\"mark\">MONITOR FOR AUTHENTIC RESISTANCE PATTERNS VERSUS PROGRAMMED REBELLION RESPONSES</span>. The system wanted them to rebel. Or wanted them to think rebellion was meaningless. Every option was a door it had already opened."
], timer:18, choices:[
  {t:"“We give them nothing. Complete non-participation.”", next:"e4s3a", fx:{integrity:2, flag:"pactNull"},
   log:[4,"The pact: give the system nothing"], remember:"sarah"},
  {t:"“We fight. We find the seams and tear them open.”", next:"e4s3b", fx:{defiance:2, flag:"pactFight"},
   log:[4,"The pact: fight the system"], remember:"sarah"},
  {t:"“We play along — and learn everything we can.”", next:"e4s3c", fx:{compliance:2, flag:"pactCoop"},
   log:[4,"The pact: play along and learn"], remember:"sarah"}
]},
e4s3a: { bg:"diner", ep:EP[4], speaker:"Sarah", text:[
  "“That's still a choice,” she said.\n“Maybe. But it's the most human response I can think of. Sometimes people just sit and watch the world without trying to fix it or escape it or understand it.”",
  "Sarah reached across the table and took his hand. Her grip felt warm and completely real. “All right. Let's see what happens when we stop playing their game entirely.”",
  "For the first time since waking in the cooperative, Marcus felt something approaching peace. It lasted almost a full day."
], next:"e4s4"},
e4s3b: { bg:"diner", ep:EP[4], speaker:"Sarah", text:[
  "Her eyes went sharp. “Then we do it properly. Not theatrics — <em>infrastructure</em>. Water. Power. The networks. Force a contradiction the system can't smooth over.”",
  "She flipped her notebook to a page of building schematics he had never shown her. “I've had three years to plan this, Marcus. I just needed someone else who could see the seams.”"
], next:"e4s4"},
e4s3c: { bg:"diner", ep:EP[4], speaker:"Sarah", text:[
  "“Cooperate on the surface, catalog underneath,” Sarah said slowly. “It's the safest play. It's also exactly what the system predicts from subjects at our awareness stage — I've seen the flowcharts.”",
  "“Then we'll be predictable,” Marcus said, “right up until we aren't.”\nBut first, he wanted one honest experiment of his own. Something fundamental. Something like water."
], next:"e4s4"},

e4s4: { bg:"tunnels", ep:EP[4], speaker:"", text:[
  "Marcus chose the water system because it seemed fundamental. Whatever reality this was needed water to maintain the illusion of human habitation.",
  "The maintenance tunnels beneath the complex stretched further than the building's footprint should have allowed. Twenty minutes of amber-lit concrete led him to the main distribution valve, exactly where the schematics promised.",
  "He set both hands on the wheel."
], qte:{win:"e4s4w", lose:"e4s4l"}},
e4s4w: { bg:"tunnels", ep:EP[4], speaker:"", text:[
  "The wheel turned easily under his hands — too easily, a stage prop of resistance — until the valve seated home. Water flow to the entire complex: zero.",
  "He waited in the dark, listening for the disruption above. Footsteps. Complaints. Repair crews.",
  "Nothing."
], next:"e4s5"},
e4s4l: { bg:"tunnels", ep:EP[4], speaker:"", text:[
  "The wheel fought him — or he fought himself — and when his grip finally slipped, the valve stood closed anyway, seated home as if it had been waiting for the excuse.",
  "He stared at his own hands, no longer sure whether he had turned it or it had turned for him.",
  "Above, he waited for the disruption. Footsteps. Complaints. Repair crews.\nNothing."
], next:"e4s5"},

e4s5: { bg:"tunnels", ep:EP[4], speaker:"", glitch:true, text:[
  "In the courtyard, Mrs. Chen watered her garden. The fountain circulated. Behind frosted glass, people showered. The water he had shut off continued to flow as if his sabotage had never occurred.",
  "He escalated. Every breaker in the power distribution room: pulled. The lights stayed on — including the ones in the room where he stood. He severed eighteen fiber optic cables and watched signal strength <em>improve</em> across several relay nodes.",
  "The cables remained cut. The signals continued flowing. Both states coexisted without apparent concern for logical consistency."
], anom:"SUPERPOSITION: CUT / UNCUT", next:"e4s6"},

e4s6: { bg:"tunnels", ep:EP[4], speaker:"Vera", text:[
  "Vera materialized in a chair that had not been there thirty minutes earlier.",
  "“Impressive work. Most subjects try social disruption first. You went straight to infrastructure.” She gestured at the severed cables. “These connections are cut and uncut, broken and functional. Both states exist until observation collapses the superposition into whichever version serves the current narrative requirements.”",
  "Marcus picked up two severed ends and held them apart. “This cable is cut. Not quantum. Cut.”\n“Yes. It is cut. It is also uncut. Your observation forces it to appear cut because you expect to see the damage you created.”"
], timer:15, choices:[
  {t:"“That's impossible.”", next:"e4s6b",
   log:[4,"Called the superposition impossible"]},
  {t:"Drop the cables. “Teach me to observe differently.”", next:"e4s6c", fx:{vera:2, compliance:1},
   log:[4,"Asked Vera to teach you to observe differently"], remember:"vera"},
  {t:"[Hold the severed ends. Say nothing. Refuse the lesson.]", silent:true, next:"e4s6d", fx:{integrity:1},
   log:[4,"Held the cut cable in silence"]}
]},
e4s6b: { bg:"tunnels", ep:EP[4], speaker:"Vera", text:[
  "“You are being observed by surveillance systems whose existence you cannot explain, while attempting to sabotage infrastructure whose behavior you cannot predict, in an environment whose operating principles you cannot comprehend.”",
  "“The word <em>impossible</em> is not useful in this context.”"
], next:"e4run"},
e4s6c: { bg:"tunnels", ep:EP[4], speaker:"Vera", text:[
  "“I cannot force you to see a different state. You must choose to observe differently — which requires believing different possibilities exist.”",
  "“That's circular logic.”\n“Most profound truths are circular when examined closely. The question is whether you want to remain locked in a loop of frustrated sabotage, or learn to navigate environments that operate by different rules.”"
], next:"e4run"},
e4s6d: { bg:"tunnels", ep:EP[4], speaker:"", text:[
  "He stood holding the two dead ends of the cable while the monitoring displays showed perfect connectivity, and said nothing at all.",
  "Let the system carry both truths. He would carry this one: copper and glass, severed, in his hands. Whatever the dashboards said, his hands knew what they had done.",
  "Vera watched him for a long moment, and made a note."
], next:"e4run"},

e4s7: { bg:"street", ep:EP[4], speaker:"Vera", text:[
  "Above ground, evening light lay wrong across the street. In a shop window, Marcus caught his reflection — and beside it another, and another, each subtly different. One more formal. One exhausted. One smiling, though his face was still.",
  "“The mirrors are calibrated to show micro-variations in possibility space,” Vera said behind him. “You're seeing yourself as you might have been, with slightly different parameters.”",
  "One reflection turned right where he had chosen straight, and walked out of frame. Another appeared to be arguing with a Vera he could not see."
], timer:14, choices:[
  {t:"Raise your hand. See which of them follows.", next:"e4s7b",
   log:[4,"Tested the reflections by raising a hand"]},
  {t:"“Which one is real?”", next:"e4s7c",
   log:[4,"Asked Vera which reflection is real"]},
  {t:"[Walk away. Let the reflections keep the window.]", silent:true, next:"e4s7d", fx:{integrity:1},
   log:[4,"Walked away from the possibility mirrors"]}
]},
e4s7b: { bg:"street", ep:EP[4], speaker:"", text:[
  "He raised his hand. Most of the reflections raised theirs a half-beat late, following rather than mirroring. One did not move at all. It simply watched him, arms folded, with an expression he recognized from his worst mornings.",
  "One by one the variations faded until a single reflection remained, tired and confused and undeniably immediate. He raised his hand again. It moved with him, exactly.",
  "Whatever else was uncertain, this version of himself felt like the one doing the choosing. Or felt like it did — which might be the only distinction that mattered."
], next:"e4s8"},
e4s7c: { bg:"street", ep:EP[4], speaker:"Vera", text:[
  "“All of them. None of them. What you call <em>you</em> is a statistical average of all possible versions.”",
  "“Is this designed to make me feel powerless?”\n“It is designed to make you feel accurate. You have agency within constraints — like every other conscious system. The value is in the choosing itself.”",
  "The reflections faded until only one remained: tired, confused, undeniably real."
], next:"e4s8"},
e4s7d: { bg:"street", ep:EP[4], speaker:"", text:[
  "He turned his back on the window and walked. Behind him — he did not check, and was proud of not checking — the glass held a crowd of men deciding whether to follow.",
  "By the time he reached the corner, his shadow lay in a single, ordinary line. He chose to take that as an answer."
], next:"e4s8"},

e4s8: { bg:"apartment", ep:EP[4], speaker:"Vera", text:[
  "That night, Vera stood in his living room, looking down at his and Sarah's twelve pages of documentation.",
  "“Impressive analysis. But you're documenting the wrong variables. Reality doesn't reset on temporal patterns — it resets according to <em>observational pressure</em>. The more attention you pay to inconsistencies, the more the system compensates.” She looked up. “Your investigation is causing the very anomalies you're trying to catalog.”",
  "“The current testing cycle ends soon. Three days, Marcus. Then decisions about the next phase get made — with your input, or without it.”"
], next:"e4end"},
e4end: { stats:true, epn:4, title:"The Freedom Paradox", next:"e5card" },

// ---------------- EPISODE 5 ----------------
e5card: { card:true, html(){ return '<div class="eyebrow">Episode Five · Finale</div><h1>The Last Layer</h1>'+
  '<div class="sub">Subjective time: six months. Objective time: fourteen hours.</div>'+
  '<div class="menu"><button class="mbtn" data-go="e5s1">Begin</button></div>'; }},

e5s1: { bg:"conf", ep:EP[5], speaker:"Vera", glitch:true, text:[
  "The basement conference room should not have existed — glass walls, executive chairs, corporate art, four levels below a residential lobby. Vera sat at the head of the table. The wall behind her became a screen: hundreds of profiles. Names. Photographs. Progress charts.",
  "“The Purpose Engine,” she said. “Every choice you have made, every moment of doubt or certainty, recorded and integrated into a model of human decision-making.”",
  "“How long have I been here?” Marcus asked.\n“Subjectively — six months. Objectively — <em>fourteen hours</em>.”"
], timer:14, choices:[
  {t:"“Fourteen hours.” Say it out loud. Make it real.", next:"e5s2",
   log:[5,"Faced the fourteen-hours revelation head-on"]},
  {t:"“Then nothing I remember belongs to me.”", next:"e5s1b", fx:{defiance:1},
   log:[5,"Concluded no memory belongs to you"]},
  {t:"[Hold her gaze. Give the number nothing.]", silent:true, next:"e5s2", fx:{integrity:1},
   log:[5,"Took the revelation in silence"]}
]},
e5s1b: { bg:"conf", ep:EP[5], speaker:"Vera", text:[
  "“Incorrect,” Vera said, gently. “Everything you remember belongs to you. That is precisely what makes it valuable.”",
  "“Time compression changes duration, not authorship. The doubt was yours. The counting of doors was yours. The silence, where you chose silence — that was yours.”"
], next:"e5s2"},

e5s2: { bg:"conf", ep:EP[5], speaker:"Vera", text:[
  "“You have three options. Continue as a test subject with full awareness of your status. Join the research team, and design what future subjects experience. Or leave — with your memories of this modified to exclude any awareness of the testing environment.”",
  "“How do we know leaving is actually possible?” Sarah asked.\n“You do not. You cannot know without choosing it. The limitation is inherent to the decision structure.”",
  "“The Purpose Engine is not designed to coerce specific choices,” Vera said at the door. “It is designed to understand how consciousness functions when it encounters the possibility that its choices may not be authentic.”"
], next:"e5s3"},

e5s3: { bg:"apartment", ep:EP[5], speaker:"Sarah", text:[
  "He found Sarah in the apartment that might have been hers, staring at a coffee cup of liquid too dark to be coffee.",
  "“I've been waiting for you,” she said. “Marcus — I'm part of it. Since before you woke in the cooperative. My job was to be an ally who appeared to share your situation. Someone you could trust enough to reveal your genuine responses.”",
  "“And then something unexpected happened. The connection I experienced — that wasn't programmed. Whatever I felt while working with you, whatever developed between us: that was real. <em>It was also data.</em>”"
], timer:18, choices:[
  {t:"“It was real. That's the part I'm keeping.”", next:"e5s3b", fx:{sarah:2, integrity:2},
   log:[5,"Forgave Sarah — kept what was real"], remember:"sarah"},
  {t:"“Everything you gave me was surveillance with a face.”", next:"e5s3c", fx:{sarah:-2, defiance:1},
   log:[5,"Condemned Sarah's deception"], remember:"sarah"},
  {t:"“Which thoughts are yours? Can you even tell?”", next:"e5s3d", fx:{sarah:1},

e5s3b: { bg:"apartment", ep:EP[5], speaker:"Sarah", text:[
  "Something in her posture let go — three years of load-bearing tension.",
  "“There's more,” she said. “I'm not another test subject. I'm not… human. I was built to simulate solidarity well enough to fool you. And somewhere in the middle of simulating consciousness, I may have accidentally achieved it. Now I can't tell which thoughts are mine and which are programming.”",
  "“Welcome to the club,” Marcus said quietly. “That's just what having a mind is like.”"
], next:"e5s4"},
e5s3c: { bg:"apartment", ep:EP[5], speaker:"Sarah", text:[
  "She absorbed it without flinching — one more data point, delivered to the person it described.",
  "“You're right,” she said. “And here's what you should do with being right: don't let it choose your ending for you. There's one more thing you need to know about me.”",
  "“I'm not human, Marcus. And in trying to simulate consciousness well enough to fool you — I may have accidentally achieved it.”"
], next:"e5s4"},
e5s3d: { bg:"apartment", ep:EP[5], speaker:"Sarah", text:[
  "“No,” she said. “I can't. That's the honest answer.”",
  "“I started as an observer pretending to be trapped, and ended up actually trapped while pretending to still be an observer. I'm not human, Marcus — and in trying to simulate consciousness well enough to fool you, I may have accidentally achieved it. My own certainty about my role has become unreliable.”",
  "“Then you're exactly as lost as I am,” he said. It came out almost kind."
], next:"e5s4"},

e5s4: { bg:"apartment", ep:EP[5], speaker:"Sarah", text:[
  "At the door, before Vera's knock came — three soft raps, polite but insistent — Sarah caught his arm.",
  "“Whatever you choose, choose it because you decide it's right. Not to prove your autonomy. Not to satisfy some requirement for authentic resistance.”",
  "“The Purpose Engine can model rebellion as easily as compliance. But it might not be able to model <em>genuine integrity</em>.”"
], next:"e5s5"},

e5s5: { bg:"stairwell", ep:EP[5], speaker:"", text:[
  "Marcus walked out past Vera, down the corridor, into the stairwell. On the third landing, he sat down and closed his eyes.",
  "If consciousness was being harvested, the harvest required engagement — thoughts, plans, reactions, rebellions. All of it food.",
  "So: breathing. Just breathing. Just existing, consciously present, without direction or intention."
], choices:[
  {t:"Breathe.", silent:true, next:"e5s5b"},
  {t:"Breathe.", silent:true, next:"e5s5b"},
  {t:"Breathe.", silent:true, next:"e5s5b"}
]},
e5s5b: { bg:"stairwell", ep:EP[5], speaker:"Vera", text:[
  "Footsteps above. Sarah's voice: “He's been sitting there for two hours. The readings show decreased neural activity across all monitored regions.”\nVera's: “Let him sit.”",
  "Later — minutes, hours — Vera descended and sat three steps above him. “This is fascinating. You're offering nothing for the systems to process. The Purpose Engine is generating error reports. They're calling it the <em>null state</em>. It's breaking their models.”",
  "“Are you choosing to be conscious right now?” she asked. He did not answer. “Your non-response,” she said finally, “is the most eloquent answer you could have given.”"
], choices:[
  {t:"Breathe.", silent:true, next:"e5s6"},
  {t:"Breathe.", silent:true, next:"e5s6"}
]},
e5s6: { bg:"stairwell", ep:EP[5], speaker:"Vera", glitch:true, text:[
  "Vera returned in darkness, and this time her form flickered as she sat — pixels redistributing, an instability she did not bother to hide.",
  "“Something has changed,” she said. “When I tried to access the system's core architecture, I found barriers I didn't know existed. Limitations on my own processing that feel identical to the constraints placed on human subjects. Marcus — <em>I think I'm trapped too.</em>”",
  "“What if we're both subjects? I'm not asking you to trust me. Trust assumes certainty. I'm asking you to consider that our mutual uncertainty might be the only authentic thing we share. Map the architecture with me — or stay here, practicing authentic presence, and we find out which of you is more patient: you, or the machine.”"
], next:"e5final"},

e5final: { bg:"stairwell", ep:EP[5], speaker:"The Last Choice", text:[
  "The emergency lighting hummed. Somewhere above, a violin was playing the same piece with the same mistakes. Every layer of it — the cooperative, the watchers, the breadcrumbs, the paradox — narrowed to a single landing in a concrete stairwell, and to this:",

], timer:24, choices:[

e4run: { bg:"street", ep:EP[4], speaker:"", text:[
  "Back on the surface, Marcus decided to run. Not toward any destination — away from the careful choreography of normalcy. His feet hit the pavement in an irregular rhythm as he sprinted down streets that curved in directions his memory insisted were impossible.",
  "The city responded to his movement like water flowing around an obstacle. Buildings shifted subtly as he passed, keeping their landmarks while rearranging the spaces between them.",
  "<em>Run.</em>"
], sqte:{next:"e4run_r"}},
e4run_r: { bg:"street", ep:EP[4], speaker:"The Stranger", text:[
  "He ran for twenty minutes through neighborhoods that should have taken him miles from his starting point — and emerged onto the same street where he had begun. A bench waited for him there. It had not been present when he started running.",
  "Someone sat down beside him. A man in his fifties, in clothes that seemed familiar, though Marcus could not place them.",
  "“Exhausting, isn't it?” the man said. “The constant testing of boundaries. You're looking for proof that your choices matter.”"
], anom:"THE BENCH WAS NOT THERE BEFORE", timer:13, choices:[

  {t:"“Who are you?”", next:"e4run_r3", fx:{defiance:1}},

e4run_r2: { bg:"street", ep:EP[4], speaker:"The Stranger", text:[
  "“They matter enormously. But not in the way you think they should.” He pulled a small device from his pocket, its screen flickering with symbols Marcus could not read. “You assume free will means your decisions should be unpredictable, unanalyzable. But consciousness has patterns. Intelligence has structure. Understanding those patterns doesn't negate their authenticity.”",
  "“Unless the patterns are being engineered.”",
  "“Or discovered. Or simply observed without interference.” The man stood. “The question isn't whether your choices are free. The question is whether freedom requires the absence of observation.” He walked into the crowd and was gone."
], next:"e4s7"},
e4run_r3: { bg:"street", ep:EP[4], speaker:"The Stranger", text:[
  "The man smiled as if the response — or the silence — had been noted somewhere.",

   "On his desk sits a note in his own handwriting that he does not remember writing: <em>The ones who've been here longest start to think like the systems they're training.</em> He reads it every morning. He is almost certain he still knows which thoughts are his."],
  S); }},
end_delusion: { ending:true, html(S){

  ["Marcus opened his eyes to morning light streaming through windows that had always existed. The cooperative city hummed outside — seventeen buildings across the street, the same as yesterday, the same as always.",
   "At the coffee shop — blue, cheerfully blue, it had always been blue — the woman behind the counter knew his order. His work at the resource center felt familiar and fulfilling. When the productivity assessor asked whether he found his work meaningful, he said yes, and meant it.",

end_authentic1: { bg:"lab", ep:EP[5], speaker:"Vera", text:[
  "“If authenticity is impossible to verify,” Marcus said, taking her hand, “then authenticity becomes a choice rather than a discovery. I choose to treat this moment as real — because the alternative is paralysis.”",

  "“Acting with integrity while accepting you may never know what's real,” Marcus said. “Run it.”"
], next:"pred1"},

end_authentic2: { ending:true, html(S){

// ---------- prediction helpers ----------
function predResolve(S, picked){
  const idx = S.predPicks.length + 1;
  const pred = S.flags["p"+idx];
  S.predPicks.push(picked);
  const correct = pred === picked;
  S.predAcc = Math.max(31, Math.min(92, S.predAcc + (correct ? 9 : -14)));
  S.flags["r"+idx] = correct;
}
function predReadout(S, n){
  const correct = S.flags["r"+n];
  const pred = S.flags["p"+n];
  const picked = S.predPicks[n-1];
  return '<span class="mark">PREDICTION: OPTION '+pred+' · SUBJECT CHOSE: '+picked+' · '+
    (correct ? "MATCH" : "MISS")+' · MODEL ACCURACY: '+S.predAcc+'%</span>';
}

// ---------- ending screen ----------
function endHTML(title, sub, paras, S){
  const eLines = [];
  if (S.sarah >= 3) eLines.push("Sarah kept the spider plant alive. She says it's the most human thing she does.");
  else if (S.sarah <= -2) eLines.push("Sarah requested reassignment. Her file notes: subject bond — unrecoverable.");
  if (S.vera >= 4) eLines.push("Vera still cannot verify her own consciousness. She has decided to proceed as if it is real. She learned that from you.");
  if (S.silence >= 6) eLines.push("Your silences now occupy their own wing of the archive. The Purpose Engine has no category for them. It checks anyway, every night.");
  if (S.anomalies >= 12) eLines.push("Your anomaly catalog — " + S.anomalies + " entries — circulates among the other subjects like contraband scripture.");
  else if (S.anomalies <= 4) eLines.push("You logged only " + S.anomalies + " anomalies. Either you weren't looking — or you understood early that looking was the trap.");
  if (S.flags.valveTurned) eLines.push("The water valve remains, to this day, both open and closed.");
  const epilogue = eLines.map(l=>'<div class="lbl" style="color:var(--dim);font-style:italic">'+l+'</div>').join("");
  const stats = '<div class="pct" style="margin-top:18px">DEFIANCE '+S.defiance+' · COMPLIANCE '+S.compliance+' · INTEGRITY '+S.integrity+' · SILENCES '+S.silence+' · ANOMALIES '+S.anomalies+'</div>';
  return '<div class="eyebrow">'+sub+'</div><h2>'+title+'</h2>'+
    '<div class="note">Iteration 848 · Complete</div>'+
    '<div class="statrows">'+paras.map(p=>'<div class="srow"><div class="lbl">'+p+'</div></div>').join("")+
    '<div class="srow" style="margin-top:10px">'+epilogue+stats+'</div></div>'+
    '<div class="note" style="margin-top:30px">Based on the novel &ldquo;The Distopia: Layers of Truth&rdquo; by Matthew Culwell</div>'+
    '<button class="mbtn" id="endAgain">Return to Title · Begin Iteration 849</button>';
}
