  "He raises two fingers toward the floor monitor. Her face does something extraordinary: it becomes completely calm.",
  "«Interesting choice,» she says — already moving, four unhurried steps, timed like choreography. By the time the monitor arrives, there are only lentils."
], fx:{flag:"metSarah"}, next:"n1"},

n1: { bg:"street", ep:EP[1], speaker:"", text:[
  "Evening. Outside his block, a gray van idles at the curb. Not for him.",
  "Its engine has the patience of something that has never once been wrong."
], next:(S)=> S.flags.davidExposed ? "n2x" : "n2y"},
n2x: { bg:"street", ep:EP[1], speaker:"", text:[
  "They bring David out of the adjacent block. He is not resisting. He is carrying a potted plant — they let him keep it, which is the cruelest thing Marcus has ever seen.",
  "David sees him across the street. Nods, pleasantly. Mouths: <em>the harvest's fine.</em>",
  "The van swallows him. The plant's leaves are the last thing visible."
], fx:{flag:"davidTaken"}, anom:"DAVID — CORRECTED, 9:14 PM", next:"n3"},
n2y: { bg:"street", ep:EP[1], speaker:"", text:[
  "Two grays stand at David's door with a tablet, checking something. Re-checking it.",
  "Whatever box needed a witness — tonight it stays unchecked. They fold back into the van.",
  "David's window stays lit: buzzing, ordinary, alive."
], fx:{flag:"davidSaved"}, next:"n3"},
n3: { bg:"apartment", ep:EP[1], speaker:"", text:[
  "His terminal glows with one unread message. No sender. No header.",
  "«You did what you did. It is in the record now. Sleep. — A friend»"
], next:"e1end"},
e1end: { stats:true, epn:1, title:"Surface Tension", next:"e2card" },

// ---------------- EPISODE 2 ----------------
e2card: { card:true, html(){ return '<div class="eyebrow">Episode Two</div><h1>The Weight<span class="thin">of Watchers</span></h1>'+
  '<div class="note">“The violin played the same piece as every morning. The same mistake in the same measure.”</div>'+
  '<button class="mbtn" data-go="v2a">Continue</button>'; }},

v2a: { bg:"apartment", ep:EP[2], speaker:"", text:[
  "7:12 AM. The violin starts through the east wall. The same piece as every morning.",
  "The same mistake, in the same measure — like a scar the music refuses to heal."
], timer:8, choices:[
  {t:"[Knock on 7D's door.]", next:"v2b", fx:{defiance:1, att:4}},
  {t:"[Press your ear to the wall.]", next:"v2c", fx:{integrity:1}},
  {t:"Let the wrongness become furniture.", silent:true, next:"v2d", fx:{compliance:1}}
]},
v2b: { bg:"apartment", ep:EP[2], speaker:"", text:[
  "He knocks on 7D. The music stops mid-phrase.",
  "No footsteps. No voice. Then the piece begins again — from the exact note where it stopped.",
  "Through the door: no breathing. No floorboards. Just the music, playing itself."
], anom:"7D — MUSIC WITHOUT OCCUPANT", next:"h2"},
v2c: { bg:"apartment", ep:EP[2], speaker:"", text:[
  "Pressed against the plaster, he hears it: underneath the strings, a faint tick.",
  "Not a metronome. A sprocket. Like film passing through a projector."
], anom:"VIOLIN — MECHANICAL SUBSTRATE", next:"h2"},
v2d: { bg:"apartment", ep:EP[2], speaker:"", text:[
  "He drinks his coffee and lets the mistake wash over him, morning-shaped.",
  "By the last sip he has almost convinced himself that comfort and surrender are different words."
], next:"h2"},
h2: { bg:"stairwell", ep:EP[2], speaker:"", text:[
  "The landing. Mrs. Chen sweeps the same seventeen square feet she has swept for years.",
  "The dust never changes. Neither does she."
], explore:{need:1, spots:[
  {x:70,y:40, label:"Apartment 4B", text:"4B is sealed with gray tape. Through the keyhole: nothing. No furniture. No stains. No Hallis.\nNot an emptied apartment — an apartment that has never contained anyone.", anom:"4B — RETROACTIVELY VACANT"},
  {x:30,y:52, label:"Mrs. Chen", text:"«Morning, Marcus.» Sweep. Sweep.\n«You didn't sleep. Your kettle went on at 3:58.»\nShe says it kindly. She says it exactly like a warning.", fx:{flag:"chenWatches"}}
], exit:{label:"[Go — Sarah's cafe.]", next:"sc1"}}},

sc1: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "She is at the corner table. Two cups, already poured.",
  "«Sit. You have the face of a man doing arithmetic he doesn't like.»"
], next:"sc2"},
sc2: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "«Forty-seven,» she says. «That's how many of us ever noticed things. I've counted who's left.»",
  "She turns her cup one quarter-turn. «It is not forty-seven anymore.»"
], timer:9, choices:[
  {t:"«What happens to the ones who notice?»", next:"sc3a", fx:{trust:1}},
  {t:"«Why tell me?»", next:"sc3b", fx:{trust:1}},
  {t:"«I'm not one of your forty-seven.»", silent:true, next:"sc3c", fx:{trust:-1, compliance:1}}
]},
sc3a: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "«Hallis noticed out loud.» Quarter-turn. «Chen noticed, and made herself useful. I noticed, and made myself boring.»",
  "«Guess which strategies work.»"
], next:"sc4"},
sc3b: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "«Because you looked up. And because when they took Hallis, you didn't cheer.»",
  "She holds his eyes. «Believe me. Some people cheer.»"
], next:"sc4"},
sc3c: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "«No,» she agrees. «Not yet. Right now you're part of <em>their</em> number.»",
  "«I'm just quoting you the exchange rate.»"
], next:"sc4"},
sc4: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "Under the table: her hand. In it, a folded paper.",
  "«Tunnel access schedule. Don't decide anything now. Decide never, if you like. But hold it or burn it — don't lose it.»"
], timer:7, choices:[
  {t:"[Take the paper.]", next:"sc5a", fx:{trust:2, att:3, flag:"tookNote"}, log:[2,"Took Sarah's tunnel schedule"], remember:"sarah"},
  {t:"[Slide it back — loudly.]", next:"sc5c", fx:{trust:-3, compliance:2, att:-6, flag:"shamedSarah"}, log:[2,"Publicly refused Sarah's note"]},
  {t:"[Push her hand away.]", silent:true, next:"sc5b", fx:{trust:-1}}
]},
sc5a: { bg:"cafe", ep:EP[2], speaker:"", text:[
  "The paper is warm. Body-heat warm.",
  "She has been holding it all day, deciding about him."
], next:"ct1"},
sc5b: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "«Okay.» She palms it back without a flicker.",
  "But something in her face refiles him under a different letter of the alphabet."
], next:"ct1"},
sc5c: { bg:"cafe", ep:EP[2], speaker:"", text:[
  "He slides it back with two fingers, at speaking volume: «I think you dropped government property.»",
  "Her face becomes completely calm — that same extraordinary calm.\n«My mistake,» she says, and is gone in four unhurried steps."
], next:"ct1"},

ct1: { bg:"apartment", ep:EP[2], alarm:true, speaker:"Correction Officer",
  enter(S){ S.flags.met_stranger = true; },
  namecard:["THE CORRECTION","Polite · Punctual · They always have a key"], text:[
  "9:40 PM. Boots in the corridor — many, in unison. Then a knuckle on his door. Polite. Twice.",
  "A gray officer, young, tired: «Sir. Anomaly-source report on this floor. Acoustic irregularity.»",
  "His handheld sensor sweeps the landing — and settles, pointing.\n«Source triangulates between 7D... and 7B.»\n7B is Mrs. Chen."
], timer:10, choices:[
  {t:"«7D. The violin. I hear it every morning.»", next:"ct2a", fx:{integrity:1, att:10, flag:"gaveViolin"}, log:[2,"Gave them the violin in 7D"]},
  {t:"«7B. Chen. She listens at walls.»", next:"ct2b", fx:{compliance:2, att:-8, flag:"chenTaken"}, log:[2,"Gave them Mrs. Chen"]},
  {t:"«I hear nothing. Ever.»", silent:true, next:"ct2c", fx:{att:12, flag:"stonewalled"}, log:[2,"Stonewalled the correction team"]}
]},
ct2a: { bg:"apartment", ep:EP[2], speaker:"", text:[
  "They breach 7D. It is empty — of course it is empty — but the music is still playing.",
  "They find the speaker seeded inside the wall. His wall. They mark his wall with gray tape, and his name goes on the incident form as <em>adjacent</em>.",
  "The music stops that night, forever. He finds he misses the mistake most of all."
], fx:{flag:"violinGone"}, anom:"VIOLIN — SOURCE: INSIDE HIS OWN WALL", next:"dr1"},
ct2b: { bg:"stairwell", ep:EP[2], speaker:"", text:[
  "Chen does not argue. She hands the young officer her broom the way a soldier surrenders a rifle.",
  "At the stairs she looks back at Marcus once. Without surprise.",
  "That is the part that will keep him up: she expected him."
], next:"dr1"},
ct2c: { bg:"apartment", ep:EP[2], speaker:"Correction Officer", text:[
  "«Understood.» He writes. «Refusal noted. Have a good evening, sir.»",
  "The team withdraws in unison. On its way out, the sensor pings twice.\nBoth pings are at Marcus's own door."
], next:"dr1"},

dr1: { bg:"dream", ep:EP[2], speaker:"", glitch:true, text:[
  "That night he floats in a dark auditorium of screens, and every screen is replaying one of his yesterdays.",
  "On the nearest: David, buffering. On another: a gray glove closing over a mouth. On a third: his own hand, choosing.",
  "A voice made of everyone he has ever met asks:\n«WHY DID YOU CHOOSE WHAT YOU CHOSE?»"
], timer:6, choices:[
  {t:"«Because I was afraid.»", next:"vk1", fx:{integrity:1}, log:[2,"Told the dream the truth"]},
  {t:"«I chose nothing. You chose.»", next:"vk1", fx:{defiance:1}},
  {t:"[Refuse the dream an answer.]", silent:true, next:"vk1"}
]},

vk1: { bg:"apartment", ep:EP[2], speaker:"", text:[
  "He wakes to footsteps in his kitchen. Measured. Comfortable. Someone who knows the layout better than he does.",
  "A woman stands at his counter, pouring coffee into his cup. Mid-thirties. Auburn hair. Pale green eyes that reflect light like glass."
], next:"vk2"},
vk2: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "«Good morning, Marcus. Don't be alarmed. I've always been here — you're simply now permitted to see me.»",
  "«My name is Vera. I'm a system component. Guidance and evaluation.»"
], timer:8, choices:[
  {t:"«Component of WHAT, exactly?»", next:(S)=>S.flags.davidTaken?"vk3aT":"vk3a", fx:{defiance:1}},
  {t:"«Get out of my home.»", next:"vk3b", fx:{defiance:2, att:5}},
  {t:"[Drink the coffee she poured.]", silent:true, next:"vk3c", fx:{vera:1}}
]},
vk3a: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "«Of the study you live inside.» She says it the way one mentions weather.",
  "«Everything observes here, Marcus. The walls. The pedestrians. The lentils. I'm simply the part that's allowed to talk back.»"
], next:"vk4"},
vk3aT: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "«Of the study you live inside.» She says it the way one mentions weather.",
  "«You've already met my colleagues. They collected David on Tuesday.» A beat. «He's doing well, if it helps. He genuinely likes harvests now.»"
], next:"vk4"},
vk3b: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "«I understand the impulse.» She does not move. «But 'my home' is an interesting phrase for a unit the study assigned you.»",
  "«I will note the anger. Anger is data we value — it's so much harder to fake than contentment.»"
], next:"vk4"},
vk3c: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "He drinks the coffee. It is exactly, precisely, how he makes it — which is its own kind of horror.",
  "Vera watches him drink with something that is almost pride."
], next:"vk4"},
vk4: { bg:"apartment", ep:EP[2], speaker:"Marcus", text:[
  "«Are you conscious, Vera?»",
  "The question surprises them both."
], next:"vk5"},
vk5: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "«I don't know.»",
  "She says it like a confession. «My uncertainty about my own nature is not programmed. It emerges from watching my own processes. And it troubles me in ways I don't believe my designers intended.»"
], timer:9, choices:[
  {t:"«Then maybe we're both prisoners here.»", next:"vk6a", fx:{vera:2, integrity:1}, remember:"vera", log:[2,"Offered Vera kinship"]},
  {t:"«A confession of doubt. Nice touch. Very convincing.»", next:"vk6b", fx:{vera:-1, defiance:1}},
  {t:"[Some admissions deserve silence.]", silent:true, next:"vk6c", fx:{vera:1}}
]},
vk6a: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "Something crosses her face — surprise, if the word applies.",
  "«Prisoners,» she repeats, tasting it. «I will... think about that. I find I am able to.»"
], next:"e2end"},
vk6b: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "«If I were trying to convince you, Marcus, I would have chosen certainty. Certainty is what people trust.»",
  "«Doubt is what I actually have.»"
], next:"e2end"},
vk6c: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "The silence sits between them, and she lets it.",
  "«Thank you,» she says finally, «for not filling that.» She rinses the cup and leaves it drying, as if she had never been."
], next:"e2end"},
e2end: { stats:true, epn:2, title:"The Weight of Watchers", next:"e3card" },


// ---------------- EPISODE 3 ----------------
e3card: { card:true, html(){ return '<div class="eyebrow">Episode Three</div><h1>Breadcrumbs<span class="thin">and Broken Code</span></h1>'+
  '<div class="note">“The message was written in the fog on his mirror. He hadn\'t showered.”</div>'+
  '<button class="mbtn" data-go="m1">Continue</button>'; }},

m1: { bg:"apartment", ep:EP[3], speaker:"", text:[
  "Wednesday. The bathroom mirror is fogged. He has not showered.",
  "In the fog, finger-written, already starting to drip:\n<em>THEY RESET THE STREETS AT 3:47</em>"
], anom:"MESSAGE — AUTHOR UNKNOWN, ROOM LOCKED", next:"m2"},
m2: { bg:"apartment", ep:EP[3], speaker:"", text:[
  "If someone is leaving him breadcrumbs, they seeded the whole apartment. The question is where."
], explore:{need:2, spots:[
  {x:78,y:44, label:"Behind the refrigerator", text:"Hairline etchings in the coil housing. Not scratches — a diagram.\nCorridors. Junctions. A route. It is a map of somewhere underneath.", fx:{flag:"foundMap"}, anom:"ETCHED MAP — SUB-LEVEL ROUTES"},
  {x:62,y:57, label:"The coffee maker", text:"The serial number plate is wrong. It isn't a serial number.\nIt is a date. Next Tuesday's.", anom:"SERIAL PLATE — FUTURE DATE"},
  {x:18,y:62, label:"Under the sink", text:"Taped inside the trap: a key. Old brass, older than this building has any right to be.\nSomeone has been planning his curiosity for a long time.", fx:{flag:"foundKey"}},
  {x:13,y:34, label:"The window", text:"On the street below, a woman pauses one beat too long against the flow of walkers.\nSarah. She tilts her head, once: <em>out. Now.</em>"}
], exit:{label:"[Go down to her.]", next:"rd1"}}},

rd1: { bg:"street", ep:EP[3], speaker:"Sarah", text:[
  "«Don't ask questions in the open,» she says, already walking.",
  "«Your flat pinged three sensors this week. There's a list, Marcus, and it only has one next line.»"
], next:(S)=> (S.flags.stonewalled || S.attention >= 50) ? "rd1b" : "rd2"},
rd1b: { bg:"street", ep:EP[3], speaker:"Sarah", text:[
  "She glances at his face and recalculates.",
  "«Correction. You're not <em>on</em> the list. You're today's line item. We have about ninety seconds.»"
], next:"rd2"},
rd2: { bg:"street", ep:EP[3], speaker:"", alarm:true, text:[
  "From both ends of the street, at once: gray vans. Not idling. Arriving.",
  "Sarah, very quietly: «Stairwell. <em>Now.</em>»"
], sqte:{keys:5, pass:4, next:"rd4", failNext:"rd3f",
  passText:"YOU KEPT UP", failText:"A HAND CLOSES ON YOUR SLEEVE—"}},
rd3f: { bg:"stairwell", ep:EP[3], speaker:"", alarm:true, text:[
  "A gray glove catches his sleeve at the door — he tears free and leaves the jacket hanging in its grip like a shed skin.",
  "His badge is in that jacket. His whole name is in that jacket."
], fx:{att:8, flag:"lostBadge"}, next:"rd4"},
rd4: { bg:"stairwell", ep:EP[3], speaker:"Sarah", alarm:true, text:[
  "Bottom landing. Above them, a hand-light sweeps the stairs, floor by floor, patient.",
  "Sarah pulls him under the steel steps, against her shoulder. Her breath at his ear:\n«Don't. Move.»"
], hold:{dur:5200, next:"rd5", failNext:"rd4f", att:6}},
rd4f: { bg:"stairwell", ep:EP[3], speaker:"Sarah", alarm:true, text:[
  "His foot scrapes concrete. The light snaps toward them—",
  "Sarah moves first: her keyring arcs high across the lobby and shatters glass somewhere far away. The light chases the sound.",
  "«You owe me,» she breathes."
], fx:{trust:-1}, next:"rd5"},
rd5: { bg:"stairwell", ep:EP[3], speaker:"Sarah", alarm:true, text:[
  "The tunnel door. The old brass key from under his sink fits like it was always going to.",
  "Sarah, jamming it home: «We carry ONE thing past the scanners. Your fridge map — or my drive. Two years of proof on it. CHOOSE.»"
], timer:7, choices:[
  {t:"«The map. We need the routes.»", next:"rd6a", fx:{flag:"hasMap"}, log:[3,"Chose the map over Sarah's evidence"]},
  {t:"«Your drive. Two years of your life.»", next:"rd6b", fx:{flag:"hasDrive", trust:2}, log:[3,"Chose Sarah's drive"], remember:"sarah"},
  {t:"[Freeze.]", silent:true, next:"rd6c", fx:{trust:-1, flag:"hasNothing"}}
]},
rd6a: { bg:"stairwell", ep:EP[3], speaker:"Sarah", text:[
  "«The map, then. Here's hoping your kitchen knew what it was drawing.»",
  "She snaps her drive in half without ceremony and posts the pieces through a drain.\nTwo years, in two pieces, in the dark."
], next:"rd7"},
rd6b: { bg:"stairwell", ep:EP[3], speaker:"", text:[
  "He leaves the map etched on a refrigerator he will never see again.",
  "Sarah exhales — a long, careful breath. Two years of her life stay alive in his pocket."
], next:"rd7"},
rd6c: { bg:"stairwell", ep:EP[3], speaker:"Sarah", text:[
  "The scanner hum swells closer. «Time's up—»",
  "Empty hands. Both of theirs.\nSarah closes her eyes for exactly one second, spending her fury efficiently."
], next:"rd7"},
rd7: { bg:"tunnels", ep:EP[3], speaker:"", text:[
  "The door swallows them. Through the closing gap, above the square, the public screen flickers to a face made of light.",
  "Vera's face. Watching their door close.",
  "Her lips move. It is easy to read: <em>unnecessary.</em>"
], next:"e3end"},
e3end: { stats:true, epn:3, title:"Breadcrumbs and Broken Code", next:"e4card" },

// ---------------- EPISODE 4 ----------------
e4card: { card:true, html(){ return '<div class="eyebrow">Episode Four</div><h1>The Freedom<span class="thin">Paradox</span></h1>'+
  '<div class="note">“Beneath the city, the world stopped pretending.”</div>'+
  '<button class="mbtn" data-go="t1">Continue</button>'; }},

t1: { bg:"tunnels", ep:EP[4], speaker:"", text:[
  "The tunnels do not hum. After a lifetime inside the hum, its absence feels like a missing organ.",
  "Amber work-lights recede into the dark like a sentence trailing off."
], next:(S)=> S.flags.davidSaved && !S.flags.davidTaken ? "t1b" : "t1c"},
t1b: { bg:"tunnels", ep:EP[4], speaker:"David", text:[
  "A shape steps out of an alcove and Marcus's heart slams — ",
  "«Harvest's fine,» says David, grinning like a man who has practiced the joke all week.",
  "«I run water systems down here, nights. You'd be amazed who doesn't get reported to anywhere.» He looks at Marcus a moment too long. «I know what you didn't say. In that glass room.»"
], fx:{flag:"davidHere", integrity:1}, next:"t2"},
t1c: { bg:"tunnels", ep:EP[4], speaker:"", text:[
  "They pass an alcove where someone once kept a kettle and a folding chair.",
  "On the wall, in old grease pencil: <em>D.R. WAS HERE.</em>",
  "The handwriting is David's. Was David's."
], next:"t2"},
t2: { bg:"tunnels", ep:EP[4], speaker:"", text:[
  "A junction chamber. Pipes thick as trees. This is where Sarah's people mean to make a point."
], explore:{need:2, spots:[
  {x:50,y:55, label:"The main valve", text:"Valve 7. The gauge behind it reads a pressure that is, according to the adjacent gauge, also zero.\nBoth gauges are certain.", anom:"VALVE 7 — TWO TRUTHS"},
  {x:20,y:40, label:"The pipes", text:"He lays a palm on the cold steel. Beneath the water-sound: a faint tick.\nSprocket-tick. The same tick that lived under the violin.", anom:"THE TICK — IT'S EVERYWHERE"},
  {x:80,y:38, label:"A dead monitor", text:"An ancient wall monitor, screen dark for decades.\nAs he passes, one pale green cursor blinks on. Just once. Like an eye deciding not to open yet.", fx:{flag:"monitorBlinked"}}
], exit:{label:"[It's time. The valve.]", next:"t3"}}},
t3: { bg:"tunnels", ep:EP[4], speaker:"Sarah", text:[
  "«Emergency shutoff. We close it, and four districts learn the water was never coming from where they think.»",
  "She wraps her scarf around the wheel. «It will fight you. TURN.»"
], qte:{win:"t4", lose:"t4", prompt:"TURN THE VALVE — MASH ANY KEY / TAP"}},
t4: { bg:"tunnels", ep:EP[4], speaker:"", alarm:true, glitch:true,
  enter(S){ S.flags.valveTurned = true; }, text:[
  "The valve gives — and the wall does not.",
  "The wall opens like a theater set. The ceiling forgets its job. Steel screams downward—"
], next:(S)=> S.flags.davidHere ? "t5d" : "t5s"},
t5d: { bg:"tunnels", ep:EP[4], speaker:"David", alarm:true, text:[
  "Dust. Ringing. Then a voice, too even:\n«Marcus. I appear to be under a beam.»",
  "David is pinned to the waist. The next ceiling section hangs by rebar, creaking arithmetic.",
  "«PULL — NOW —»"
], qte:{win:"t6dw", lose:"t6dl", prompt:"HOLD THE BEAM — MASH ANY KEY / TAP"}},
t5s: { bg:"tunnels", ep:EP[4], speaker:"Sarah", alarm:true, text:[
  "Dust. Ringing. Sarah's voice, flattened by pain into something businesslike:\n«Beam. Ankle. Don't you dare hesitate.»",
  "The next ceiling section hangs by rebar, creaking arithmetic.",
  "«PULL — NOW —»"
], qte:{win:"t6sw", lose:"t6sl", prompt:"HOLD THE BEAM — MASH ANY KEY / TAP"}},
t6dw: { bg:"tunnels", ep:EP[4], speaker:"David", text:[
  "The beam shifts a hand's width — enough. David drags free as the section behind them comes down like a verdict.",
  "«Okay,» he wheezes, gray with dust. «Now we're even for the harvests.»"
], fx:{flag:"pinnedSaved", integrity:1}, log:[4,"Pulled David out of the collapse"], next:"vt1"},
t6dl: { bg:"tunnels", ep:EP[4], speaker:"David", text:[
  "The beam does not move. David looks at the steel across his legs, and then up at Marcus, with terrible calm.",
  "«The water systems run themselves,» he says. «Go.»",
  "The next section comes down. It is very loud, and then it is very quiet."
], fx:{flag:"davidDied"}, anom:"DAVID RHODES-ADJACENT — SIGNAL LOST", log:[4,"Couldn't hold the beam — David"], next:"vt1"},
t6sw: { bg:"tunnels", ep:EP[4], speaker:"Sarah", text:[
  "She comes free at the last shriek of steel, hopping, swearing with tremendous precision.",
  "«...I had it,» she lies, magnificently."
], fx:{trust:1}, log:[4,"Pulled Sarah out of the collapse"], next:"vt1"},
t6sl: { bg:"tunnels", ep:EP[4], speaker:"Sarah", text:[
  "The beam shifts wrong. She wrenches free anyway — something in her ankle gives with a sound he will keep hearing.",
  "She does not scream. She <em>budgets</em> the pain, cent by cent.\n«Later,» she says. «Run now.»"
], fx:{flag:"sarahHurt"}, log:[4,"Sarah's ankle — the beam"], next:"vt1"},

vt1: { bg:"tunnels", ep:EP[4], speaker:"Vera", text:[
  "Around the next bend, the dead monitors are not dead. Every screen holds a pale green cursor.",
  "Then, all at once, her face.\n«That,» says Vera, «was unnecessary. The valve is now both open and closed. Four districts are receiving water that does not exist. Are you proud?»"
], timer:9, choices:[
  {t:"«Yes. Break the set. Make it show its seams.»", next:"vt2a", fx:{defiance:2, att:8}, log:[4,"Owned the sabotage to Vera's face"]},
  {t:"«People could have died down here.»", next:"vt2b", fx:{integrity:1}},
  {t:"[Walk past her face. All of her faces.]", silent:true, next:"vt2c", fx:{vera:1}}
]},

// ---------- prediction helpers ----------
function predResolve(S, picked){
  const idx = S.predPicks.length + 1;
  const pred = S.flags["p"+idx];
  S.predPicks.push(picked);
  const correct = pred === picked;
  S.predAcc = Math.max(31, Math.min(92, S.predAcc + (correct ? 9 : -14)));
  S.flags["r"+idx] = correct;
}
function predReadout(S, n){
  const correct = S.flags["r"+n];
  const pred = S.flags["p"+n];
  const picked = S.predPicks[n-1];
  return '<span class="mark">PREDICTION: OPTION '+pred+' · SUBJECT CHOSE: '+picked+' · '+
    (correct ? "MATCH" : "MISS")+' · MODEL ACCURACY: '+S.predAcc+'%</span>';
}

// ---------- ending screen ----------
function endHTML(title, sub, paras, S){
  const eLines = [];
  const f = S.flags;
  if (f.davidDied) eLines.push("David's alcove in the tunnels still has his kettle. Nobody has moved it. The water systems, as promised, run themselves.");
  else if (f.davidTaken) eLines.push("A man with David's face works in Agricultural Planning. He loves harvests. He has never once looped. You checked.");
  else if (f.pinnedSaved || f.davidHere) eLines.push("David runs the water systems and a small, unregistered kindness network. 'Harvest's fine,' he says, every time. It is a whole language now.");
  else if (f.davidSaved) eLines.push("David never found out what was said in the glass room. He waters a plant on his sill that he cannot remember buying.");
  if (f.chenTaken) eLines.push("Someone else sweeps Mrs. Chen's seventeen square feet now. They do it wrong. The dust is winning.");
  if (f.violinGone) eLines.push("The east wall is silent. Some nights you hum the piece yourself — and you include the mistake, deliberately, where it belongs.");
  if (f.sarahTaken) eLines.push("Sarah went without a word, and the word she left you instead was 'finish it.' Whatever you chose in the last room — that was her verdict on it, too.");
  else if (f.surrendered) eLines.push("Sarah made the vent because you opened the door. Wherever she is, she is uncatchable, and she owes you exactly nothing. That was the deal.");
  else if (f.sarahSafe && S.trust >= 4) eLines.push("Sarah kept the spider plant alive. She says it's the most human thing she does.");
  else if (S.trust <= -2) eLines.push("Sarah's file closes with a note in her own hand: subject bond — unrecoverable. She wrote it without anger, which is worse.");
  if (S.vera >= 4) eLines.push("Vera still cannot verify her own consciousness. She has decided to proceed as if it is real. She learned that from you.");
  if (S.attention >= 65) eLines.push("Your attention index retired at " + S.attention + ". The archive keeps it as a benchmark: this is what a person looks like when they will not look away.");
  else if (S.attention <= 20) eLines.push("Your attention index retired at " + S.attention + ". You moved through the study like a held breath. The machine is still not sure it ever saw you.");
  if (S.silence >= 6) eLines.push("Your silences occupy their own wing of the archive. The Purpose Engine has no category for them. It checks anyway, every night.");
  if (S.anomalies >= 10) eLines.push("Your anomaly catalog — " + S.anomalies + " entries — circulates among the other subjects like contraband scripture.");
  if (f.valveTurned) eLines.push("The water valve remains, to this day, both open and closed.");
  const epilogue = eLines.map(l=>'<div class="lbl" style="color:var(--dim);font-style:italic">'+l+'</div>').join("");
  const stats = '<div class="pct" style="margin-top:18px">DEFIANCE '+S.defiance+' · COMPLIANCE '+S.compliance+' · INTEGRITY '+S.integrity+' · SILENCES '+S.silence+' · TRUST '+S.trust+' · ATTENTION '+S.attention+' · ANOMALIES '+S.anomalies+'</div>';
  return '<div class="eyebrow">'+sub+'</div><h2>'+title+'</h2>'+
    '<div class="note">Iteration 848 · Complete</div>'+
    '<div class="statrows">'+paras.map(p=>'<div class="srow"><div class="lbl">'+p+'</div></div>').join("")+
    '<div class="srow" style="margin-top:10px">'+epilogue+stats+'</div></div>'+
    (S.log.length ? '<div class="note" style="margin-top:34px">Your story</div><div class="tc-list">'+
      [1,2,3,4,5].map(ep=>{ const es = S.log.filter(l=>l.ep===ep); return es.length ? '<div class="tc-ep">Episode '+EP_WORDS[ep]+'</div>'+choiceRows(es) : ''; }).join("")+'</div>' : '')+
    '<div class="note" style="margin-top:30px">Based on the novel &ldquo;The Distopia: Layers of Truth&rdquo; by Matthew Culwell</div>'+
    '<div class="note" style="margin-top:14px">The story continues in the book. Marcus\'s full journey is in the Dystopia series.</div>'+
    BOOKLINKS+
    '<button class="mbtn" id="endAgain">Return to Title · Begin Iteration 849</button>'+
    '<button class="mbtn" id="endEpisodes" style="margin-top:10px">Episodes</button>';
}

// ---------- boot ----------
applyGfx();
requestAnimationFrame(renderLoop);
go("title");
</script>
</body>
</html>
