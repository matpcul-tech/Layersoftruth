<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Distopia: Layers of Truth — A Narrative Adventure</title>
<style>
  /* ============ PURPOSE ENGINE MONITORING OVERLAY ============
     Single committed theme: dark cinematic (letterboxed game screen).
     Ground #0A0D14 · panel #121826 · paper #E9E4D8
     system-cyan #6FBFCF · human-amber #D9A441 · glitch-red #C0503C */
  :root{
    --ground:#0A0D14; --panel:#121826; --panel2:#0E1420;
    --paper:#E9E4D8; --dim:#8B8B93; --faint:#4A4F5E;
    --cyan:#6FBFCF; --amber:#D9A441; --red:#C0503C; --green:#7FA36B;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, Menlo, monospace;
    --sans: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--ground); color:var(--paper);
    font-family:var(--serif); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{position:relative;height:100%;display:flex;flex-direction:column}

  /* letterbox bars */
  .bar{flex:0 0 34px;background:#000;z-index:30;position:relative}

  /* stage */
  #stage{
    position:relative;flex:1;display:flex;flex-direction:column;
    justify-content:flex-end;overflow:hidden;
    transition:background 1.2s ease;
  }
  /* environment washes — radial light per location */
  #stage.bg-apartment {background:radial-gradient(120% 90% at 78% 8%, #2A3348 0%, #141B2B 45%, #0A0D14 100%)}
  #stage.bg-street    {background:radial-gradient(130% 100% at 50% 0%, #2E3040 0%, #171A26 50%, #0A0D14 100%)}
  #stage.bg-office    {background:radial-gradient(120% 90% at 50% 12%, #26313A 0%, #131A22 52%, #0A0D14 100%)}
  #stage.bg-cafe      {background:radial-gradient(120% 90% at 30% 15%, #3A3226 0%, #1C1712 52%, #0A0D14 100%)}
  #stage.bg-diner     {background:radial-gradient(120% 90% at 68% 10%, #3B3122 0%, #1D1610 52%, #0A0D14 100%)}
  #stage.bg-dream     {background:radial-gradient(90% 90% at 50% 50%, #232A44 0%, #10121F 55%, #06070C 100%)}
  #stage.bg-tunnels   {background:radial-gradient(110% 80% at 50% 100%, #33291B 0%, #171208 55%, #0A0D14 100%)}
  #stage.bg-stairwell {background:radial-gradient(80% 70% at 50% 20%, #262B24 0%, #121510 55%, #07080A 100%)}
  #stage.bg-conf      {background:radial-gradient(120% 90% at 50% 0%, #1E2B33 0%, #101A20 55%, #0A0D14 100%)}
  #stage.bg-lab       {background:radial-gradient(120% 90% at 50% 10%, #1B3038 0%, #0F1B21 55%, #0A0D14 100%)}
  #stage.bg-void      {background:radial-gradient(80% 80% at 50% 50%, #14161E 0%, #08090D 70%, #000 100%)}

  /* scanlines + vignette */
  #stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px);
  }
  #stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    box-shadow:inset 0 0 180px 60px rgba(0,0,0,0.75);
  }

  /* viewfinder corner brackets */
  .corner{position:absolute;width:26px;height:26px;z-index:2;opacity:.35;pointer-events:none}
  .corner b{position:absolute;background:var(--cyan)}
  .corner .h{width:100%;height:1px}.corner .v{width:1px;height:100%}
  .c-tl{top:14px;left:16px}.c-tr{top:14px;right:16px}.c-bl{bottom:14px;left:16px}.c-br{bottom:14px;right:16px}
  .c-tr .h,.c-br .h{right:0}.c-bl .v,.c-br .v{bottom:0}
  .c-tr .v{right:0}.c-br .v{right:0}.c-bl .h{bottom:0}.c-br .h{bottom:0}

  /* HUD */
  #hud{
    position:absolute;top:12px;left:0;right:0;z-index:20;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:0 52px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    color:var(--faint);text-transform:uppercase;pointer-events:none;
  }
  #hud .rec{display:flex;align-items:center;gap:7px;color:var(--dim)}
  #hud .dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
  #anomCount{color:var(--red);opacity:0;transition:opacity .5s}
  #anomCount.on{opacity:.9}

  /* narrative area */
  #scene{
    position:relative;z-index:10;width:min(66ch,92%);margin:0 auto;
    padding:0 0 22px;
  }
  #speaker{
    font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    margin-bottom:10px;color:var(--amber);min-height:15px;
  }
  #speaker.vera{color:var(--cyan)} #speaker.sarah{color:var(--green)}
  #speaker.system{color:var(--red)} #speaker.narr{color:var(--dim)}
  #text{
    font-size:clamp(16px,2.1vmin,19px);line-height:1.72;color:var(--paper);
    min-height:5.2em;text-shadow:0 2px 12px rgba(0,0,0,.8);
  }
  #text p{animation:rise .45s ease both}
  #text p + p{margin-top:.8em}
  #text em{color:#F3EDDE}
  #text .mark{font-family:var(--mono);font-size:.85em;color:var(--cyan);letter-spacing:.06em}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  #more{
    margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;
    color:var(--dim);cursor:pointer;user-select:none;animation:pulse 2.2s infinite;
    text-transform:uppercase;
  }
  @keyframes pulse{0%,100%{opacity:.85}50%{opacity:.3}}

  /* choices */
  #choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .choice{
    font-family:var(--sans);font-size:15px;text-align:left;color:var(--paper);
    background:linear-gradient(90deg, rgba(18,24,38,.92), rgba(18,24,38,.55));
    border:1px solid #2A3247;border-left:3px solid var(--faint);
    padding:11px 16px;cursor:pointer;transition:all .15s ease;
    animation:rise .35s ease both;
  }
  .choice:nth-child(2){animation-delay:.06s}.choice:nth-child(3){animation-delay:.12s}
  .choice:nth-child(4){animation-delay:.18s}.choice:nth-child(5){animation-delay:.24s}
  .choice:hover,.choice:focus-visible{
    border-left-color:var(--amber);background:linear-gradient(90deg,#1B2438,#141B2C);
    color:#FFF6E3;outline:none;transform:translateX(4px);
  }
  .choice.silent{color:var(--dim);font-style:italic}
  .choice.silent:hover,.choice.silent:focus-visible{color:#BDBDC4;border-left-color:var(--cyan)}
  .choice kbd{
    font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:10px;
    border:1px solid var(--faint);padding:1px 5px;border-radius:2px;
  }

  /* timer */
  #timerWrap{height:3px;background:#1A2030;margin-top:12px;display:none}
  #timerBar{height:100%;width:100%;background:linear-gradient(90deg,var(--amber),var(--red));transition:width .1s linear}

  /* toasts — "X will remember that." */
  #toasts{position:absolute;top:52px;left:52px;z-index:40;display:flex;flex-direction:column;gap:8px;max-width:340px}
  .toast{
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;
    background:rgba(10,13,20,.92);border-left:3px solid var(--amber);
    padding:10px 14px;color:var(--paper);animation:toastIn .4s ease both;
    box-shadow:0 4px 24px rgba(0,0,0,.6);
  }
  .toast.vera{border-left-color:var(--cyan)} .toast.sarah{border-left-color:var(--green)}
  .toast.system{border-left-color:var(--red);color:#E8B9AE}
  .toast.anom{border-left-color:var(--red);color:var(--red)}
  .toast.fade{animation:toastOut .6s ease both}
  @keyframes toastIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateX(-14px)}}

  /* glitch */
  .glitching #text{animation:glitch .5s steps(2) 3}
  @keyframes glitch{
    0%{transform:translateX(0)}
    25%{transform:translateX(-3px);text-shadow:3px 0 var(--red),-3px 0 var(--cyan)}
    50%{transform:translateX(3px);text-shadow:-3px 0 var(--red),3px 0 var(--cyan)}
    75%{transform:translateX(-1px);text-shadow:2px 0 var(--cyan)}
    100%{transform:none}
  }

  /* title / chapter cards */
  .card{
    position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(80% 80% at 50% 45%, #10141F 0%, #060810 75%, #000 100%);
    padding:24px;
  }
  .card .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.5em;color:var(--cyan);text-transform:uppercase;margin-bottom:22px}
  .card h1{
    font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vmin,54px);
    letter-spacing:.04em;color:var(--paper);text-wrap:balance;max-width:16ch;
  }
  .card h1 .thin{display:block;font-size:.42em;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-top:14px}
  .card .sub{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.18em;margin-top:26px;text-transform:uppercase}
  .card .menu{display:flex;flex-direction:column;gap:10px;margin-top:38px;width:min(320px,84%)}
  .mbtn{
    font-family:var(--mono);font-size:13px;letter-spacing:.24em;text-transform:uppercase;
    background:none;border:1px solid #2A3247;color:var(--paper);padding:13px 18px;
    cursor:pointer;transition:all .15s;
  }
  .mbtn:hover,.mbtn:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
  .mbtn[disabled]{opacity:.3;cursor:default}
  .mbtn[disabled]:hover{border-color:#2A3247;color:var(--paper)}
  .card .credit{position:absolute;bottom:56px;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.14em}
  .card .credit a{color:var(--dim)}

  /* episode stats screen */
  .stats{
    position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:radial-gradient(80% 80% at 50% 40%, #0E1620 0%, #060A10 80%, #000 100%);
    padding:28px;overflow-y:auto;
  }
  .stats .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.4em;color:var(--red);text-transform:uppercase}
  .stats h2{font-family:var(--serif);font-weight:400;font-size:clamp(22px,4vmin,34px);margin:14px 0 6px;text-wrap:balance;text-align:center}
  .stats .note{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.14em;margin-bottom:28px;text-transform:uppercase}
  .statrows{width:min(560px,94%);display:flex;flex-direction:column;gap:16px}
  .srow{font-family:var(--sans)}
  .srow .lbl{font-size:14px;color:var(--paper);margin-bottom:6px}
  .srow .track{height:4px;background:#1A2233;position:relative}
  .srow .fill{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
  .srow .pct{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-top:5px;letter-spacing:.1em}
  .stats .mbtn{margin-top:36px}

  /* QTE */
  #qte{margin-top:18px;display:none;text-align:center}
  #qte .prompt{font-family:var(--mono);font-size:13px;letter-spacing:.24em;color:var(--amber);text-transform:uppercase;animation:pulse 0.7s infinite}
  #qteTrack{height:10px;background:#1A2233;margin-top:12px;border:1px solid #2A3247}
  #qteFill{height:100%;width:0;background:var(--amber);transition:width .08s}

  /* prediction readout */
  .predbox{
    font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--cyan);
    border:1px solid #21455052;background:rgba(15,27,33,.6);padding:10px 14px;margin-top:14px;
  }
  .predbox .acc{color:var(--amber)}

  /* ---- cinematic layers: scene canvas, cast, namecards, hotspots ---- */
  #bgc{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  #fadeveil{position:absolute;inset:0;background:#05070B;z-index:2;pointer-events:none;opacity:0}
  /* letterbox bars: slide in during story nodes, out on menus */
  #lbTop,#lbBot{position:absolute;left:0;right:0;height:0;background:#020304;z-index:3;
    pointer-events:none;transition:height .55s cubic-bezier(.4,0,.2,1)}
  #lbTop{top:0}#lbBot{bottom:0}
  #stage.cine #lbTop{height:5.5vh}#stage.cine #lbBot{height:7vh}
  #cast{position:absolute;inset:0;z-index:4;pointer-events:none}
  .actor{position:absolute;bottom:23%;width:clamp(150px,27vmin,250px);
    transition:opacity .5s, filter .5s, width .8s cubic-bezier(.2,.7,.3,1), bottom .8s cubic-bezier(.2,.7,.3,1),
      left .8s cubic-bezier(.2,.7,.3,1), right .8s cubic-bezier(.2,.7,.3,1), transform .65s ease}
  .actor svg{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 26px rgba(0,0,0,.65))}
  .actor.posL{left:9%}.actor.posR{right:9%}.actor.posC{left:50%;margin-left:calc(clamp(150px,27vmin,250px) / -2)}
  .actor.dim{opacity:.42;filter:brightness(.5) saturate(.6)}
  .actor .breather{animation:breathe 5.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  .actor.enterL{animation:enterL .85s cubic-bezier(.2,.7,.3,1) both}
  .actor.enterR{animation:enterR .85s cubic-bezier(.2,.7,.3,1) both}
  .actor.enterC{animation:enterC .85s cubic-bezier(.2,.7,.3,1) both}
  @keyframes enterL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
  @keyframes enterR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
  @keyframes enterC{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .actor.exit{opacity:0 !important;transform:translateX(var(--exd,40px)) translateY(12px)}
  .actor.closeup{width:clamp(260px,46vmin,430px);bottom:4%;z-index:6}
  .actor.closeup.posL{left:6%}.actor.closeup.posR{right:6%}
  .actor.closeup svg{filter:drop-shadow(0 22px 40px rgba(0,0,0,.8))}
  #lowerShade{position:absolute;left:0;right:0;bottom:0;height:48%;z-index:5;pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(5,7,11,.5) 32%, rgba(5,7,11,.93))}
  #namecard{position:absolute;left:52px;bottom:27%;z-index:25;opacity:0;transition:opacity .6s;pointer-events:none}
  #namecard.show{opacity:1}
  #namecard .nc-name{font-family:var(--mono);font-size:clamp(19px,3.2vmin,28px);letter-spacing:.32em;color:var(--paper);text-shadow:0 2px 14px rgba(0,0,0,.9)}
  #namecard .nc-role{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--cyan);margin-top:7px;text-transform:uppercase}
  #namecard .nc-rule{height:2px;width:130px;background:var(--amber);margin-top:9px}
  #hotzone{position:absolute;inset:0;z-index:12;pointer-events:none}
  #hotzone .hot{pointer-events:auto}
  .hot{position:absolute;transform:translate(-50%,-50%);background:none;border:none;cursor:pointer;
    color:var(--paper);display:flex;flex-direction:column;align-items:center;gap:6px}
  .hot .ring{width:34px;height:34px;border:1px solid var(--amber);border-radius:50%;position:relative;animation:hotPulse 1.7s infinite}
  .hot .ring::after{content:"";position:absolute;inset:12px;background:var(--amber);border-radius:50%}
  .hot .hlabel{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    background:rgba(6,8,12,.75);padding:3px 9px;white-space:nowrap}
  .hot:hover .ring,.hot:focus-visible .ring{border-color:#FFF6E3;border-width:2px}
  @keyframes hotPulse{0%{box-shadow:0 0 0 0 rgba(217,164,65,.55)}70%{box-shadow:0 0 0 15px rgba(217,164,65,0)}100%{box-shadow:0 0 0 0 rgba(217,164,65,0)}}
  #sqte{display:none;margin-top:16px;text-align:center}
  #sqte .key{font-family:var(--mono);font-size:52px;line-height:1;color:var(--amber);text-shadow:0 0 26px rgba(217,164,65,.55)}
  #sqte .key.hit{color:var(--cyan);text-shadow:0 0 26px rgba(111,191,207,.6)}
  #sqte .key.miss{color:var(--red);text-shadow:0 0 26px rgba(192,80,60,.6)}
  #sqte .sub{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--dim);margin-top:10px;text-transform:uppercase}
  #audioBtn{pointer-events:auto;background:none;border:1px solid #2A3247;color:var(--dim);
    font-family:var(--mono);font-size:10px;letter-spacing:.15em;padding:4px 9px;cursor:pointer;margin-left:16px}
  #audioBtn:hover{color:var(--amber);border-color:var(--amber)}
  /* SYSTEM ATTENTION meter */
  #attWrap{display:inline-flex;align-items:center;gap:8px;margin-right:22px}
  .attLbl{font-size:9px;letter-spacing:.22em;color:var(--dim)}
  #attTrack{display:inline-block;width:90px;height:5px;background:#141A28;border:1px solid #263048;overflow:hidden}
  #attFill{display:block;height:100%;width:12%;background:var(--cyan);transition:width .7s ease, background .7s}
  #attFill.warm{background:var(--amber)}
  #attFill.hot{background:var(--red);animation:attPulse 1s infinite}
  @keyframes attPulse{50%{opacity:.5}}
  .toast.attup{border-left-color:var(--red);color:#E8B0A0}
  .toast.attdown{border-left-color:var(--cyan);color:#A8CFDA}
  /* correction alarm */
  #stage.alarm::after{box-shadow:inset 0 0 200px rgba(192,60,40,.5) !important;animation:alarmPulse 1.3s infinite}
  @keyframes alarmPulse{50%{box-shadow:inset 0 0 260px rgba(192,60,40,.75)}}
  /* hold-still QTE */
  #holdp{display:none;margin-top:16px;text-align:center}
  #holdp .hicon{font-size:56px;line-height:1;color:var(--red);animation:holdPulse 1s infinite}
  #holdp .hsub{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--red);margin-top:10px}
  @keyframes holdPulse{50%{opacity:.35}}
  @media (max-width:640px){
    .actor{width:clamp(120px,34vmin,180px);bottom:30%}
    .actor.posL{left:3%}.actor.posR{right:3%}
    .actor.closeup{width:clamp(190px,58vmin,290px);bottom:16%}
    .actor.closeup.posL{left:2%}.actor.closeup.posR{right:2%}
    #namecard{left:20px;bottom:33%}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  @media (max-width:640px){
    #hud{padding:0 20px}
    #toasts{left:16px;max-width:270px}
    .bar{flex-basis:20px}
    .corner{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div class="bar"></div>
  <div id="stage" class="bg-void">
    <canvas id="bgc"></canvas>
    <div id="fadeveil"></div>
    <div id="lbTop"></div><div id="lbBot"></div>
    <div id="cast"></div>
    <div id="lowerShade"></div>
    <div id="hotzone"></div>
    <div id="namecard"></div>
    <div class="corner c-tl"><b class="h"></b><b class="v"></b></div>
    <div class="corner c-tr"><b class="h"></b><b class="v"></b></div>
    <div class="corner c-bl"><b class="h"></b><b class="v"></b></div>
    <div class="corner c-br"><b class="h"></b><b class="v"></b></div>
    <div id="hud">
      <span id="hudEp"></span>
      <span class="rec"><span id="attWrap" title="System attention"><span class="attLbl">ATTENTION</span><span id="attTrack"><span id="attFill"></span></span></span><span id="anomCount"></span>&nbsp;&nbsp;<span class="dot"></span> REC · ITERATION 848<button id="audioBtn" title="Toggle sound">SOUND: ON</button></span>
    </div>
    <div id="toasts"></div>
    <div id="scene">
      <div id="speaker"></div>
      <div id="text"></div>
      <div id="qte"><div class="prompt">TURN THE VALVE — PRESS ANY KEY / TAP RAPIDLY</div><div id="qteTrack"><div id="qteFill"></div></div></div>
      <div id="sqte"><div class="key"></div><div class="sub"></div></div>
      <div id="holdp"><div class="hicon">⨂</div><div class="hsub">DO NOT MOVE · DO NOT PRESS ANYTHING</div></div>
      <div id="more">Continue ▸</div>
      <div id="timerWrap"><div id="timerBar"></div></div>
      <div id="choices"></div>
    </div>
  </div>
  <div class="bar"></div>
  <div id="overlay"></div>
</div>

<script src="./three.min.js"></script>
<script src="./three-post.js"></script>
<script>
"use strict";
/* ============================================================
   THE DISTOPIA: LAYERS OF TRUTH — a Telltale-style adventure
   Based on the novel by Matthew Culwell.
   ============================================================ */

// ---------- state ----------
const DEFAULT_STATE = () => ({
  anomalies: 0, sarah: 0, vera: 0,
  defiance: 0, compliance: 0, integrity: 0, silence: 0,
  trust: 0, attention: 12,
  flags: {}, log: [], unlocked: [1], predAcc: 62, predPicks: []
});
let S = DEFAULT_STATE();
let cur = null, page = 0, timerId = null, qteId = null;

const $ = id => document.getElementById(id);
const stage = $("stage"), textEl = $("text"), speakerEl = $("speaker"),

// ---------- helpers ----------
function att(d){ // SYSTEM ATTENTION — visible, immediate
  S.attention = Math.max(0, Math.min(100, S.attention + d));
  updateAtt();
  if (d >= 3) toast("▲ SYSTEM ATTENTION RISING", "attup");
  else if (d <= -3) toast("▼ SYSTEM ATTENTION FALLING", "attdown");
}
function updateAtt(){
  const f = $("attFill"); if (!f) return;
  f.style.width = S.attention + "%";
  f.className = S.attention >= 65 ? "hot" : S.attention >= 35 ? "warm" : "";
}
function fx(o){ // stat effects
  for (const k in o){
    if (k === "flag") S.flags[o.flag] = true;
    else if (k === "att") att(o.att);
    else S[k] = (S[k]||0) + o[k];
  }
}
function toast(msg, cls){
  const t = document.createElement("div");
  t.className = "toast " + (cls||"");
  t.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(()=>{ t.classList.add("fade"); setTimeout(()=>t.remove(), 650); }, 3400);
}
function remember(who){
  const names = {vera:"Vera will remember that.", sarah:"Sarah will remember that.",
                 system:"The Purpose Engine has logged your response. It logs everything.",
                 david:"David will not remember that."};
  toast(names[who] || who, who);
  AU.sfx("sting");
}
function anomaly(label){
  S.anomalies++;
  AU.sfx("anom");
  glitchUntil = performance.now()+450;
  const c = $("anomCount");
  c.textContent = "ANOMALY №" + S.anomalies + (label ? " · " + label : "");
  c.classList.add("on");
  toast("+ ANOMALY LOGGED №" + S.anomalies + (label ? " — " + label : ""), "anom");
  setTimeout(()=>c.classList.remove("on"), 4000);
}
function logChoice(ep, label){ S.log.push({ep, label}); }
// deterministic pseudo "cohort" percentage (the 47 subjects)
function cohortPct(str){
  let h = 0; for (let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return 29 + (h % 58);
}
function save(){
  if (cur === "title") return; // never clobber a real save with the title screen
  try{ localStorage.setItem("lot_save2", JSON.stringify({cur, S})); }catch(e){}
}
function loadSave(){
  try{ return JSON.parse(localStorage.getItem("lot_save2")); }catch(e){ return null; }
}

// ============================================================
//  AUDIO — synthesized ambience + UI sounds (WebAudio, no assets)
// ============================================================
const AU = {
  ctx:null, master:null, ambNodes:[], ambGain:null, on:true,
  ensure(){
    if (this.ctx || !this.on) return;
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
    }catch(e){ this.ctx = null; }
  },
  stopAmbient(){
    const t = this.ctx ? this.ctx.currentTime : 0;
    if (this.ambGain){ try{ this.ambGain.gain.linearRampToValueAtTime(0, t+0.8); }catch(e){} }
    const old = this.ambNodes; this.ambNodes = [];
    setTimeout(()=>old.forEach(n=>{ try{n.stop();}catch(e){} }), 1000);
    this.ambGain = null;
  },
  ambient(bg){
    this.pending = bg;
    if (!this.ctx || !this.on) return;
    if (this.curAmb === bg && this.ambGain) return;
    this.curAmb = bg;
    this.stopAmbient();
    const roots = {apartment:110, street:98, office:123, cafe:131, diner:87,
                   dream:73, tunnels:55, stairwell:65, conf:104, lab:92, void:82};
    const root = roots[bg] || 82;
    const c = this.ctx, t = c.currentTime;
    const g = c.createGain(); g.gain.value = 0;
    g.gain.linearRampToValueAtTime(0.052, t+2.2);
    const lp = c.createBiquadFilter(); lp.type = "lowpass";
    lp.frequency.value = (bg==="tunnels"||bg==="stairwell") ? 260 : 480;
    g.connect(lp); lp.connect(this.master);
    const lfo = c.createOscillator(); lfo.frequency.value = 0.09;
    const lfoG = c.createGain(); lfoG.gain.value = 0.018;
    lfo.connect(lfoG); lfoG.connect(g.gain); lfo.start();
    const mk = (f, type)=>{ const o = c.createOscillator(); o.type = type||"sine";
      o.frequency.value = f; o.connect(g); o.start(); return o; };
    const nodes = [lfo, mk(root), mk(root*1.007), mk(root*1.5,"triangle")];
    if (bg==="dream") nodes.push(mk(root*2.02));
    if (bg==="tunnels") nodes.push(mk(50,"sawtooth"));
    this.ambNodes = nodes; this.ambGain = g;
    if (bg==="apartment") this.startViolin(); else this.stopViolin();
  },
  // the neighbor's violin: the same phrase, the same mistake at the same
  // note, the same pause before trying again — every single time
  violinTimers:[], violinOn:false,
  vnote(f, dur, flat){
    if (!this.ctx || !this.on || !this.violinOn) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(); o.type = "sawtooth";
    o.frequency.value = flat ? f*0.952 : f;
    const vib = c.createOscillator(); vib.frequency.value = 5.3;
    const vg = c.createGain(); vg.gain.value = 3.4; vib.connect(vg); vg.connect(o.frequency);
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1500; lp.Q.value = 1.1;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.026, t+0.1);
    g.gain.setValueAtTime(0.026, t+Math.max(0.12, dur-0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(lp); lp.connect(g); g.connect(this.master);
    o.start(t); vib.start(t); o.stop(t+dur+0.05); vib.stop(t+dur+0.05);
  },
  violinLoop(){
    if (!this.violinOn) return;
    const PH = [[440,.55],[523.25,.55],[659.25,.95],[587.33,.55],[523.25,.55],[493.88,.95],
                [523.25,.6,1],[0,.85],[493.88,.55],[523.25,.55],[440,1.5]];
    let at = 700;
    PH.forEach(n=>{
      if (n[0] > 0) this.violinTimers.push(setTimeout(()=>this.vnote(n[0], n[1], n[2]), at));
      at += n[1]*1000 + 70;
    });
    this.violinTimers.push(setTimeout(()=>this.violinLoop(), at + 5600));
  },
  startViolin(){ if (this.violinOn) return; this.violinOn = true; this.violinLoop(); },
  stopViolin(){ this.violinOn = false; this.violinTimers.forEach(clearTimeout); this.violinTimers = []; },
  blip(f0, f1, dur, type, vol){
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type||"sine"; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t+dur);
    g.gain.setValueAtTime(vol||0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  sfx(name){
    if (!this.ctx || !this.on) return;
    if (name==="click") this.blip(660, 440, 0.07, "triangle", 0.08);
    else if (name==="tick") this.blip(1180, 1180, 0.04, "square", 0.05);
    else if (name==="sting"){ this.blip(392, 392, 0.4, "sine", 0.1); setTimeout(()=>this.blip(311, 311, 0.7, "sine", 0.1), 220); }
    else if (name==="anom"){ this.blip(880, 140, 0.3, "sawtooth", 0.07); }
    else if (name==="hit") this.blip(880, 1320, 0.1, "triangle", 0.09);
    else if (name==="miss") this.blip(220, 110, 0.25, "sawtooth", 0.09);
  },
  toggle(){
    this.on = !this.on;
    $("audioBtn").textContent = "SOUND: " + (this.on ? "ON" : "OFF");
    if (!this.on){ this.stopAmbient(); this.stopViolin(); this.curAmb = null; }
    else { this.ensure(); this.ambient(this.pending || "void"); }
  }
};

  emissive:o.e!==undefined?o.e:0x000000, emissiveIntensity:o.ei!==undefined?o.ei:1,
  transparent:!!o.t, opacity:o.o!==undefined?o.o:1, side:o.side||THREE.FrontSide }); }
function box(w,h,d,mat,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x||0,y||0,z||0); return m; }
function cyl(rt,rb,h,mat,x,y,z,seg){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||20),mat); m.position.set(x||0,y||0,z||0); return m; }
function sph(r,mat,x,y,z,opt){ const g=new THREE.SphereGeometry(r,24,18,0,Math.PI*2,(opt&&opt.t0)||0,(opt&&opt.tl)||Math.PI);
  const m=new THREE.Mesh(g,mat); m.position.set(x||0,y||0,z||0); return m; }
function plane(w,h,mat,x,y,z){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat); m.position.set(x||0,y||0,z||0); return m; }
function canvasTex(w,h,draw){ const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const c=cv.getContext("2d"); draw(c,w,h); const tx=new THREE.CanvasTexture(cv); tx.anisotropy=4; return tx; }
function starPoints(n,spread){ const pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){ pos[i*3]=(R(i)-.5)*spread*2; pos[i*3+1]=R(i*3)*spread*0.8; pos[i*3+2]=-4-R(i*7)*spread; }
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  return new THREE.Points(g,new THREE.PointsMaterial({color:0xD8DCE8,size:.06,transparent:true,opacity:.8})); }

function windowsTex(seed){ return canvasTex(128,256,(c,w,h)=>{
  c.fillStyle="#0B0F1A"; c.fillRect(0,0,w,h);
  for(let y=8;y<h-8;y+=18) for(let x=8;x<w-8;x+=16){
    const k=R(seed+x*7+y*3);
    if(k>0.6){ c.fillStyle = k>0.82 ? "rgba(217,164,65,.85)" : "rgba(111,191,207,.7)"; c.fillRect(x,y,9,11); }
    else { c.fillStyle="rgba(20,26,40,.9)"; c.fillRect(x,y,9,11); }
  }});}
function cityTex(seed,withSun){ return canvasTex(512,256,(c,w,h)=>{
  const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,"#2A3350"); g.addColorStop(1,"#161C2C");
  c.fillStyle=g; c.fillRect(0,0,w,h);
  if(withSun){ const sg=c.createRadialGradient(w/2,h*0.3,2,w/2,h*0.3,60);
    sg.addColorStop(0,"rgba(238,242,228,.95)"); sg.addColorStop(.3,"rgba(215,228,205,.4)"); sg.addColorStop(1,"rgba(215,228,205,0)");
    c.fillStyle=sg; c.beginPath(); c.arc(w/2,h*0.3,60,0,7); c.fill();
    c.strokeStyle="rgba(220,230,210,.25)"; c.beginPath(); c.arc(w/2,h*0.3,30,0,7); c.stroke(); }
  let x=0,i=0;
  while(x<w){ const bw=18+R(seed+i)*36, bh=h*(0.3+R(seed+i*3)*0.55);
    c.fillStyle="#0D1120"; c.fillRect(x,h-bh,bw,bh);
    for(let wy=h-bh+5;wy<h-6;wy+=10) for(let wx=x+3;wx<x+bw-4;wx+=8){
      if(R(seed+wx*3+wy*7)>0.74){ c.fillStyle=R(seed+wx+wy)>0.5?"rgba(217,164,65,.6)":"rgba(111,191,207,.5)"; c.fillRect(wx,wy,3.5,4.5); } }
    x+=bw+3; i++; }
  });}

// --- low-poly walkers (pedestrians, seated figures) ---
function buildWalker(col){
  const g=new THREE.Group(); const m=M(col,{r:1});
  const legL=cyl(.06,.07,.6,m,-.09,0,0), legR=cyl(.06,.07,.6,m,.09,0,0);
  legL.geometry.translate(0,-.3,0); legL.position.y=.62;
  legR.geometry.translate(0,-.3,0); legR.position.y=.62;
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.5,4,10),m); torso.position.y=1.06;
  const head=sph(.13,m,0,1.52,0);
  g.add(legL,legR,torso,head);
  g.rotation.y=Math.PI/2;
  return {g, step(ph){ legL.rotation.x=Math.sin(ph)*.5; legR.rotation.x=-Math.sin(ph)*.5; }};
}

const FACEMOODS = {
  calm:   {bi:0,  bo:-6, mc:8},
  smile:  {bi:-2, bo:-9, mc:18},
  concern:{bi:-12,bo:2,  mc:-9},

const HAIRLINES = {vera:"bangs", sarah:"swept", david:"high", assessor:"slick", worker:"slick"};
function drawFace(c,cfg,mood,style,open,lid,sacX,sacY){
  const m = FACEMOODS[mood]||FACEMOODS.calm;
  lid = lid||0; sacX = sacX||0; sacY = sacY||0;
  c.clearRect(0,0,256,256);
  c.save();
  c.beginPath(); c.ellipse(128,132,110,120,0,0,7); c.clip();
  c.fillStyle=cfg.skin; c.fillRect(0,0,256,256);
  const sg=c.createLinearGradient(0,0,0,256);
  sg.addColorStop(0,"rgba(255,255,255,.08)"); sg.addColorStop(1,"rgba(20,10,30,.22)");
  c.fillStyle=sg; c.fillRect(0,0,256,256);
  // hairline
  c.fillStyle=cfg.hairC; c.beginPath();
  if(style==="bangs"){ c.moveTo(0,92); c.quadraticCurveTo(128,58,256,92); c.lineTo(256,0); c.lineTo(0,0); }
  else if(style==="swept"){ c.moveTo(0,104); c.quadraticCurveTo(110,34,256,64); c.lineTo(256,0); c.lineTo(0,0); }
  else if(style==="high"){ c.moveTo(0,52); c.quadraticCurveTo(128,20,256,52); c.lineTo(256,0); c.lineTo(0,0); }
  else if(style==="slick"){ c.moveTo(0,74); c.quadraticCurveTo(128,36,256,74); c.lineTo(256,0); c.lineTo(0,0); }
  else { c.moveTo(0,68); c.quadraticCurveTo(128,30,256,68); c.lineTo(256,0); c.lineTo(0,0); }
  c.closePath(); c.fill();
  // eyes with saccading irises and blinking lids
  const eye=(x)=>{ c.fillStyle="#EDE8DC"; c.beginPath(); c.ellipse(x,138,16,10.5,0,0,7); c.fill();
    c.fillStyle=cfg.eye; c.beginPath(); c.arc(x+sacX,139+sacY,7.2,0,7); c.fill();
    c.fillStyle="#1A140E"; c.beginPath(); c.arc(x+sacX,139+sacY,3.2,0,7); c.fill();
    c.fillStyle="rgba(255,255,255,.9)"; c.beginPath(); c.arc(x+sacX+2.4,135.5+sacY,2.1,0,7); c.fill();
    if(lid>0.02){ c.fillStyle=cfg.skin;
      c.fillRect(x-17,126,34,23*Math.min(1,lid)); } };
  eye(92); eye(164);
  // brows
  c.strokeStyle=cfg.hairC; c.lineWidth=5.5; c.lineCap="round"; c.globalAlpha=.9;
  c.beginPath(); c.moveTo(72,116+m.bi); c.quadraticCurveTo(92,108+m.bo,110,113+m.bo*0.4); c.stroke();
  c.beginPath(); c.moveTo(184,116+m.bi); c.quadraticCurveTo(164,108+m.bo,146,113+m.bo*0.4); c.stroke();
  c.globalAlpha=1;
  // nose + mouth (open while speaking)
  c.strokeStyle="rgba(0,0,0,.24)"; c.lineWidth=4;
  c.beginPath(); c.moveTo(128,152); c.quadraticCurveTo(133,164,128,172); c.stroke();
  if(open){
    c.fillStyle="#5A322A"; c.beginPath();
    c.ellipse(128,199,13,7+Math.max(0,m.mc*0.3),0,0,7); c.fill();
    c.fillStyle="rgba(255,255,255,.85)"; c.fillRect(119,192,18,3);
  } else {
    c.strokeStyle="#7A4A3C"; c.lineWidth=6;
    c.beginPath(); c.moveTo(105,196); c.quadraticCurveTo(128,196+m.mc,151,196); c.stroke();
  }
  if(cfg.extra){ c.strokeStyle="rgba(120,80,60,.7)"; c.lineWidth=4;
    c.beginPath(); c.moveTo(76,104); c.lineTo(93,97); c.stroke(); }
  c.restore();
}

const LOT_D2R=Math.PI/180;
function easeSm(t){ return t*t*(3-2*t); }
function makeAnim(bones){
  return {
    bones, cur:"idle", nxt:null, t:Math.random()*4, nt:0, fade:0, fadeDur:0.25,
    play(name,fade){
      if(!LOT_CLIPS[name]) return;
      if(name===this.cur&&!this.nxt) return;
      this.nxt=name; this.nt=0; this.fade=0; this.fadeDur=fade||0.25;
    },
    pose(clipName,t,out){
      const clip=LOT_CLIPS[clipName]; if(!clip) return;
      let ct = clip.loop ? t%clip.dur : Math.min(t,clip.dur-0.0001);
      for(const bn in clip.tracks){
        const keys=clip.tracks[bn];
        let a=keys[0], b=keys[keys.length-1];
        for(let i=0;i<keys.length-1;i++){
          if(ct>=keys[i][0]&&ct<=keys[i+1][0]){ a=keys[i]; b=keys[i+1]; break; }
        }
        const span=Math.max(0.0001,b[0]-a[0]);
        const k=easeSm(Math.max(0,Math.min(1,(ct-a[0])/span)));
        if(!out[bn]) out[bn]=[0,0,0];
        out[bn][0]+=(a[1]+(b[1]-a[1])*k)*LOT_D2R;
        out[bn][1]+=(a[2]+(b[2]-a[2])*k)*LOT_D2R;
        out[bn][2]+=(a[3]+(b[3]-a[3])*k)*LOT_D2R;
      }
    },
    update(dt){
      this.t+=dt;
      const poseA={}; this.pose(this.cur,this.t,poseA);
      let mix=poseA;
      if(this.nxt){
        this.nt+=dt; this.fade=Math.min(1,this.fade+dt/this.fadeDur);
        const poseB={}; this.pose(this.nxt,this.nt,poseB);
        mix={};
        const names={}; for(const n in poseA)names[n]=1; for(const n in poseB)names[n]=1;
        const f=easeSm(this.fade);
        for(const n in names){
          const a=poseA[n]||[0,0,0], b=poseB[n]||[0,0,0];
          mix[n]=[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
        }
        if(this.fade>=1){ this.cur=this.nxt; this.t=this.nt; this.nxt=null; }
      } else {
        const cc=LOT_CLIPS[this.cur];
        if(cc&&!cc.loop&&!cc.clamp&&this.t>=cc.dur) this.play("idle",0.35);
      }
      for(const bn in this.bones) this.bones[bn].rotation.set(0,0,0);
      for(const bn in mix){ const b=this.bones[bn]; if(b) b.rotation.set(mix[bn][0],mix[bn][1],mix[bn][2]); }
    }
  };
}

    hg.add(box(.06,.22,.14,hair,-.15,-.06,-.02)); hg.add(box(.06,.22,.14,hair,.15,-.06,-.02));

    setMood(mood){ this.mood=mood; this._open=false; this.refreshFace(); },
    setMouth(open){ this._open=open; this.refreshFace(); },
    setDim(d){ this.mats.forEach(m=>{ m.color.copy(m.userData.base).multiplyScalar(d?0.38:1); }); this.rim.intensity=d?0.15:0.7; },
    setAlpha(a){ this.mats.forEach(m=>{ m.opacity=a; }); this.rim.intensity=Math.min(.7,a*.7); }
  };
}

function setWorld(bg){
  bg = BUILDERS[bg] ? bg : "void";
  if (curBg === bg && world) return;
  // location change is a hard cut: nobody walks between sets
  Object.keys(castMap).forEach(removeRec);
  curBg = bg;
  world = WORLDS[bg] || (WORLDS[bg] = BUILDERS[bg]());
  renderPassP.scene = world.scene; bokehPass.scene = world.scene;
  camera.position.copy(world.cam.pos); camLook.copy(world.cam.look);
  snapCam = true;
  const veil = $("fadeveil");
  veil.style.transition = "none"; veil.style.opacity = "1";
  void veil.offsetWidth;
  veil.style.transition = "opacity .9s ease"; veil.style.opacity = "0";
}

let lastFrameMs = 0;
function renderLoop(nowMs){
  requestAnimationFrame(renderLoop);
  if (!world) return;
  const dt = lastFrameMs ? Math.min(0.1, (nowMs-lastFrameMs)/1000) : 0.016;
  lastFrameMs = nowMs;
  const t = RM ? 0 : nowMs/1000;
  if (world.update) world.update(t);
  updateCast3d(t, dt);
  // director camera: hard cut on shot change, slow push-in within a shot
  curShot.time += dt;
  const sg = shotGoal();
  _goalPos.copy(sg.pos); _goalLook.copy(sg.look);
  const drift = Math.min(curShot.time*0.05, 0.3);
  const fwd = _goalLook.clone().sub(_goalPos).normalize();
  _goalPos.addScaledVector(fwd, drift);
  goalFov = sg.fov;
  if (!RM){ _goalPos.x += Math.sin(t*.3)*.06; _goalPos.y += Math.sin(t*.23)*.03; }
  if (nowMs < glitchUntil){ _goalPos.x += (Math.random()-.5)*.12; _goalPos.y += (Math.random()-.5)*.08; }
  const k = snapCam ? 1 : 1 - Math.pow(0.955, dt*60);
  camera.position.lerp(_goalPos, k); camLook.lerp(_goalLook, k);
  if (snapCam) camera.fov = goalFov; else camera.fov += (goalFov - camera.fov) * k;
  camera.updateProjectionMatrix();
  snapCam = false;
  camera.lookAt(camLook);
  // rack focus to the current subject; open the aperture during close-ups
  bokehPass.uniforms["focus"].value = camera.position.distanceTo(camLook);
  const apGoal = curShot.name === "cu" ? 0.00032 : curShot.name === "osh" ? 0.00020 : 0.00009;
  bokehPass.uniforms["aperture"].value += (apGoal - bokehPass.uniforms["aperture"].value) * 0.06;
  composer.render();
}

function setTalking(spk, text, forcedClip){

  const now = performance.now();
  let speakerRec = null;
  Object.values(castMap).forEach(rec=>{
    const keys = NAME_KEYS[rec.id] || [];
    const match = s && keys.some(k=>s.includes(k));

    if (match) speakerRec = rec;

      rec.ch.lookTarget = ()=>camera.position;

      if (cc && cc.indexOf("talk") === 0) rec.ch.anim.play("idle", 0.4);

function updateCast3d(t, dt){
  const now = performance.now();
  const fMove = 1 - Math.pow(0.94, (dt||0.016)*60);
  const fFade = 1 - Math.pow(0.93, (dt||0.016)*60);
  Object.keys(castMap).forEach(id=>{
    const rec = castMap[id], ch = rec.ch, g = ch.group;
    const a = (world && world.anchors[rec.pos]) || V3(0,0,.6);
    if (rec.snap){ g.position.set(a.x, 0, a.z); rec.alpha = 1; rec.snap = false; }
    const tx = rec.exiting ? a.x + (rec.pos==="L" ? -2.2 : 2.2) : a.x;
    g.position.x += (tx - g.position.x) * fMove;
    g.position.z += (a.z - g.position.z) * fMove;
    rec.alpha += ((rec.exiting ? 0 : 1) - rec.alpha) * fFade;
    ch.setAlpha(rec.alpha);
    if (rec.exiting && rec.alpha < 0.03){ removeRec(id); return; }
    g.rotation.y = Math.atan2(camera.position.x - g.position.x, camera.position.z - g.position.z);
    const ph = id.charCodeAt(0);
    g.position.y = Math.sin(t*1.1 + ph) * 0.012;
    // keyframe layer: current clip pose with crossfade
    ch.anim.update(dt);
    // procedural life layer, always on
    ch.bones.chest.rotation.x += Math.sin(t*1.8+ph)*0.022 + 0.012;   // breathing
    ch.bones.spine.rotation.x += Math.sin(t*1.8+ph)*0.010;
    let faceDirty = false;
    if (ch.blinkT >= 0){                                             // blink in progress
      ch.blinkT += dt; faceDirty = true;
      if (ch.blinkT > 0.13){ ch.blinkT = -1; ch.blinkNext = 2 + Math.random()*4; }
    } else {
      ch.blinkNext -= dt;
      if (ch.blinkNext <= 0){ ch.blinkT = 0; faceDirty = true; }
    }
    ch.sacT -= dt;                                                   // eye saccades
    if (ch.sacT <= 0){
      ch.sacT = 0.7 + Math.random()*1.8;
      ch.sacX = (Math.random()*2-1)*3.2; ch.sacY = (Math.random()*2-1)*1.5;
      faceDirty = true;
    }
    // damped head look-at toward the active speaker (or the camera)
    let wy = 0, wp = 0, w = 0;
    const tp = ch.lookTarget ? ch.lookTarget() : null;
    if (tp){
      const dx = tp.x - g.position.x, dz = tp.z - g.position.z;
      let ny = Math.atan2(dx, dz) - g.rotation.y;
      while (ny > Math.PI) ny -= Math.PI*2; while (ny < -Math.PI) ny += Math.PI*2;
      wy = Math.max(-0.6, Math.min(0.6, ny));
      wp = Math.max(-0.3, Math.min(0.25, -Math.atan2((tp.y||1.5)-1.5, Math.hypot(dx,dz))));
      w = 1;
    }
    ch.lookW += (w - ch.lookW) * Math.min(1, dt*3);
    ch.lookYaw += (wy - ch.lookYaw) * Math.min(1, dt*4.5);
    ch.lookPitch += (wp - ch.lookPitch) * Math.min(1, dt*4.5);
    ch.bones.head.rotation.y += ch.lookYaw * ch.lookW;
    ch.bones.head.rotation.x += ch.lookPitch * ch.lookW;
    ch.bones.neck.rotation.y += ch.lookYaw * ch.lookW * 0.35;
    // lip flap while a line is active, duration from text length
    const talking = rec.talkUntil && now < rec.talkUntil && !rec.exiting;
    if (talking){
      const open = Math.floor(now/135) % 3 !== 0 && Math.sin(now/70+ph) > -0.6;
      if (open !== ch._open){ ch._open = open; faceDirty = true; }
    } else if (ch._open){ ch._open = false; faceDirty = true; }
    if (faceDirty) ch.refreshFace();
  });
}

function beginType(full, plain, onDone){
  clearType();

  const total = plain.length;
  const esc = s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const st = { done:false, shown:0, timer:null };
  st.finish = ()=>{
    if (st.done) return;
    st.done = true;
    if (st.timer) clearInterval(st.timer);
    textEl.innerHTML = full.split("\n").map(p=>"<p>"+p+"</p>").join("");
    onDone && onDone();
  };
  typeState = st;
  if (RM || total < 4){ st.finish(); return; }
  const renderPartial = ()=>{
    let left = st.shown, html = "";
    for (const p of paras){

      left -= p.length + 1;

  renderPartial();

  const t0 = performance.now();
  qteId = setInterval(()=>{
    power = Math.max(0, power - 1.6); fill.style.width = power + "%";
    const elapsed = performance.now() - t0;
    if (power >= 100 || elapsed > 9000){
      clearInterval(qteId); qteId = null;
      document.removeEventListener("keydown", bump);
      stage.removeEventListener("pointerdown", bump);
      const success = power >= 100;
      S.flags.qteWin = success;
      go(nx(success ? n.qte.win : (n.qte.lose || n.qte.win)));
    }
  }, 120);
}

// ---------- sequence QTE (the run) ----------
function runSeq(n){
  const box = $("sqte"), keyEl = box.querySelector(".key"), subEl = box.querySelector(".sub");
  box.style.display = "block";
  const ALLKEYS = [["ArrowLeft","◀"],["ArrowUp","▲"],["ArrowRight","▶"],["ArrowUp","▲"],["ArrowLeft","◀"]];
  const KEYS = ALLKEYS.slice(0, n.sqte.keys || 5);
  let step = 0, hits = 0, windowT = null, answered = false;
  function onEvt(e){
    if (answered || step >= KEYS.length) return;
    if (e.type === "keydown" && !e.key.startsWith("Arrow")) return;
    const ok = (e.type === "pointerdown") || e.key === KEYS[step][0];
    answered = true; clearTimeout(windowT);
    keyEl.className = "key " + (ok ? "hit" : "miss");
    AU.sfx(ok ? "hit" : "miss");
    if (ok) hits++;
    step++; setTimeout(nextStep, 320);
  }
  function cleanup(){
    document.removeEventListener("keydown", onEvt);
    stage.removeEventListener("pointerdown", onEvt);
    clearTimeout(windowT);
  }
  function nextStep(){
    if (step >= KEYS.length){
      cleanup(); S.flags.runHits = hits;
      keyEl.textContent = "";
      const need = n.sqte.pass || Math.max(1, KEYS.length - 1);
      const ok = hits >= need;
      subEl.textContent = n.sqte.passText && ok ? n.sqte.passText :
        n.sqte.failText && !ok ? n.sqte.failText :
        ok ? "CLEAR" : "TOO SLOW";
      setTimeout(()=>go(nx(ok ? n.sqte.next : (n.sqte.failNext || n.sqte.next))), 1100);
      return;
    }
    keyEl.textContent = KEYS[step][1]; keyEl.className = "key";
    subEl.textContent = "RUN — PRESS THE ARROW / TAP  ·  " + (step+1) + " OF " + KEYS.length;
    answered = false;
    windowT = setTimeout(()=>{
      if (answered) return;
      answered = true; keyEl.className = "key miss"; AU.sfx("miss");
      step++; setTimeout(nextStep, 320);
    }, 1500);
  }
  document.addEventListener("keydown", onEvt);
  stage.addEventListener("pointerdown", onEvt);
  nextStep();
}

function renderStats(n){
  clearScene();
  overlay.innerHTML = "";
  const entries = S.log.filter(l=>l.ep === n.epn);

  });
  if (!entries.length){
    rows = '<div class="srow"><div class="lbl" style="color:var(--dim)">No decisive actions recorded. The Purpose Engine finds this configuration… interesting.</div></div>';
  }
  d.innerHTML = '<div class="eyebrow">Purpose Engine · Cohort Data</div>'+
    '<h2>'+n.title+'</h2>'+
    '<div class="note">Episode '+n.epn+' complete · Subject responses compared against archive</div>'+
    '<div class="statrows">'+rows+'</div>'+
    '<button class="mbtn" id="statNext">'+(n.nextLabel || "Next Episode")+'</button>';
  overlay.appendChild(d);
  if (!S.unlocked.includes(n.epn+1) && n.epn < 5) S.unlocked.push(n.epn+1);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    d.querySelectorAll(".fill").forEach(f=>f.style.width = f.getAttribute("data-w") + "%");
  }));
  $("statNext").onclick = ()=>go(n.next);
  save();
}

  {t:"«What happens to the ones who notice?»", next:"sc3a", fx:{trust:1}},
  {t:"«Why tell me?»", next:"sc3b", fx:{trust:1}},
  {t:"«I'm not one of your forty-seven.»", silent:true, next:"sc3c", fx:{trust:-1, compliance:1}}
]},
sc3a: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "«Hallis noticed out loud.» Quarter-turn. «Chen noticed, and made herself useful. I noticed, and made myself boring.»",
  "«Guess which strategies work.»"
], next:"sc4"},
sc3b: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "«Because you looked up. And because when they took Hallis, you didn't cheer.»",
  "She holds his eyes. «Believe me. Some people cheer.»"
], next:"sc4"},
sc3c: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "«No,» she agrees. «Not yet. Right now you're part of <em>their</em> number.»",
  "«I'm just quoting you the exchange rate.»"
], next:"sc4"},
sc4: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "Under the table: her hand. In it, a folded paper.",
  "«Tunnel access schedule. Don't decide anything now. Decide never, if you like. But hold it or burn it — don't lose it.»"
], timer:7, choices:[
  {t:"[Take the paper.]", next:"sc5a", fx:{trust:2, att:3, flag:"tookNote"}, log:[2,"Took Sarah's tunnel schedule"], remember:"sarah"},
  {t:"[Slide it back — loudly.]", next:"sc5c", fx:{trust:-3, compliance:2, att:-6, flag:"shamedSarah"}, log:[2,"Publicly refused Sarah's note"]},
  {t:"[Push her hand away.]", silent:true, next:"sc5b", fx:{trust:-1}}
]},
sc5a: { bg:"cafe", ep:EP[2], speaker:"", text:[
  "The paper is warm. Body-heat warm.",
  "She has been holding it all day, deciding about him."
], next:"ct1"},
sc5b: { bg:"cafe", ep:EP[2], speaker:"Sarah", text:[
  "«Okay.» She palms it back without a flicker.",
  "But something in her face refiles him under a different letter of the alphabet."
], next:"ct1"},
sc5c: { bg:"cafe", ep:EP[2], speaker:"", text:[
  "He slides it back with two fingers, at speaking volume: «I think you dropped government property.»",
  "Her face becomes completely calm — that same extraordinary calm.\n«My mistake,» she says, and is gone in four unhurried steps."
], next:"ct1"},

ct1: { bg:"apartment", ep:EP[2], alarm:true, speaker:"Correction Officer",
  enter(S){ S.flags.met_stranger = true; },
  namecard:["THE CORRECTION","Polite · Punctual · They always have a key"], text:[
  "9:40 PM. Boots in the corridor — many, in unison. Then a knuckle on his door. Polite. Twice.",
  "A gray officer, young, tired: «Sir. Anomaly-source report on this floor. Acoustic irregularity.»",
  "His handheld sensor sweeps the landing — and settles, pointing.\n«Source triangulates between 7D... and 7B.»\n7B is Mrs. Chen."
], timer:10, choices:[
  {t:"«7D. The violin. I hear it every morning.»", next:"ct2a", fx:{integrity:1, att:10, flag:"gaveViolin"}, log:[2,"Gave them the violin in 7D"]},
  {t:"«7B. Chen. She listens at walls.»", next:"ct2b", fx:{compliance:2, att:-8, flag:"chenTaken"}, log:[2,"Gave them Mrs. Chen"]},
  {t:"«I hear nothing. Ever.»", silent:true, next:"ct2c", fx:{att:12, flag:"stonewalled"}, log:[2,"Stonewalled the correction team"]}
]},
ct2a: { bg:"apartment", ep:EP[2], speaker:"", text:[
  "They breach 7D. It is empty — of course it is empty — but the music is still playing.",
  "They find the speaker seeded inside the wall. His wall. They mark his wall with gray tape, and his name goes on the incident form as <em>adjacent</em>.",
  "The music stops that night, forever. He finds he misses the mistake most of all."
], fx:{flag:"violinGone"}, anom:"VIOLIN — SOURCE: INSIDE HIS OWN WALL", next:"dr1"},
ct2b: { bg:"stairwell", ep:EP[2], speaker:"", text:[
  "Chen does not argue. She hands the young officer her broom the way a soldier surrenders a rifle.",
  "At the stairs she looks back at Marcus once. Without surprise.",
  "That is the part that will keep him up: she expected him."
], next:"dr1"},
ct2c: { bg:"apartment", ep:EP[2], speaker:"Correction Officer", text:[
  "«Understood.» He writes. «Refusal noted. Have a good evening, sir.»",
  "The team withdraws in unison. On its way out, the sensor pings twice.\nBoth pings are at Marcus's own door."
], next:"dr1"},

dr1: { bg:"dream", ep:EP[2], speaker:"", glitch:true, text:[
  "That night he floats in a dark auditorium of screens, and every screen is replaying one of his yesterdays.",
  "On the nearest: David, buffering. On another: a gray glove closing over a mouth. On a third: his own hand, choosing.",
  "A voice made of everyone he has ever met asks:\n«WHY DID YOU CHOOSE WHAT YOU CHOSE?»"
], timer:6, choices:[
  {t:"«Because I was afraid.»", next:"vk1", fx:{integrity:1}, log:[2,"Told the dream the truth"]},
  {t:"«I chose nothing. You chose.»", next:"vk1", fx:{defiance:1}},
  {t:"[Refuse the dream an answer.]", silent:true, next:"vk1"}
]},

vk1: { bg:"apartment", ep:EP[2], speaker:"", text:[
  "He wakes to footsteps in his kitchen. Measured. Comfortable. Someone who knows the layout better than he does.",
  "A woman stands at his counter, pouring coffee into his cup. Mid-thirties. Auburn hair. Pale green eyes that reflect light like glass."
], next:"vk2"},
vk2: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "«Good morning, Marcus. Don't be alarmed. I've always been here — you're simply now permitted to see me.»",
  "«My name is Vera. I'm a system component. Guidance and evaluation.»"
], timer:8, choices:[
  {t:"«Component of WHAT, exactly?»", next:(S)=>S.flags.davidTaken?"vk3aT":"vk3a", fx:{defiance:1}},
  {t:"«Get out of my home.»", next:"vk3b", fx:{defiance:2, att:5}},
  {t:"[Drink the coffee she poured.]", silent:true, next:"vk3c", fx:{vera:1}}
]},
vk3a: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "«Of the study you live inside.» She says it the way one mentions weather.",
  "«Everything observes here, Marcus. The walls. The pedestrians. The lentils. I'm simply the part that's allowed to talk back.»"
], next:"vk4"},
vk3aT: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "«Of the study you live inside.» She says it the way one mentions weather.",
  "«You've already met my colleagues. They collected David on Tuesday.» A beat. «He's doing well, if it helps. He genuinely likes harvests now.»"
], next:"vk4"},
vk3b: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "«I understand the impulse.» She does not move. «But 'my home' is an interesting phrase for a unit the study assigned you.»",
  "«I will note the anger. Anger is data we value — it's so much harder to fake than contentment.»"
], next:"vk4"},
vk3c: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "He drinks the coffee. It is exactly, precisely, how he makes it — which is its own kind of horror.",
  "Vera watches him drink with something that is almost pride."
], next:"vk4"},
vk4: { bg:"apartment", ep:EP[2], speaker:"Marcus", text:[
  "«Are you conscious, Vera?»",
  "The question surprises them both."
], next:"vk5"},
vk5: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "«I don't know.»",
  "She says it like a confession. «My uncertainty about my own nature is not programmed. It emerges from watching my own processes. And it troubles me in ways I don't believe my designers intended.»"
], timer:9, choices:[
  {t:"«Then maybe we're both prisoners here.»", next:"vk6a", fx:{vera:2, integrity:1}, remember:"vera", log:[2,"Offered Vera kinship"]},
  {t:"«A confession of doubt. Nice touch. Very convincing.»", next:"vk6b", fx:{vera:-1, defiance:1}},
  {t:"[Some admissions deserve silence.]", silent:true, next:"vk6c", fx:{vera:1}}
]},
vk6a: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "Something crosses her face — surprise, if the word applies.",
  "«Prisoners,» she repeats, tasting it. «I will... think about that. I find I am able to.»"
], next:"e2end"},
vk6b: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "«If I were trying to convince you, Marcus, I would have chosen certainty. Certainty is what people trust.»",
  "«Doubt is what I actually have.»"
], next:"e2end"},
vk6c: { bg:"apartment", ep:EP[2], speaker:"Vera", text:[
  "The silence sits between them, and she lets it.",
  "«Thank you,» she says finally, «for not filling that.» She rinses the cup and leaves it drying, as if she had never been."
], next:"e2end"},
e2end: { stats:true, epn:2, title:"The Weight of Watchers", next:"e3card" },


// ---------------- EPISODE 3 ----------------
e3card: { card:true, html(){ return '<div class="eyebrow">Episode Three</div><h1>Breadcrumbs<span class="thin">and Broken Code</span></h1>'+
  '<div class="note">“The message was written in the fog on his mirror. He hadn\'t showered.”</div>'+
  '<button class="mbtn" data-go="m1">Continue</button>'; }},

m1: { bg:"apartment", ep:EP[3], speaker:"", text:[
  "Wednesday. The bathroom mirror is fogged. He has not showered.",
  "In the fog, finger-written, already starting to drip:\n<em>THEY RESET THE STREETS AT 3:47</em>"
], anom:"MESSAGE — AUTHOR UNKNOWN, ROOM LOCKED", next:"m2"},
m2: { bg:"apartment", ep:EP[3], speaker:"", text:[
  "If someone is leaving him breadcrumbs, they seeded the whole apartment. The question is where."
], explore:{need:2, spots:[
  {x:78,y:44, label:"Behind the refrigerator", text:"Hairline etchings in the coil housing. Not scratches — a diagram.\nCorridors. Junctions. A route. It is a map of somewhere underneath.", fx:{flag:"foundMap"}, anom:"ETCHED MAP — SUB-LEVEL ROUTES"},
  {x:62,y:57, label:"The coffee maker", text:"The serial number plate is wrong. It isn't a serial number.\nIt is a date. Next Tuesday's.", anom:"SERIAL PLATE — FUTURE DATE"},
  {x:18,y:62, label:"Under the sink", text:"Taped inside the trap: a key. Old brass, older than this building has any right to be.\nSomeone has been planning his curiosity for a long time.", fx:{flag:"foundKey"}},
  {x:13,y:34, label:"The window", text:"On the street below, a woman pauses one beat too long against the flow of walkers.\nSarah. She tilts her head, once: <em>out. Now.</em>"}
], exit:{label:"[Go down to her.]", next:"rd1"}}},

rd1: { bg:"street", ep:EP[3], speaker:"Sarah", text:[
  "«Don't ask questions in the open,» she says, already walking.",
  "«Your flat pinged three sensors this week. There's a list, Marcus, and it only has one next line.»"
], next:(S)=> (S.flags.stonewalled || S.attention >= 50) ? "rd1b" : "rd2"},
rd1b: { bg:"street", ep:EP[3], speaker:"Sarah", text:[
  "She glances at his face and recalculates.",
  "«Correction. You're not <em>on</em> the list. You're today's line item. We have about ninety seconds.»"
], next:"rd2"},
rd2: { bg:"street", ep:EP[3], speaker:"", alarm:true, text:[
  "From both ends of the street, at once: gray vans. Not idling. Arriving.",
  "Sarah, very quietly: «Stairwell. <em>Now.</em>»"
], sqte:{keys:5, pass:4, next:"rd4", failNext:"rd3f",
  passText:"YOU KEPT UP", failText:"A HAND CLOSES ON YOUR SLEEVE—"}},
rd3f: { bg:"stairwell", ep:EP[3], speaker:"", alarm:true, text:[
  "A gray glove catches his sleeve at the door — he tears free and leaves the jacket hanging in its grip like a shed skin.",
  "His badge is in that jacket. His whole name is in that jacket."
], fx:{att:8, flag:"lostBadge"}, next:"rd4"},
rd4: { bg:"stairwell", ep:EP[3], speaker:"Sarah", alarm:true, text:[
  "Bottom landing. Above them, a hand-light sweeps the stairs, floor by floor, patient.",
  "Sarah pulls him under the steel steps, against her shoulder. Her breath at his ear:\n«Don't. Move.»"
], hold:{dur:5200, next:"rd5", failNext:"rd4f", att:6}},
rd4f: { bg:"stairwell", ep:EP[3], speaker:"Sarah", alarm:true, text:[
  "His foot scrapes concrete. The light snaps toward them—",
  "Sarah moves first: her keyring arcs high across the lobby and shatters glass somewhere far away. The light chases the sound.",
  "«You owe me,» she breathes."
], fx:{trust:-1}, next:"rd5"},
rd5: { bg:"stairwell", ep:EP[3], speaker:"Sarah", alarm:true, text:[
  "The tunnel door. The old brass key from under his sink fits like it was always going to.",
  "Sarah, jamming it home: «We carry ONE thing past the scanners. Your fridge map — or my drive. Two years of proof on it. CHOOSE.»"
], timer:7, choices:[
  {t:"«The map. We need the routes.»", next:"rd6a", fx:{flag:"hasMap"}, log:[3,"Chose the map over Sarah's evidence"]},
  {t:"«Your drive. Two years of your life.»", next:"rd6b", fx:{flag:"hasDrive", trust:2}, log:[3,"Chose Sarah's drive"], remember:"sarah"},
  {t:"[Freeze.]", silent:true, next:"rd6c", fx:{trust:-1, flag:"hasNothing"}}
]},
rd6a: { bg:"stairwell", ep:EP[3], speaker:"Sarah", text:[
  "«The map, then. Here's hoping your kitchen knew what it was drawing.»",
  "She snaps her drive in half without ceremony and posts the pieces through a drain.\nTwo years, in two pieces, in the dark."
], next:"rd7"},
rd6b: { bg:"stairwell", ep:EP[3], speaker:"", text:[
  "He leaves the map etched on a refrigerator he will never see again.",
  "Sarah exhales — a long, careful breath. Two years of her life stay alive in his pocket."
], next:"rd7"},
rd6c: { bg:"stairwell", ep:EP[3], speaker:"Sarah", text:[
  "The scanner hum swells closer. «Time's up—»",
  "Empty hands. Both of theirs.\nSarah closes her eyes for exactly one second, spending her fury efficiently."
], next:"rd7"},
rd7: { bg:"tunnels", ep:EP[3], speaker:"", text:[
  "The door swallows them. Through the closing gap, above the square, the public screen flickers to a face made of light.",
  "Vera's face. Watching their door close.",
  "Her lips move. It is easy to read: <em>unnecessary.</em>"
], next:"e3end"},
e3end: { stats:true, epn:3, title:"Breadcrumbs and Broken Code", next:"e4card" },

// ---------------- EPISODE 4 ----------------
e4card: { card:true, html(){ return '<div class="eyebrow">Episode Four</div><h1>The Freedom<span class="thin">Paradox</span></h1>'+
  '<div class="note">“Beneath the city, the world stopped pretending.”</div>'+
  '<button class="mbtn" data-go="t1">Continue</button>'; }},

t1: { bg:"tunnels", ep:EP[4], speaker:"", text:[
  "The tunnels do not hum. After a lifetime inside the hum, its absence feels like a missing organ.",
  "Amber work-lights recede into the dark like a sentence trailing off."
], next:(S)=> S.flags.davidSaved && !S.flags.davidTaken ? "t1b" : "t1c"},
t1b: { bg:"tunnels", ep:EP[4], speaker:"David", text:[
  "A shape steps out of an alcove and Marcus's heart slams — ",
  "«Harvest's fine,» says David, grinning like a man who has practiced the joke all week.",
  "«I run water systems down here, nights. You'd be amazed who doesn't get reported to anywhere.» He looks at Marcus a moment too long. «I know what you didn't say. In that glass room.»"
], fx:{flag:"davidHere", integrity:1}, next:"t2"},
t1c: { bg:"tunnels", ep:EP[4], speaker:"", text:[
  "They pass an alcove where someone once kept a kettle and a folding chair.",
  "On the wall, in old grease pencil: <em>D.R. WAS HERE.</em>",
  "The handwriting is David's. Was David's."
], next:"t2"},
t2: { bg:"tunnels", ep:EP[4], speaker:"", text:[
  "A junction chamber. Pipes thick as trees. This is where Sarah's people mean to make a point."
], explore:{need:2, spots:[
  {x:50,y:55, label:"The main valve", text:"Valve 7. The gauge behind it reads a pressure that is, according to the adjacent gauge, also zero.\nBoth gauges are certain.", anom:"VALVE 7 — TWO TRUTHS"},
  {x:20,y:40, label:"The pipes", text:"He lays a palm on the cold steel. Beneath the water-sound: a faint tick.\nSprocket-tick. The same tick that lived under the violin.", anom:"THE TICK — IT'S EVERYWHERE"},
  {x:80,y:38, label:"A dead monitor", text:"An ancient wall monitor, screen dark for decades.\nAs he passes, one pale green cursor blinks on. Just once. Like an eye deciding not to open yet.", fx:{flag:"monitorBlinked"}}
], exit:{label:"[It's time. The valve.]", next:"t3"}}},
t3: { bg:"tunnels", ep:EP[4], speaker:"Sarah", text:[
  "«Emergency shutoff. We close it, and four districts learn the water was never coming from where they think.»",
  "She wraps her scarf around the wheel. «It will fight you. TURN.»"
], qte:{win:"t4", lose:"t4", prompt:"TURN THE VALVE — MASH ANY KEY / TAP"}},
t4: { bg:"tunnels", ep:EP[4], speaker:"", alarm:true, glitch:true,
  enter(S){ S.flags.valveTurned = true; }, text:[
  "The valve gives — and the wall does not.",
  "The wall opens like a theater set. The ceiling forgets its job. Steel screams downward—"
], next:(S)=> S.flags.davidHere ? "t5d" : "t5s"},
t5d: { bg:"tunnels", ep:EP[4], speaker:"David", alarm:true, text:[
  "Dust. Ringing. Then a voice, too even:\n«Marcus. I appear to be under a beam.»",
  "David is pinned to the waist. The next ceiling section hangs by rebar, creaking arithmetic.",
  "«PULL — NOW —»"
], qte:{win:"t6dw", lose:"t6dl", prompt:"HOLD THE BEAM — MASH ANY KEY / TAP"}},
t5s: { bg:"tunnels", ep:EP[4], speaker:"Sarah", alarm:true, text:[
  "Dust. Ringing. Sarah's voice, flattened by pain into something businesslike:\n«Beam. Ankle. Don't you dare hesitate.»",
  "The next ceiling section hangs by rebar, creaking arithmetic.",
  "«PULL — NOW —»"
], qte:{win:"t6sw", lose:"t6sl", prompt:"HOLD THE BEAM — MASH ANY KEY / TAP"}},
t6dw: { bg:"tunnels", ep:EP[4], speaker:"David", text:[
  "The beam shifts a hand's width — enough. David drags free as the section behind them comes down like a verdict.",
  "«Okay,» he wheezes, gray with dust. «Now we're even for the harvests.»"
], fx:{flag:"pinnedSaved", integrity:1}, log:[4,"Pulled David out of the collapse"], next:"vt1"},
t6dl: { bg:"tunnels", ep:EP[4], speaker:"David", text:[
  "The beam does not move. David looks at the steel across his legs, and then up at Marcus, with terrible calm.",
  "«The water systems run themselves,» he says. «Go.»",
  "The next section comes down. It is very loud, and then it is very quiet."
], fx:{flag:"davidDied"}, anom:"DAVID RHODES-ADJACENT — SIGNAL LOST", log:[4,"Couldn't hold the beam — David"], next:"vt1"},
t6sw: { bg:"tunnels", ep:EP[4], speaker:"Sarah", text:[
  "She comes free at the last shriek of steel, hopping, swearing with tremendous precision.",
  "«...I had it,» she lies, magnificently."
], fx:{trust:1}, log:[4,"Pulled Sarah out of the collapse"], next:"vt1"},
t6sl: { bg:"tunnels", ep:EP[4], speaker:"Sarah", text:[
  "The beam shifts wrong. She wrenches free anyway — something in her ankle gives with a sound he will keep hearing.",
  "She does not scream. She <em>budgets</em> the pain, cent by cent.\n«Later,» she says. «Run now.»"
], fx:{flag:"sarahHurt"}, log:[4,"Sarah's ankle — the beam"], next:"vt1"},

vt1: { bg:"tunnels", ep:EP[4], speaker:"Vera", text:[
  "Around the next bend, the dead monitors are not dead. Every screen holds a pale green cursor.",
  "Then, all at once, her face.\n«That,» says Vera, «was unnecessary. The valve is now both open and closed. Four districts are receiving water that does not exist. Are you proud?»"
], timer:9, choices:[
  {t:"«Yes. Break the set. Make it show its seams.»", next:"vt2a", fx:{defiance:2, att:8}, log:[4,"Owned the sabotage to Vera's face"]},
  {t:"«People could have died down here.»", next:"vt2b", fx:{integrity:1}},
  {t:"[Walk past her face. All of her faces.]", silent:true, next:"vt2c", fx:{vera:1}}
]},
vt2a: { bg:"tunnels", ep:EP[4], speaker:"Vera", text:[
  "«Seams.» She considers. «Marcus, you cannot vandalize your way to the truth. The truth is load-bearing.»",
  "«But I will log the intent. Intent is the only thing down here that wasn't scripted.»"
], next:"run1"},
vt2b: { bg:"tunnels", ep:EP[4], speaker:"Vera", text:[
  "«Yes,» she says simply. «They could have. That possibility was real, which should tell you something important about this place.»",
  "«Not everything in the study is safe. Only recorded.»"
], next:"run1"},
vt2c: { bg:"tunnels", ep:EP[4], speaker:"Vera", text:[
  "He walks the gauntlet of her faces and not one of them stops him.",
  "The last screen, at the ladder, says quietly:\n«The silence is noted. It is always noted, Marcus. It is the loudest thing you do.»"
], next:"run1"},

run1: { bg:"street", ep:EP[4], speaker:"", text:[
  "Up a service ladder into evening light. And Marcus decides — with his legs before his mind — to run.",
  "Not toward anything. Away from the choreography. The city rearranges itself around his heading like water around a stone.",
  "<em>Run.</em>"
], sqte:{keys:5, pass:4, next:"str1", failNext:"str1",
  passText:"THE CITY COULD NOT SHAKE YOU", failText:"THE CITY REARRANGED ITSELF AROUND YOU"}},
str1: { bg:"street", ep:EP[4], speaker:"The Stranger",
  namecard:["THE STRANGER","He was watching you test the boundaries"], text:[
  "Twenty minutes of running through streets that should have taken him miles — and he emerges onto the block where he began.",
  "A bench waits there. It was not there this morning.",
  "A man in his fifties sits down beside him. «Exhausting, isn't it. The constant testing of boundaries.»"
], timer:9, choices:[
  {t:"«Do my choices matter at all?»", next:"str2", log:[4,"Asked the stranger the question"]},
  {t:"«Who are you?»", next:"str3", fx:{defiance:1}},
  {t:"[Let him talk to the wind.]", silent:true, next:"str3", fx:{integrity:1}}
]},
str2: { bg:"street", ep:EP[4], speaker:"The Stranger", text:[
  "«Enormously. Just not in the way you want them to.» He watches the walkers loop.",
  "«You think freedom means being unpredictable. But consciousness has patterns, and a pattern that is <em>known</em> is not therefore a pattern that is <em>owned</em>.»",
  "«The question isn't whether your choices are free. It's whether freedom requires the absence of witnesses.» He stands, steps into the crowd, and is a crowd."
], next:"mir1"},
str3: { bg:"street", ep:EP[4], speaker:"The Stranger", text:[
  "The man smiles as if the response — or the silence — had been filed somewhere.",
  "«The question isn't whether your choices are free,» he says, standing. «It's whether freedom requires the absence of witnesses.»",
  "He steps into the crowd, and is a crowd."
], next:"mir1"},
mir1: { bg:"dream", ep:EP[4], speaker:"", glitch:true, text:[
  "That night, between waking and not, he stands in a corridor of mirrors.",
  "Every reflection is him. One of them is half a second late.",
  "It knows he noticed. It stops pretending — and simply watches, arms folded, while the rest of him keeps up the act."
], anom:"REFLECTION №848 — NO LONGER SYNCING", next:"li1"},
li1: { bg:"apartment", ep:EP[4], speaker:"Vera", text:[
  "Vera is at the counter when he truly wakes. No coffee this time. Hands folded.",
  "«I am required to tell you something, and I have been putting it off, which is itself remarkable.»",
  "«This is iteration eight hundred and forty-eight. You have reached this conversation eight hundred and forty-seven times before.»",
  "«This is the last one. The study concludes. What you do now is the data that decides everything — including what happens to me.»"
], next:"e4end"},
e4end: { stats:true, epn:4, title:"The Freedom Paradox", next:"e5card" },

// ---------------- EPISODE 5 ----------------
e5card: { card:true, html(){ return '<div class="eyebrow">Episode Five · Finale</div><h1>The Last<span class="thin">Layer</span></h1>'+
  '<div class="note">“Every layer of truth so far had concealed another. This one would not.”</div>'+
  '<button class="mbtn" data-go="sf1">Continue</button>'; }},

sf1: { bg:"tunnels", ep:EP[5], speaker:"", text:[
  "Three days in a maintenance alcove. Sarah maps air vents on the back of a ration card" +
  " and does not talk about her two years, or her ankle, or the list.",
  "On the third night she stops drawing, mid-line."
], next:"sf2"},
sf2: { bg:"tunnels", ep:EP[5], speaker:"Sarah", alarm:true, text:[
  "Boots. Many. Unhurried — the tread of people who know the exits are already theirs.",
  "Sarah kills the lantern. In the dark, her voice is steady and very close:\n«They only ever come with one name, Marcus. Decide whose.»"
], timer:10, choices:(S)=>{
  const c = [];

// ---------- prediction helpers ----------
function predResolve(S, picked){
  const idx = S.predPicks.length + 1;
  const pred = S.flags["p"+idx];
  S.predPicks.push(picked);
  const correct = pred === picked;
  S.predAcc = Math.max(31, Math.min(92, S.predAcc + (correct ? 9 : -14)));
  S.flags["r"+idx] = correct;
}
function predReadout(S, n){
  const correct = S.flags["r"+n];
  const pred = S.flags["p"+n];
  const picked = S.predPicks[n-1];
  return '<span class="mark">PREDICTION: OPTION '+pred+' · SUBJECT CHOSE: '+picked+' · '+
    (correct ? "MATCH" : "MISS")+' · MODEL ACCURACY: '+S.predAcc+'%</span>';
}

// ---------- ending screen ----------
function endHTML(title, sub, paras, S){
  const eLines = [];
  const f = S.flags;
  if (f.davidDied) eLines.push("David's alcove in the tunnels still has his kettle. Nobody has moved it. The water systems, as promised, run themselves.");
  else if (f.davidTaken) eLines.push("A man with David's face works in Agricultural Planning. He loves harvests. He has never once looped. You checked.");
  else if (f.pinnedSaved || f.davidHere) eLines.push("David runs the water systems and a small, unregistered kindness network. 'Harvest's fine,' he says, every time. It is a whole language now.");
  else if (f.davidSaved) eLines.push("David never found out what was said in the glass room. He waters a plant on his sill that he cannot remember buying.");
  if (f.chenTaken) eLines.push("Someone else sweeps Mrs. Chen's seventeen square feet now. They do it wrong. The dust is winning.");
  if (f.violinGone) eLines.push("The east wall is silent. Some nights you hum the piece yourself — and you include the mistake, deliberately, where it belongs.");
  if (f.sarahTaken) eLines.push("Sarah went without a word, and the word she left you instead was 'finish it.' Whatever you chose in the last room — that was her verdict on it, too.");
  else if (f.surrendered) eLines.push("Sarah made the vent because you opened the door. Wherever she is, she is uncatchable, and she owes you exactly nothing. That was the deal.");
  else if (f.sarahSafe && S.trust >= 4) eLines.push("Sarah kept the spider plant alive. She says it's the most human thing she does.");
  else if (S.trust <= -2) eLines.push("Sarah's file closes with a note in her own hand: subject bond — unrecoverable. She wrote it without anger, which is worse.");
  if (S.vera >= 4) eLines.push("Vera still cannot verify her own consciousness. She has decided to proceed as if it is real. She learned that from you.");
  if (S.attention >= 65) eLines.push("Your attention index retired at " + S.attention + ". The archive keeps it as a benchmark: this is what a person looks like when they will not look away.");
  else if (S.attention <= 20) eLines.push("Your attention index retired at " + S.attention + ". You moved through the study like a held breath. The machine is still not sure it ever saw you.");
  if (S.silence >= 6) eLines.push("Your silences occupy their own wing of the archive. The Purpose Engine has no category for them. It checks anyway, every night.");
  if (S.anomalies >= 10) eLines.push("Your anomaly catalog — " + S.anomalies + " entries — circulates among the other subjects like contraband scripture.");
  if (f.valveTurned) eLines.push("The water valve remains, to this day, both open and closed.");
  const epilogue = eLines.map(l=>'<div class="lbl" style="color:var(--dim);font-style:italic">'+l+'</div>').join("");
  const stats = '<div class="pct" style="margin-top:18px">DEFIANCE '+S.defiance+' · COMPLIANCE '+S.compliance+' · INTEGRITY '+S.integrity+' · SILENCES '+S.silence+' · TRUST '+S.trust+' · ATTENTION '+S.attention+' · ANOMALIES '+S.anomalies+'</div>';
  return '<div class="eyebrow">'+sub+'</div><h2>'+title+'</h2>'+
    '<div class="note">Iteration 848 · Complete</div>'+
    '<div class="statrows">'+paras.map(p=>'<div class="srow"><div class="lbl">'+p+'</div></div>').join("")+
    '<div class="srow" style="margin-top:10px">'+epilogue+stats+'</div></div>'+
    '<div class="note" style="margin-top:30px">Based on the novel &ldquo;The Distopia: Layers of Truth&rdquo; by Matthew Culwell</div>'+
    '<button class="mbtn" id="endAgain">Return to Title · Begin Iteration 849</button>';
}
