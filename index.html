<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Distopia: Layers of Truth — A Narrative Adventure</title>
<style>
  /* ============ PURPOSE ENGINE MONITORING OVERLAY ============
     Single committed theme: dark cinematic (letterboxed game screen).
     Ground #0A0D14 · panel #121826 · paper #E9E4D8
     system-cyan #6FBFCF · human-amber #D9A441 · glitch-red #C0503C */
  :root{
    --ground:#0A0D14; --panel:#121826; --panel2:#0E1420;
    --paper:#E9E4D8; --dim:#8B8B93; --faint:#4A4F5E;
    --cyan:#6FBFCF; --amber:#D9A441; --red:#C0503C; --green:#7FA36B;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, Menlo, monospace;
    --sans: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--ground); color:var(--paper);
    font-family:var(--serif); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{position:relative;height:100%;display:flex;flex-direction:column}

  /* letterbox bars */
  .bar{flex:0 0 34px;background:#000;z-index:30;position:relative}

  /* stage */
  #stage{
    position:relative;flex:1;display:flex;flex-direction:column;
    justify-content:flex-end;overflow:hidden;
    transition:background 1.2s ease;
  }
  /* environment washes — radial light per location */
  #stage.bg-apartment {background:radial-gradient(120% 90% at 78% 8%, #2A3348 0%, #141B2B 45%, #0A0D14 100%)}
  #stage.bg-street    {background:radial-gradient(130% 100% at 50% 0%, #2E3040 0%, #171A26 50%, #0A0D14 100%)}
  #stage.bg-office    {background:radial-gradient(120% 90% at 50% 12%, #26313A 0%, #131A22 52%, #0A0D14 100%)}
  #stage.bg-cafe      {background:radial-gradient(120% 90% at 30% 15%, #3A3226 0%, #1C1712 52%, #0A0D14 100%)}
  #stage.bg-diner     {background:radial-gradient(120% 90% at 68% 10%, #3B3122 0%, #1D1610 52%, #0A0D14 100%)}
  #stage.bg-dream     {background:radial-gradient(90% 90% at 50% 50%, #232A44 0%, #10121F 55%, #06070C 100%)}
  #stage.bg-tunnels   {background:radial-gradient(110% 80% at 50% 100%, #33291B 0%, #171208 55%, #0A0D14 100%)}
  #stage.bg-stairwell {background:radial-gradient(80% 70% at 50% 20%, #262B24 0%, #121510 55%, #07080A 100%)}
  #stage.bg-conf      {background:radial-gradient(120% 90% at 50% 0%, #1E2B33 0%, #101A20 55%, #0A0D14 100%)}
  #stage.bg-lab       {background:radial-gradient(120% 90% at 50% 10%, #1B3038 0%, #0F1B21 55%, #0A0D14 100%)}
  #stage.bg-void      {background:radial-gradient(80% 80% at 50% 50%, #14161E 0%, #08090D 70%, #000 100%)}

  /* scanlines + vignette */
  #stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px);
  }
  #stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    box-shadow:inset 0 0 180px 60px rgba(0,0,0,0.75);
  }

  /* viewfinder corner brackets */
  .corner{position:absolute;width:26px;height:26px;z-index:2;opacity:.35;pointer-events:none}
  .corner b{position:absolute;background:var(--cyan)}
  .corner .h{width:100%;height:1px}.corner .v{width:1px;height:100%}
  .c-tl{top:14px;left:16px}.c-tr{top:14px;right:16px}.c-bl{bottom:14px;left:16px}.c-br{bottom:14px;right:16px}
  .c-tr .h,.c-br .h{right:0}.c-bl .v,.c-br .v{bottom:0}
  .c-tr .v{right:0}.c-br .v{right:0}.c-bl .h{bottom:0}.c-br .h{bottom:0}

  /* HUD */
  #hud{
    position:absolute;top:12px;left:0;right:0;z-index:20;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:0 52px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    color:var(--faint);text-transform:uppercase;pointer-events:none;
  }
  #hud .rec{display:flex;align-items:center;gap:7px;color:var(--dim)}
  #hud .dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
  #anomCount{color:var(--red);opacity:0;transition:opacity .5s}
  #anomCount.on{opacity:.9}

  /* narrative area */
  #scene{
    position:relative;z-index:10;width:min(66ch,92%);margin:0 auto;
    padding:0 0 22px;
  }
  #speaker{
    font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    margin-bottom:10px;color:var(--amber);min-height:15px;
  }
  #speaker.vera{color:var(--cyan)} #speaker.sarah{color:var(--green)}
  #speaker.system{color:var(--red)} #speaker.narr{color:var(--dim)}
  #text{
    font-size:clamp(16px,2.1vmin,19px);line-height:1.72;color:var(--paper);
    min-height:5.2em;text-shadow:0 2px 12px rgba(0,0,0,.8);
  }
  #text p{animation:rise .45s ease both}
  #text p + p{margin-top:.8em}
  #text em{color:#F3EDDE}
  #text .mark{font-family:var(--mono);font-size:.85em;color:var(--cyan);letter-spacing:.06em}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  #more{
    margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;
    color:var(--dim);cursor:pointer;user-select:none;animation:pulse 2.2s infinite;
    text-transform:uppercase;
  }
  @keyframes pulse{0%,100%{opacity:.85}50%{opacity:.3}}

  /* choices */
  #choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .choice{
    font-family:var(--sans);font-size:15px;text-align:left;color:var(--paper);
    background:linear-gradient(90deg, rgba(18,24,38,.92), rgba(18,24,38,.55));
    border:1px solid #2A3247;border-left:3px solid var(--faint);
    padding:11px 16px;cursor:pointer;transition:all .15s ease;
    animation:rise .35s ease both;
  }
  .choice:nth-child(2){animation-delay:.06s}.choice:nth-child(3){animation-delay:.12s}
  .choice:nth-child(4){animation-delay:.18s}.choice:nth-child(5){animation-delay:.24s}
  .choice:hover,.choice:focus-visible{
    border-left-color:var(--amber);background:linear-gradient(90deg,#1B2438,#141B2C);
    color:#FFF6E3;outline:none;transform:translateX(4px);
  }
  .choice.silent{color:var(--dim);font-style:italic}
  .choice.silent:hover,.choice.silent:focus-visible{color:#BDBDC4;border-left-color:var(--cyan)}
  .choice kbd{
    font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:10px;
    border:1px solid var(--faint);padding:1px 5px;border-radius:2px;
  }

  /* timer */
  #timerWrap{height:3px;background:#1A2030;margin-top:12px;display:none}
  #timerBar{height:100%;width:100%;background:linear-gradient(90deg,var(--amber),var(--red));transition:width .1s linear}

  /* toasts — "X will remember that." */
  #toasts{position:absolute;top:52px;left:52px;z-index:40;display:flex;flex-direction:column;gap:8px;max-width:340px}
  .toast{
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;
    background:rgba(10,13,20,.92);border-left:3px solid var(--amber);
    padding:10px 14px;color:var(--paper);animation:toastIn .4s ease both;
    box-shadow:0 4px 24px rgba(0,0,0,.6);
  }
  .toast.vera{border-left-color:var(--cyan)} .toast.sarah{border-left-color:var(--green)}
  .toast.system{border-left-color:var(--red);color:#E8B9AE}
  .toast.anom{border-left-color:var(--red);color:var(--red)}
  .toast.fade{animation:toastOut .6s ease both}
  @keyframes toastIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateX(-14px)}}

  /* glitch */
  .glitching #text{animation:glitch .5s steps(2) 3}
  @keyframes glitch{
    0%{transform:translateX(0)}
    25%{transform:translateX(-3px);text-shadow:3px 0 var(--red),-3px 0 var(--cyan)}
    50%{transform:translateX(3px);text-shadow:-3px 0 var(--red),3px 0 var(--cyan)}
    75%{transform:translateX(-1px);text-shadow:2px 0 var(--cyan)}
    100%{transform:none}
  }

  /* title / chapter cards */
  .card{
    position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(80% 80% at 50% 45%, #10141F 0%, #060810 75%, #000 100%);
    padding:24px;
  }
  .card .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.5em;color:var(--cyan);text-transform:uppercase;margin-bottom:22px}
  .card h1{
    font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vmin,54px);
    letter-spacing:.04em;color:var(--paper);text-wrap:balance;max-width:16ch;
  }
  .card h1 .thin{display:block;font-size:.42em;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-top:14px}
  .card .sub{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.18em;margin-top:26px;text-transform:uppercase}
  .card .menu{display:flex;flex-direction:column;gap:10px;margin-top:38px;width:min(320px,84%)}
  .mbtn{
    font-family:var(--mono);font-size:13px;letter-spacing:.24em;text-transform:uppercase;
    background:none;border:1px solid #2A3247;color:var(--paper);padding:13px 18px;
    cursor:pointer;transition:all .15s;
  }
  .mbtn:hover,.mbtn:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
  .mbtn[disabled]{opacity:.3;cursor:default}
  .mbtn[disabled]:hover{border-color:#2A3247;color:var(--paper)}
  .card .credit{position:absolute;bottom:56px;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.14em}
  .card .credit a{color:var(--dim)}

  /* episode stats screen */
  .stats{
    position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:radial-gradient(80% 80% at 50% 40%, #0E1620 0%, #060A10 80%, #000 100%);
    padding:28px;overflow-y:auto;
  }
  .stats .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.4em;color:var(--red);text-transform:uppercase}
  .stats h2{font-family:var(--serif);font-weight:400;font-size:clamp(22px,4vmin,34px);margin:14px 0 6px;text-wrap:balance;text-align:center}
  .stats .note{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.14em;margin-bottom:28px;text-transform:uppercase}
  .statrows{width:min(560px,94%);display:flex;flex-direction:column;gap:16px}
  .srow{font-family:var(--sans)}
  .srow .lbl{font-size:14px;color:var(--paper);margin-bottom:6px}
  .srow .track{height:4px;background:#1A2233;position:relative}
  .srow .fill{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
  .srow .pct{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-top:5px;letter-spacing:.1em}
  .stats .mbtn{margin-top:36px}

  /* QTE */
  #qte{margin-top:18px;display:none;text-align:center}
  #qte .prompt{font-family:var(--mono);font-size:13px;letter-spacing:.24em;color:var(--amber);text-transform:uppercase;animation:pulse 0.7s infinite}
  #qteTrack{height:10px;background:#1A2233;margin-top:12px;border:1px solid #2A3247}
  #qteFill{height:100%;width:0;background:var(--amber);transition:width .08s}

  /* prediction readout */
  .predbox{
    font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--cyan);
    border:1px solid #21455052;background:rgba(15,27,33,.6);padding:10px 14px;margin-top:14px;
  }
  .predbox .acc{color:var(--amber)}

  /* ---- cinematic layers: scene canvas, cast, namecards, hotspots ---- */
  #bgc{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  #fadeveil{position:absolute;inset:0;background:#05070B;z-index:2;pointer-events:none;opacity:0}
  #cast{position:absolute;inset:0;z-index:4;pointer-events:none}
  .actor{position:absolute;bottom:23%;width:clamp(150px,27vmin,250px);
    transition:opacity .5s, filter .5s, width .8s cubic-bezier(.2,.7,.3,1), bottom .8s cubic-bezier(.2,.7,.3,1),
      left .8s cubic-bezier(.2,.7,.3,1), right .8s cubic-bezier(.2,.7,.3,1), transform .65s ease}
  .actor svg{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 26px rgba(0,0,0,.65))}
  .actor.posL{left:9%}.actor.posR{right:9%}.actor.posC{left:50%;margin-left:calc(clamp(150px,27vmin,250px) / -2)}
  .actor.dim{opacity:.42;filter:brightness(.5) saturate(.6)}
  .actor .breather{animation:breathe 5.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  .actor.enterL{animation:enterL .85s cubic-bezier(.2,.7,.3,1) both}
  .actor.enterR{animation:enterR .85s cubic-bezier(.2,.7,.3,1) both}
  .actor.enterC{animation:enterC .85s cubic-bezier(.2,.7,.3,1) both}
  @keyframes enterL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
  @keyframes enterR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
  @keyframes enterC{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .actor.exit{opacity:0 !important;transform:translateX(var(--exd,40px)) translateY(12px)}
  .actor.closeup{width:clamp(260px,46vmin,430px);bottom:4%;z-index:6}
  .actor.closeup.posL{left:6%}.actor.closeup.posR{right:6%}
  .actor.closeup svg{filter:drop-shadow(0 22px 40px rgba(0,0,0,.8))}
  #lowerShade{position:absolute;left:0;right:0;bottom:0;height:48%;z-index:5;pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(5,7,11,.5) 32%, rgba(5,7,11,.93))}
  #namecard{position:absolute;left:52px;bottom:27%;z-index:25;opacity:0;transition:opacity .6s;pointer-events:none}
  #namecard.show{opacity:1}
  #namecard .nc-name{font-family:var(--mono);font-size:clamp(19px,3.2vmin,28px);letter-spacing:.32em;color:var(--paper);text-shadow:0 2px 14px rgba(0,0,0,.9)}
  #namecard .nc-role{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--cyan);margin-top:7px;text-transform:uppercase}
  #namecard .nc-rule{height:2px;width:130px;background:var(--amber);margin-top:9px}
  #hotzone{position:absolute;inset:0;z-index:12;pointer-events:none}
  #hotzone .hot{pointer-events:auto}
  .hot{position:absolute;transform:translate(-50%,-50%);background:none;border:none;cursor:pointer;
    color:var(--paper);display:flex;flex-direction:column;align-items:center;gap:6px}
  .hot .ring{width:34px;height:34px;border:1px solid var(--amber);border-radius:50%;position:relative;animation:hotPulse 1.7s infinite}
  .hot .ring::after{content:"";position:absolute;inset:12px;background:var(--amber);border-radius:50%}
  .hot .hlabel{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    background:rgba(6,8,12,.75);padding:3px 9px;white-space:nowrap}
  .hot:hover .ring,.hot:focus-visible .ring{border-color:#FFF6E3;border-width:2px}
  @keyframes hotPulse{0%{box-shadow:0 0 0 0 rgba(217,164,65,.55)}70%{box-shadow:0 0 0 15px rgba(217,164,65,0)}100%{box-shadow:0 0 0 0 rgba(217,164,65,0)}}
  #sqte{display:none;margin-top:16px;text-align:center}
  #sqte .key{font-family:var(--mono);font-size:52px;line-height:1;color:var(--amber);text-shadow:0 0 26px rgba(217,164,65,.55)}
  #sqte .key.hit{color:var(--cyan);text-shadow:0 0 26px rgba(111,191,207,.6)}
  #sqte .key.miss{color:var(--red);text-shadow:0 0 26px rgba(192,80,60,.6)}
  #sqte .sub{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--dim);margin-top:10px;text-transform:uppercase}
  #audioBtn{pointer-events:auto;background:none;border:1px solid #2A3247;color:var(--dim);
    font-family:var(--mono);font-size:10px;letter-spacing:.15em;padding:4px 9px;cursor:pointer;margin-left:16px}
  #audioBtn:hover{color:var(--amber);border-color:var(--amber)}
  @media (max-width:640px){
    .actor{width:clamp(120px,34vmin,180px);bottom:30%}
    .actor.posL{left:3%}.actor.posR{right:3%}
    .actor.closeup{width:clamp(190px,58vmin,290px);bottom:16%}
    .actor.closeup.posL{left:2%}.actor.closeup.posR{right:2%}
    #namecard{left:20px;bottom:33%}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  @media (max-width:640px){
    #hud{padding:0 20px}
    #toasts{left:16px;max-width:270px}
    .bar{flex-basis:20px}
    .corner{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div class="bar"></div>
  <div id="stage" class="bg-void">
    <canvas id="bgc"></canvas>
    <div id="fadeveil"></div>
    <div id="cast"></div>
    <div id="lowerShade"></div>
    <div id="hotzone"></div>
    <div id="namecard"></div>
    <div class="corner c-tl"><b class="h"></b><b class="v"></b></div>
    <div class="corner c-tr"><b class="h"></b><b class="v"></b></div>
    <div class="corner c-bl"><b class="h"></b><b class="v"></b></div>
    <div class="corner c-br"><b class="h"></b><b class="v"></b></div>
    <div id="hud">
      <span id="hudEp"></span>
      <span class="rec"><span id="anomCount"></span>&nbsp;&nbsp;<span class="dot"></span> REC · ITERATION 848<button id="audioBtn" title="Toggle sound">SOUND: ON</button></span>
    </div>
    <div id="toasts"></div>
    <div id="scene">
      <div id="speaker"></div>
      <div id="text"></div>
      <div id="qte"><div class="prompt">TURN THE VALVE — PRESS ANY KEY / TAP RAPIDLY</div><div id="qteTrack"><div id="qteFill"></div></div></div>
      <div id="sqte"><div class="key"></div><div class="sub"></div></div>
      <div id="more">Continue ▸</div>
      <div id="timerWrap"><div id="timerBar"></div></div>
      <div id="choices"></div>
    </div>
  </div>
  <div class="bar"></div>
  <div id="overlay"></div>
</div>

<script src="./three.min.js"></script>
<script>
"use strict";
/* ============================================================
   THE DISTOPIA: LAYERS OF TRUTH — a Telltale-style adventure
   Based on the novel by Matthew Culwell.
   ============================================================ */

// ---------- state ----------
const DEFAULT_STATE = () => ({
  anomalies: 0, sarah: 0, vera: 0,
  defiance: 0, compliance: 0, integrity: 0, silence: 0,
  flags: {}, log: [], unlocked: [1], predAcc: 62, predPicks: []
});
let S = DEFAULT_STATE();
let cur = null, page = 0, timerId = null, qteId = null;

const $ = id => document.getElementById(id);
const stage = $("stage"), textEl = $("text"), speakerEl = $("speaker"),
      choicesEl = $("choices"), moreEl = $("more"), overlay = $("overlay"),
      timerWrap = $("timerWrap"), timerBar = $("timerBar");

// ---------- helpers ----------
function fx(o){ // stat effects
  for (const k in o){
    if (k === "flag") S.flags[o.flag] = true;
    else S[k] = (S[k]||0) + o[k];
  }
}
function toast(msg, cls){
  const t = document.createElement("div");
  t.className = "toast " + (cls||"");
  t.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(()=>{ t.classList.add("fade"); setTimeout(()=>t.remove(), 650); }, 3400);
}
function remember(who){
  const names = {vera:"Vera will remember that.", sarah:"Sarah will remember that.",
                 system:"The Purpose Engine has logged your response. It logs everything.",
                 david:"David will not remember that."};
  toast(names[who] || who, who);
  AU.sfx("sting");
}
function anomaly(label){
  S.anomalies++;
  AU.sfx("anom");
  glitchUntil = performance.now()+450;
  const c = $("anomCount");
  c.textContent = "ANOMALY №" + S.anomalies + (label ? " · " + label : "");
  c.classList.add("on");
  toast("+ ANOMALY LOGGED №" + S.anomalies + (label ? " — " + label : ""), "anom");
  setTimeout(()=>c.classList.remove("on"), 4000);
}
function logChoice(ep, label){ S.log.push({ep, label}); }
// deterministic pseudo "cohort" percentage (the 47 subjects)
function cohortPct(str){
  let h = 0; for (let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return 29 + (h % 58);
}
function save(){
  if (cur === "title") return; // never clobber a real save with the title screen
  try{ localStorage.setItem("lot_save", JSON.stringify({cur, S})); }catch(e){}
}
function loadSave(){
  try{ return JSON.parse(localStorage.getItem("lot_save")); }catch(e){ return null; }
}

// ============================================================
//  AUDIO — synthesized ambience + UI sounds (WebAudio, no assets)
// ============================================================
const AU = {
  ctx:null, master:null, ambNodes:[], ambGain:null, on:true,
  ensure(){
    if (this.ctx || !this.on) return;
    try{

  stopAmbient(){
    const t = this.ctx ? this.ctx.currentTime : 0;
    if (this.ambGain){ try{ this.ambGain.gain.linearRampToValueAtTime(0, t+0.8); }catch(e){} }
    const old = this.ambNodes; this.ambNodes = [];
    setTimeout(()=>old.forEach(n=>{ try{n.stop();}catch(e){} }), 1000);
    this.ambGain = null;
  },
  ambient(bg){
    this.pending = bg;
    if (!this.ctx || !this.on) return;
    if (this.curAmb === bg && this.ambGain) return;
    this.curAmb = bg;
    this.stopAmbient();
    const roots = {apartment:110, street:98, office:123, cafe:131, diner:87,
                   dream:73, tunnels:55, stairwell:65, conf:104, lab:92, void:82};
    const root = roots[bg] || 82;
    const c = this.ctx, t = c.currentTime;
    const g = c.createGain(); g.gain.value = 0;
    g.gain.linearRampToValueAtTime(0.052, t+2.2);
    const lp = c.createBiquadFilter(); lp.type = "lowpass";
    lp.frequency.value = (bg==="tunnels"||bg==="stairwell") ? 260 : 480;
    g.connect(lp); lp.connect(this.master);

    const lfoG = c.createGain(); lfoG.gain.value = 0.018;
    lfo.connect(lfoG); lfoG.connect(g.gain); lfo.start();
    const mk = (f, type)=>{ const o = c.createOscillator(); o.type = type||"sine";

    const nodes = [lfo, mk(root), mk(root*1.007), mk(root*1.5,"triangle")];
    if (bg==="dream") nodes.push(mk(root*2.02));

  // the neighbor's violin: the same phrase, the same mistake at the same
  // note, the same pause before trying again — every single time
  violinTimers:[], violinOn:false,
  vnote(f, dur, flat){
    if (!this.ctx || !this.on || !this.violinOn) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(); o.type = "sawtooth";
    o.frequency.value = flat ? f*0.952 : f;
    const vib = c.createOscillator(); vib.frequency.value = 5.3;
    const vg = c.createGain(); vg.gain.value = 3.4; vib.connect(vg); vg.connect(o.frequency);
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1500; lp.Q.value = 1.1;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.026, t+0.1);
    g.gain.setValueAtTime(0.026, t+Math.max(0.12, dur-0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(lp); lp.connect(g); g.connect(this.master);
    o.start(t); vib.start(t); o.stop(t+dur+0.05); vib.stop(t+dur+0.05);
  },
  violinLoop(){
    if (!this.violinOn) return;
    const PH = [[440,.55],[523.25,.55],[659.25,.95],[587.33,.55],[523.25,.55],[493.88,.95],
                [523.25,.6,1],[0,.85],[493.88,.55],[523.25,.55],[440,1.5]];
    let at = 700;
    PH.forEach(n=>{
      if (n[0] > 0) this.violinTimers.push(setTimeout(()=>this.vnote(n[0], n[1], n[2]), at));
      at += n[1]*1000 + 70;
    });
    this.violinTimers.push(setTimeout(()=>this.violinLoop(), at + 5600));
  },
  startViolin(){ if (this.violinOn) return; this.violinOn = true; this.violinLoop(); },
  stopViolin(){ this.violinOn = false; this.violinTimers.forEach(clearTimeout); this.violinTimers = []; },
  blip(f0, f1, dur, type, vol){
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type||"sine"; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t+dur);
    g.gain.setValueAtTime(vol||0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  sfx(name){
    if (!this.ctx || !this.on) return;
    if (name==="click") this.blip(660, 440, 0.07, "triangle", 0.08);
    else if (name==="tick") this.blip(1180, 1180, 0.04, "square", 0.05);
    else if (name==="sting"){ this.blip(392, 392, 0.4, "sine", 0.1); setTimeout(()=>this.blip(311, 311, 0.7, "sine", 0.1), 220); }
    else if (name==="anom"){ this.blip(880, 140, 0.3, "sawtooth", 0.07); }
    else if (name==="hit") this.blip(880, 1320, 0.1, "triangle", 0.09);
    else if (name==="miss") this.blip(220, 110, 0.25, "sawtooth", 0.09);
  },
  toggle(){
    this.on = !this.on;
    $("audioBtn").textContent = "SOUND: " + (this.on ? "ON" : "OFF");
    if (!this.on){ this.stopAmbient(); this.stopViolin(); this.curAmb = null; }
    else { this.ensure(); this.ambient(this.pending || "void"); }
  }
};

function drawFace(c,cfg,mood,style){

function setWorld(bg){
  bg = BUILDERS[bg] ? bg : "void";
  if (curBg === bg && world) return;
  Object.values(castMap).forEach(rec=>{
    if (rec.ch && rec.ch.group.parent) rec.ch.group.parent.remove(rec.ch.group);
  });
  curBg = bg;
  world = WORLDS[bg] || (WORLDS[bg] = BUILDERS[bg]());
  camera.position.copy(world.cam.pos); camLook.copy(world.cam.look);
  snapCam = true;
  Object.values(castMap).forEach(rec=>{
    if (rec.ch){ world.scene.add(rec.ch.group); rec.snap = true; }
  });
  const veil = $("fadeveil");
  veil.style.transition = "none"; veil.style.opacity = "1";
  void veil.offsetWidth;
  veil.style.transition = "opacity .9s ease"; veil.style.opacity = "0";
}

function renderLoop(nowMs){
  requestAnimationFrame(renderLoop);
  if (!world) return;
  const t = RM ? 0 : nowMs/1000;
  if (world.update) world.update(t);
  updateCast3d(t);
  const cu = closeupId && castMap[closeupId] && castMap[closeupId].ch;
  if (cu){
    const p = castMap[closeupId].ch.group.position;
    _goalPos.set(p.x*0.45, 1.62, p.z+1.5);
    _goalLook.set(p.x*0.85, 1.5, p.z);
  } else { _goalPos.copy(world.cam.pos); _goalLook.copy(world.cam.look); }
  if (!RM){ _goalPos.x += Math.sin(t*.3)*.06; _goalPos.y += Math.sin(t*.23)*.03; }
  if (nowMs < glitchUntil){ _goalPos.x += (Math.random()-.5)*.12; _goalPos.y += (Math.random()-.5)*.08; }
  const k = snapCam ? 1 : 0.045;
  camera.position.lerp(_goalPos, k); camLook.lerp(_goalLook, k); snapCam = false;
  camera.lookAt(camLook);
  renderer.render(world.scene, camera);
}

let castMap = {};
function spawnActor(id, pos, mood){
  const ch = buildChar(id);
  const a = (world && world.anchors[pos]) || V3(0,0,.6);
  ch.setMood(mood);
  ch.setAlpha(0);
  ch.group.position.set(a.x + (pos==="L" ? -1.8 : pos==="R" ? 1.8 : 0), 0, a.z);
  if (world) world.scene.add(ch.group);
  return {ch, id, pos, mood, alpha:0, exiting:false, snap:false};
}
function removeRec(id){
  const rec = castMap[id]; if (!rec) return;
  if (rec.ch.group.parent) rec.ch.group.parent.remove(rec.ch.group);
  delete castMap[id];
}
function castClear(){ Object.keys(castMap).forEach(removeRec); closeupId = null; }
function renderCast(nodeId){
  const list = CAST[nodeId] || [];
  const want = {}; list.forEach(e=>{ want[e[0]] = true; });
  Object.keys(castMap).forEach(id=>{
    if (!want[id]) castMap[id].exiting = true;
  });
  list.forEach(([id,pos,mood])=>{
    const rec = castMap[id];
    if (rec && !rec.exiting){
      if (rec.mood !== mood){ rec.ch.setMood(mood); rec.mood = mood; }
      rec.pos = pos;
    } else {
      if (rec) removeRec(id);
      castMap[id] = spawnActor(id, pos, mood);
      if (NAMECARDS[id] && !S.flags["met_"+id]){
        S.flags["met_"+id] = true; showNamecard(NAMECARDS[id]);
      }
    }
  });
}
function updateCast3d(t){
  Object.keys(castMap).forEach(id=>{
    const rec = castMap[id], ch = rec.ch, g = ch.group;
    const a = (world && world.anchors[rec.pos]) || V3(0,0,.6);
    if (rec.snap){ g.position.set(a.x, 0, a.z); rec.alpha = 1; rec.snap = false; }
    const tx = rec.exiting ? a.x + (rec.pos==="L" ? -2.2 : 2.2) : a.x;
    g.position.x += (tx - g.position.x) * 0.06;
    g.position.z += (a.z - g.position.z) * 0.06;
    rec.alpha += ((rec.exiting ? 0 : 1) - rec.alpha) * 0.07;
    ch.setAlpha(rec.alpha);
    if (rec.exiting && rec.alpha < 0.03){ removeRec(id); return; }
    g.rotation.y = Math.atan2(camera.position.x - g.position.x, camera.position.z - g.position.z);
    g.position.y = Math.sin(t*1.1 + id.charCodeAt(0)) * 0.012;
  });
}

// ---------- QTE ----------
function runQTE(n){
  const q = $("qte"); q.style.display = "block";
  let power = 0; const fill = $("qteFill");
  const bump = ()=>{ power = Math.min(100, power + 9); fill.style.width = power + "%"; };
  window.__qteBump = bump;
  document.addEventListener("keydown", bump);
  stage.addEventListener("pointerdown", bump);
  const t0 = performance.now();
  qteId = setInterval(()=>{
    power = Math.max(0, power - 1.6); fill.style.width = power + "%";
    const elapsed = performance.now() - t0;
    if (power >= 100 || elapsed > 9000){
      clearInterval(qteId); qteId = null;
      document.removeEventListener("keydown", bump);
      stage.removeEventListener("pointerdown", bump);
      const success = power >= 100;
      if (success) S.flags.valveTurned = true;
      go(success ? n.qte.win : n.qte.lose);
    }
  }, 120);
}

// ---------- sequence QTE (the run) ----------
function runSeq(n){
  const box = $("sqte"), keyEl = box.querySelector(".key"), subEl = box.querySelector(".sub");
  box.style.display = "block";
  const KEYS = [["ArrowLeft","◀"],["ArrowUp","▲"],["ArrowRight","▶"],["ArrowUp","▲"],["ArrowLeft","◀"]];
  let step = 0, hits = 0, windowT = null, answered = false;
  function onEvt(e){
    if (answered || step >= KEYS.length) return;
    if (e.type === "keydown" && !e.key.startsWith("Arrow")) return;
    const ok = (e.type === "pointerdown") || e.key === KEYS[step][0];
    answered = true; clearTimeout(windowT);
    keyEl.className = "key " + (ok ? "hit" : "miss");
    AU.sfx(ok ? "hit" : "miss");
    if (ok) hits++;
    step++; setTimeout(nextStep, 320);
  }
  function cleanup(){
    document.removeEventListener("keydown", onEvt);
    stage.removeEventListener("pointerdown", onEvt);
    clearTimeout(windowT);
  }
  function nextStep(){
    if (step >= KEYS.length){
      cleanup(); S.flags.runHits = hits;
      keyEl.textContent = "";
      subEl.textContent = hits >= 4 ? "THE CITY COULD NOT SHAKE YOU" : "THE CITY REARRANGED ITSELF AROUND YOU";
      setTimeout(()=>go(n.sqte.next), 1100);
      return;
    }
    keyEl.textContent = KEYS[step][1]; keyEl.className = "key";
    subEl.textContent = "RUN — PRESS THE ARROW / TAP  ·  " + (step+1) + " OF " + KEYS.length;
    answered = false;
    windowT = setTimeout(()=>{
      if (answered) return;
      answered = true; keyEl.className = "key miss"; AU.sfx("miss");
      step++; setTimeout(nextStep, 320);
    }, 1500);
  }
  document.addEventListener("keydown", onEvt);
  stage.addEventListener("pointerdown", onEvt);
  nextStep();
}

    if (moreEl.style.display !== "none" && !overlay.firstChild){ e.preventDefault(); advance(); }
  }
  const i = parseInt(e.key, 10);
  if (i >= 1 && i <= 9 && !overlay.firstChild){
    const btns = choicesEl.querySelectorAll(".choice");
    if (btns[i-1]) btns[i-1].click();
  }
});
stage.addEventListener("click", (e)=>{
  if (e.target.closest(".choice") || e.target.closest(".hot") || e.target.closest("#audioBtn") ||
      overlay.firstChild || qteId || $("sqte").style.display === "block") return;
  advance();
});
// audio boots on first gesture (browser autoplay policy)
function audioKick(){
  AU.ensure();
  if (AU.ctx && AU.ctx.state === "suspended") AU.ctx.resume();
  AU.ambient(curBg);
}
document.addEventListener("pointerdown", audioKick);
document.addEventListener("keydown", audioKick);
$("audioBtn").addEventListener("click", (e)=>{ e.stopPropagation(); AU.toggle(); });

  return '<div class="eyebrow">A Narrative Adventure in Five Episodes</div>'+

// ---------------- EPISODE 1 ----------------
e1card: { card:true, html(){ return '<div class="eyebrow">Episode One</div><h1>Surface Tension</h1>'+
  '<div class="sub">Three days ago, you stepped out of the simulation.<br>The cooperative welcomed you back.</div>'+
  '<div class="menu"><button class="mbtn" data-go="e1s1">Begin</button></div>'; }},

e1s1: { bg:"apartment", ep:EP[1], speaker:"", text:[
  "Marcus opened his eyes to morning light streaming through windows that should not have existed.",
  "The apartment was exactly as he remembered it from the cooperative. Same blue walls, same narrow bed, same desk. But the light was wrong. It came from the east instead of the west, and the shadows fell at angles that violated the building's geometry.",
  "Three days ago, he had stepped through the simulation chamber doors into what Vera called the real world. Now he stood at the window, and something in the street below refused to sit still in his memory."
], choices:[
  {t:"Count the buildings across the street.", anom:"BUILDINGS 17→19", next:"e1s1b",
   fx:{defiance:1}},
  {t:"Press your palm against the glass. Test what's real.", next:"e1s1c", fx:{integrity:1}},
  {t:"It's nothing. You're free now. Get dressed.", next:"e1s2", fx:{compliance:1}, remember:"system"}
]},
e1s1b: { bg:"apartment", ep:EP[1], speaker:"", text:[
  "Seventeen yesterday. Nineteen this morning.",
  "Marcus counted twice more, touching the cold windowsill each time as if the contact could anchor the number. It didn't change. Buildings don't appear overnight. His breath fogged the glass, and for a moment his reflection looked like it was counting too — half a second behind him."
], next:"e1s2"},
e1s1c: { bg:"apartment", ep:EP[1], speaker:"", text:[
  "Cold. Solid. His breath fogged the surface when he exhaled. Every sensation felt right.",
  "That was the word his brain kept producing: <em>right</em>. Right temperature, right texture, right weight of his body against the floor. Perfect — except for the sun rising in the wrong sky."
], next:"e1s2"},

e1s2: { bg:"apartment", ep:EP[1], speaker:"", text:[
  "The hallway outside his apartment stretched in both directions, lined with identical doors. He had walked it countless times. Forty-seven doors on each side, ninety-four total.",
  "He walked toward the elevator, counting out of habit more than intent."
], choices:[
  {t:"Count carefully. Touch every door frame.", next:"e1s2b", anom:"47 LEFT / 98 RIGHT"},
  {t:"Keep walking. Counting doors is how it gets you.", next:"e1s3", fx:{compliance:1}}
]},
e1s2b: { bg:"apartment", ep:EP[1], speaker:"", text:[
  "Forty-seven left-side doors. Ninety-eight right-side doors.",
  "He counted again, slower, fingertips brushing each frame. The numbers did not change. The hallway had grown overnight, adding doors with the same casual impossibility as the buildings across the street.",
  "In the elevator, the floor indicator showed twelve levels instead of ten. Levels seven and nine were missing from the display entirely."
], next:"e1s3"},

e1s3: { bg:"office", ep:EP[1], speaker:"", text:[
  "The lobby was exactly as he expected — except for the reception desk, now positioned on the opposite wall from where it had been yesterday. The receptionist, the same woman with the same practical bun, looked up and smiled with recognition.",
  "“Good morning, Marcus. How was your night?”"
], timer:12, choices:[
  {t:"“Has the reception desk always been on the east wall?”", next:"e1s3b", anom:"DESK RELOCATED · SMILE RESET"},
  {t:"“Fine, thanks.” Play it normal.", next:"e1s4", fx:{compliance:1}},
  {t:"[Say nothing. Watch her face.]", silent:true, next:"e1s3c", fx:{integrity:1}}
]},
e1s3b: { bg:"office", ep:EP[1], speaker:"Receptionist", text:[
  "Her smile faltered for just a moment. A flicker, barely perceptible. Then it returned to full brightness.",
  "“Yes, of course. Since the building was constructed. Is there something you need?”",
  "Her voice carried a new mechanical precision, each word too perfect, like she was reading from a script."
], next:"e1s4"},
e1s3c: { bg:"office", ep:EP[1], speaker:"", text:[
  "He held her gaze and said nothing. One second. Two. Three.",
  "At four seconds her smile flickered — not fading, <em>resetting</em>, like a face wiped clean and reapplied. She was not built for silence. Nothing here was."
], anom:"EXPRESSION RESET UNDER SILENCE", next:"e1s4"},

e1s4: { bg:"cafe", ep:EP[1], speaker:"", text:[
  "The coffee shop where he had eaten breakfast every morning for two years. Same metal tables, same hand-painted sign, same woman behind the counter. But the building's exterior was now painted yellow instead of blue.",
  "“Morning coffee?” the woman asked, with the same mechanical precision as the receptionist."
], timer:12, choices:[
  {t:"“Was this building always yellow?”", next:"e1s4b", anom:"FACADE BLUE→YELLOW"},
  {t:"Take the coffee. It tastes exactly right. That's the problem.", next:"e1s5", fx:{compliance:1}},
  {t:"[Say nothing. Just nod.]", silent:true, next:"e1s5"}
]},
e1s4b: { bg:"cafe", ep:EP[1], speaker:"Counter Woman", text:[
  "Another flicker in her expression. The smile reset itself.",
  "“Yes, always yellow. Cheerful color for morning coffee. The usual?”",
  "He accepted the cup. The coffee tasted exactly right — temperature, flavor, even the slight bitterness he had learned to enjoy. Perfect, except for being impossible."
], next:"e1s5"},

e1s5: { bg:"office", ep:EP[1], speaker:"David", text:[
  "At the resource center, a gray-haired man in cooperative work clothes appeared beside his desk, wearing a smile that had been applied rather than felt.",
  "“I'm David. I work in agricultural planning. We've spoken before about root vegetable allocation.”",
  "Marcus had never worked on root vegetable allocation. His area was manufactured goods. But David's certainty was absolute."
], timer:14, choices:[
  {t:"“Right. How's the harvest looking?” Play along.", next:"e1s5b", fx:{compliance:1},
   log:[1,"Played along with David's script"]},
  {t:"“We've never met, David.”", next:"e1s5c", fx:{defiance:1}, remember:"david",
   log:[1,"Broke David's script to his face"]},
  {t:"[Study his face in silence.]", silent:true, next:"e1s5d", fx:{integrity:1},
   log:[1,"Said nothing and watched David reset"]}
]},
e1s5b: { bg:"office", ep:EP[1], speaker:"David", text:[
  "“Excellent productivity. Optimal growing conditions. All targets will be met.”",
  "The response came too quickly, as if the words were loaded and waiting for the question. Marcus filed it away: response time, inflection, the coffee stain on David's shirt pocket. Tomorrow, he suspected, the stain would be in exactly the same place."
], next:"e1s6"},
e1s5c: { bg:"office", ep:EP[1], speaker:"David", text:[
  "David's smile went blank for half a second — a face wiped clean before a new expression was applied. Reset.",
  "“We've spoken before,” he said, with no memory of the last thirty seconds in his eyes. “About root vegetable allocation. Excellent productivity. Optimal growing conditions. All targets will be met.”",
  "It wasn't conversation. It was playback."
], anom:"DIALOGUE PLAYBACK LOOP", next:"e1s6"},
e1s5d: { bg:"office", ep:EP[1], speaker:"", text:[
  "Marcus said nothing. David held the smile for exactly four seconds, then repeated, unprompted:",
  "“Excellent productivity. Optimal growing conditions. All targets will be met.”",
  "The words had been loaded and waiting. No question had been required after all."
], anom:"UNPROMPTED PLAYBACK", next:"e1s6"},

e1s6: { bg:"street", ep:EP[1], speaker:"", text:[
  "During lunch he sat in the courtyard and watched. Everything looked right. Then something snagged.",
  "Every conversation he could overhear ran exactly thirty-seven words. He counted three times before he believed it. The children's games ran exactly four minutes, then reset. Greeting, negotiation, done — one script xeroxed across the whole courtyard.",
  "At the next table, a woman finished her book, returned to page one, and began reading again. Same speed. Same pattern of page turns."
], anom:"37-WORD CONVERSATIONS", choices:[
  {t:"Keep counting. Build the catalog.", next:"e1s7", fx:{defiance:1}},
  {t:"Ask the woman what her book is about.", next:"e1s6b"},
  {t:"Go back to your desk. You've seen enough.", next:"e1s7", fx:{compliance:1}}
]},
e1s6b: { bg:"street", ep:EP[1], speaker:"Reading Woman", text:[
  "She looked up with pleasant surprise, exactly the right amount of it.",
  "“It's about a man who discovers his whole life is being watched,” she said. “I keep starting it over. The ending never feels finished.”",
  "She returned to page one. Marcus stood very still for a moment, then walked back to his desk without asking anything else."
], anom:"NARRATIVE BLEED-THROUGH", next:"e1s7"},

e1s7: { bg:"office", ep:EP[1], speaker:"", text:[
  "Back at his terminal, Marcus's fingers hovered over commands he had not used since his first reality — system diagnostics, network protocols. Things cooperative citizens never needed.",
  "If he looked, and the system saw him look, there would be no unlooking."
], choices:[
  {t:"Run the diagnostics. You need to know.", next:"e1s7b", fx:{defiance:1, flag:"probed"},
   log:[1,"Probed the network for surveillance"]},
  {t:"Close the terminal. Stay invisible.", next:"e1s8", fx:{compliance:1},
   log:[1,"Chose not to look at the network"]}
]},
e1s7b: { bg:"office", ep:EP[1], speaker:"", text:[
  "The responses came back clean. Normal traffic, standard operations. But buried in the streams were packet sequences flowing to destinations that did not exist, from sources with no activity logs.",
  "And underneath that: the system was logging every keystroke, every mouse movement, every pause between actions. Not just his terminal. <em>Everything.</em> Observation on a scale far beyond cooperative monitoring.",
  "By evening he had compiled a mental list of forty-three anomalies. Collectively, they painted a picture of reality performing itself rather than simply existing."
], anom:"KEYSTROKE-LEVEL SURVEILLANCE", next:"e1s8"},

e1s8: { bg:"office", ep:EP[1], speaker:"Assessor", glitch:true, text:[
  "He returned from a corridor that held no evaluation center to find a woman sitting in his chair. Regulation hair, manufactured pleasantness, eyes that tracked him with surveillance-camera precision. When she blinked, both eyelids moved with identical timing.",
  "“Marcus. I'm here for your productivity assessment.” She gestured to a chair that had not been there moments before.",
  "“Question one. Do you find your assigned work fulfilling and meaningful?”"
], timer:16, choices:[
  {t:"“Yes. Completely.” Give the machine what it wants.", next:"e1s8b", fx:{compliance:2},
   log:[1,"Told the assessor what it wanted to hear"], remember:"system"},
  {t:"“Fulfilling for whom, exactly?”", next:"e1s8c", fx:{defiance:2},
   log:[1,"Turned the assessment question back on the assessor"]},
  {t:"“I know what this is. I know what you are.”", next:"e1s8d", fx:{defiance:1, vera:1},
   log:[1,"Told the assessor: I know what this is"]},
  {t:"[Say nothing.]", silent:true, next:"e1s8e", fx:{integrity:1},
   log:[1,"Answered the assessment with silence"]}
]},
e1s8b: { bg:"office", ep:EP[1], speaker:"Assessor", text:[
  "“Excellent.” She made a note on a tablet that had materialized in her hands. “Your integration metrics are very strong, Marcus. Very strong.”",
  "For one cold moment her eyes stopped tracking him and focused on something just above his head — as if reading a value posted there. Then the smile returned.",
  "“That concludes today's assessment.”"
], next:"e1end"},
e1s8c: { bg:"office", ep:EP[1], speaker:"Assessor", text:[
  "The question landed somewhere it wasn't supposed to. Her pen paused above the tablet. Behind her eyes, something recalculated.",
  "“For the community,” she said, one half-second too late. “All fulfillment serves the community.”",
  "The words were right. The delay wasn't. Marcus smiled pleasantly and gave her nothing else."
], anom:"RESPONSE LATENCY 0.5s", next:"e1end"},
e1s8d: { bg:"office", ep:EP[1], speaker:"Assessor", text:[
  "She did not flicker. She did not reset. For the first time all day, something looked back at him with genuine attention.",
  "“Noted,” she said quietly, and wrote for a long time on the tablet — far more than two words.",
  "Somewhere, he understood, a protocol had just been advanced."
], next:"e1end"},
e1s8e: { bg:"office", ep:EP[1], speaker:"", text:[
  "He looked at her and said nothing at all.",
  "Ten seconds. Twenty. Her pen hovered. The room's hum seemed to lean in around them. There was no script for this — silence gave the machine nothing to transcribe.",
  "“We will re-schedule,” she said finally, and for just a moment she sounded uncertain. It was the most human sound he had heard all day."
], next:"e1end"},
e1end: { stats:true, epn:1, title:"Surface Tension", next:"e2card" },
